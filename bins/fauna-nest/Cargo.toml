[package]
name = "fauna-nest"
description = "The nest server for Fauna — open-source software for social communication"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
# The one derivation of `FAUNA_BUILD_COMMIT` (`src/build_identity.rs` reads it;
# the apps' Status pages stamp theirs the same way — `ui/status.md` § State &
# data shape, the build leg).
fauna-build-commit = { path = "../../libs/fauna-build-commit" }

[features]
# The excised flavor is a COMPLEMENT feature, never a command-line list
# (`dynamic-features.md` § The cargo feature spine): the store-safe build is
# `--no-default-features --features store-safe`, and a new NON-member surface is
# added to `store-safe` once and is in `default` by construction. `store-safe` is
# empty today because every other nest feature (the three bridges, test-hooks)
# is already opt-in rather than default — but it exists so the next
# session to add a default-on nest surface has the one place to put it, instead
# of silently having it excised by a `--no-default-features` store-safe build.
default = ["store-safe", "payments", "zaps", "p2p-share"]
store-safe = []
# `payments` — the first gated-feature-registry member (`dynamic-features.md`
# § Charter members). Default-ON here because a binary crate is a **flavor root**
# (§ The cargo feature spine: default-on at the roots, opt-in in the deep crates):
# a plain build ships the money plane, and excision is what a FLAVOR asks for.
# Forwarded from this feature rather than named on the `fauna-protocol` dep line —
# rule (b) — because a dep line survives `--no-default-features` and would make
# the escape hatch a silent no-op.
payments = ["fauna-protocol/payments", "dep:fauna-payments"]
# `zaps` — a SUBSET member of `payments` (`dynamic-features.md` § Charter members;
# the Damus precedent: a store may demand the zap button go while other payment
# surfaces stay). Excising `payments` excises `zaps` by construction; excising
# `zaps` alone keeps provider-rail payments.
#
# It deliberately does NOT imply `nostr`, and `nostr` does not imply it. The zap
# surfaces live inside the already-`nostr`-gated `src/nostr/` subtree, so the
# reachable surface is `nostr AND zaps` **structurally, by placement** — no cargo
# edge and no `cfg(all(...))` needed. A `zaps = ["nostr"]` edge would be worse
# than redundant: `zaps` is default-ON, so it would silently pull the nostr bridge
# into the default nest binary, which is the same class of accident as a
# default-features change reaching a consumer that opted out.
#
# It forwards `fauna-protocol/zaps` (landed by W1.5 (account-data-plane.md § Workstreams), the client-side leg) as well
# as requiring `payments`, so excising it takes the nest's own zap surfaces AND
# the zap wire types/kind strings with it. Without the forward the handlers would
# go while `fauna.nostr.zap_signers.*` stayed in the binary — measured: that is
# exactly what the first run of `nest-store-safe-check` found.
zaps = ["payments", "fauna-protocol/zaps"]
# `p2p-share` — the cross-user share plane's registry member. Default-ON because
# a binary crate is a **flavor root** (`dynamic-features.md` § The cargo feature
# spine): a plain build ships the plane, and excision is what a FLAVOR asks for.
#
# The nest's own half of this plane is the wormability walk's two obligations
# (`p2p.md` § Cross-user shared-set transfer → *Wormability walk — the share
# leg*): rule 7's capability token — advertised iff this feature is compiled, so
# an excised nest omits it and no client binds a share listener against this box
# — and rule 8's fan-out chokepoint at the share roster write, the structural
# counterparty bound that holds against a non-conforming client.
#
# It forwards `fauna-protocol/p2p-share` rather than naming the feature on the
# dep line — rule (b) of the spine — because a dep line survives
# `--no-default-features` and would make the escape hatch a silent no-op, which
# is exactly what the first store-safe `libfauna_ffi.so` measured.
p2p-share = ["fauna-protocol/p2p-share"]
# The ATProto bridge SURFACE — the XRPC/DM/media consume-side. The crate itself
# is an unconditional dep (see its line in `[dependencies]`, and why); this
# feature turns on its heavy `client` half, which is what the bridge handlers,
# the DM poller and the session store need. It no longer *brings in* the crate,
# so the authorization server's decision modules are in every flavor.
bluesky = ["fauna-bridge-atproto/client"]
nostr = ["fauna-bridge-nostr"]
activitypub = ["fauna-bridge-activitypub"]
# E2E test-harness routes (`/api/v1/test/*`), never compiled into the
# production nest binary. The mail-bridge e2e tests need a real nest but
# nothing from the legacy in-nest SMTP path (removed at the I6 cutover),
# so `--features test-hooks` alone must build clean.
# fauna-mls/test-helpers: the raw-inject hook mints
# SealedRecordBytes::carried_at_rest_unchecked to simulate a pre-Phase-3
# legacy record through the production ingest path (S6.12b).
# fauna-bridge-atproto/test-helpers: `build_oauth_client_with_origin_override`,
# which the `FAUNA_TEST_ATPROTO_FAR_END` seam (`state.rs`) routes a running
# nest's consume-side Bluesky OAuth client through to the e2e fake far end.
test-hooks = ["fauna-mls/test-helpers", "fauna-bridge-atproto/test-helpers"]
# `src/test_support.rs` — in-process test-NEST CONSTRUCTION lent to another
# crate's tests (`fauna-sync-agent`'s `tier3-nest` harnesses). Deliberately NOT
# `test-hooks`: that one makes the *running nest* serve the `/api/v1/test/*`
# automation routes, a runtime surface on the product, and reusing it here would
# drag 21 route modules plus `fauna-mls/test-helpers` into a harness that wants
# neither. `test-helpers` is the fleet-wide spelling for "this crate lends its
# construction helpers to another crate's tests" (63 sites in `libs/`).
#
# Never default, and never named on a consumer's dependency line — a consumer
# forwards it from its own test feature (e2e-automation-surface-gating.md § rule
# (b)); `fauna-sync-agent`'s `tier3-nest` does. The module's own visibility gate
# carries the `debug_assertions` arm (rule (a)), so this feature is only needed
# for a release-profile test build.
test-helpers = []

[dependencies]
# `sqlite-schema-meta`: the shared `schema_meta` single-row SQL
# `db/migrations.rs` delegates to for the two-number at-rest schema-version
# scheme — not an excisable flavor (nest's SQLite cache DB is unconditional),
# so named on the dep line rather than forwarded through a nest feature.
fauna-core = { workspace = true, features = ["sqlite-schema-meta"] }
fauna-labeler.workspace = true
# The region content plane's frame strings (`region.{blocked,collapsed}_notice`)
# — the nest-as-publisher placeholder uses the SAME words every app renders,
# so the public web page and the in-app placeholder cannot drift apart.
fauna-i18n = { path = "../../libs/fauna-i18n" }
# The `text-model` labeler's pure scorer — the one the subscriber's client runs,
# run here only as a community room's capability-holder
# (`docs/goal/architecture/content-scoring.md` § The placement matrix).
fauna-text-model.workspace = true
fauna-cbor.workspace = true
fauna-proxy-protocol.workspace = true
fauna-conn-limit.workspace = true
fauna-index.workspace = true
fauna-mail = { workspace = true, features = ["tokenizer", "post-text", "nest-segments", "outbound", "outbound-net", "multidomain", "routing", "deliverability", "warmup", "health", "lists", "spam", "body-ref", "staged-envelope", "received-header", "sender-auth", "icalendar", "parser", "dedup-key"] }
fauna-calendar = { workspace = true, features = ["nest-segments"] }
fauna-contacts = { workspace = true, features = ["nest-segments"] }
# Neither `payments` nor `zaps` is named here: both are forwarded from this
# crate's own features (see [features]), per `dynamic-features.md` § The cargo
# feature spine rule (b). A dep line survives `--no-default-features`, so naming
# them here would leave every `fauna.payments.*` / `fauna.nostr.zap_signers.*`
# kind string in a store-safe nest build while both flavors still compiled green
# — the exact failure W1 measured on `fauna-ffi`.
#
# This supersedes the interim dep-line naming W1.5 added: that commit called it
# "the MINIMUM that keeps this binary compiling" and named row 62 — this change —
# as the owner of the real nest-side carve.
fauna-protocol = { workspace = true, features = ["tls-spki"] }
# The per-set `folders.retention_policy` column's canonical serialization — the
# 2-field `RetentionPolicy { max_snapshots, max_age_days }` this crate's wizard
# writes (`backup-restore.md` § 8 RULING, consequence (ii)). The nest's auto-prune
# parses INTO the shared type rather than declaring a nest-local twin, so the
# shape has one owner and cannot drift from the writer. Light: `default = []`,
# `fauna-core` with default-features off.
fauna-folders-machine = { path = "../../libs/fauna-folders-machine" }
# Payment-provider adapter seam (monetization.md § Pillar 3): webhook
# signature verification + the PaymentEntitlement narrow waist. `optional` is
# load-bearing, not tidiness: an `optional = true` dep is the only kind cargo can
# actually leave out — a plain dep line under a gated `mod` still compiles the
# crate into the artifact, so the module gate would hide the API but not the code.
fauna-payments = { workspace = true, optional = true }
# The cross-platform serving-port reconcile policy the desktop serve loop
# (`desktop_serve`) drives — shared with the Windows `fauna-nest-service` SCM
# shell + the macOS `fauna-nest-daemon` LaunchDaemon (priority #2).
fauna-nest-supervisor.workspace = true
# The nest↔supervisor flag-file name contract. The nest is the writer; the two
# std-only supervisor shells are the readers, and they cannot depend on this
# crate — hence a zero-dependency leaf crate owning the names for all three.
fauna-deployment-flags.workspace = true
# Shared log capture: the nest installs `fauna_log::RingLayer` alongside its fmt
# subscriber so the in-memory ring backs the admin Logs view (`fauna.admin.logs`,
# observability.md § Surfaces). Same crate the apps use (priority #2).
fauna-log = { path = "../../libs/fauna-log" }
# The shared native WS substrate (adapter + keepalive + reconnect supervisor),
# parameterised over the auth handshake. Lifted out of `fauna-client` in slice 2;
# the federation channel is its second consumer (Spec Y2 slice 4 §5). The nest
# does NOT prod-depend on `fauna-client` (dev-dep only), so this shared crate —
# not `fauna-client` — is the home both channel ends consume.
fauna-ws-substrate.workspace = true
# The shared rustls preamble — `webpki_root_store` for the mail-deliverability
# STARTTLS probe. Taken directly rather than through `fauna-ws-substrate`, which
# is a full WS-transport stack and was only ever a pass-through for it.
fauna-tls-bootstrap.workspace = true
# The lean one-shot sidecar dialer (connect + `fauna.sidecar.hello` handshake) the
# `fauna-iroh-relay` binary dials with — one audited copy of the dial+handshake
# glue, which `sidecar_channel`'s own tests drive against the nest listener.
fauna-sidecar-client.workspace = true
# `send_reply_bounded` — the bounded Reply send the federation and sidecar
# channel listeners share with `PeerChannel`. Also a dev-dep for
# `conformance_account_runtime.rs`; fauna-peer-channel does not depend on
# fauna-nest, so no cycle.
fauna-peer-channel.workspace = true
# The anonymous discovery WS-RPC client. The federation channel pool resolves a
# peer's `nest_id` from its base URL via the `fauna.nest.info`
# kind over a short-lived anonymous connection (Spec Y2 slice 4 §4.D / §6 —
# `dial()` requires the expected peer `nest_id` up front). Promoted from dev-dep
# to prod-dep here; all of fauna-anon-client's transitive deps (tokio-tungstenite,
# rustls, fauna-core/protocol/provisioning, ed25519-dalek) are already nest
# prod-deps, so this adds no new transitive weight. No cycle: fauna-anon-client
# does not depend on fauna-nest.
fauna-anon-client = { path = "../../libs/fauna-anon-client" }
fauna-segment-store.workspace = true
# The cross-location segment-backup coordinator and its `SegmentSource` seam. The
# 2026-07-23 redesign moved segment backup of the nest-originated message kinds
# nest-side (design tracked internally; the owner doc is
# `docs/goal/architecture/message-segment-store.md` § Cross-location backup
# protocol), so the nest hosts `BackupCoordinator` in-process and supplies the
# local source arm (`segments::backup_source`) — a production dep, not a test
# one. Promoted
# from dev-dep here; every heavy leaf of its tree (notify, fauna-media/image,
# fastcdc, walkdir, zstd, reqwest) is already a nest prod-dep, so the added weight
# is the workspace client crates the coordinator's destination arm needs anyway.
# No cycle: fauna-sync-engine does not depend on fauna-nest.
fauna-sync-engine = { path = "../../libs/fauna-sync-engine" }
# The destination arm of that coordinator (`segment_backup`): it points a
# `SyncEngine` byte plane at each destination nest under a federation-minted
# bulk-write token, which means naming `fauna_client::AuthClient` (the
# `bearer_only` constructor — the nest holds the owner's PUBLIC actor id and no
# secret) and `fauna_nest_http::BearerSource`. Both were dev-deps until slice 3's
# source side; neither depends on fauna-nest, so no cycle, and both were already
# in the build graph through fauna-sync-engine — this only makes the use direct.
fauna-client = { path = "../../libs/fauna-client" }
fauna-nest-http = { path = "../../libs/fauna-nest-http" }
# The custody-hosting pump's per-owner custodied stores (the custodian-nest
# runtime, stage b): the pump opens a keyless `AccountStore` per hosted owner
# and drives the shared custody pull core over it. Was a dev-dep (the class-2
# conformance suites); already in the build graph through fauna-sync-engine —
# this only makes the store/backend/types modules reachable from prod code.
fauna-account-store.workspace = true
# The CARv2 record cap the segment write path must refuse to exceed — a record over
# it is refused on READ, so writing one stores mail that can never be read back
# (`segments::mail::append_record`; smtp-server.md § Message size limits).
fauna-carv2.workspace = true
fauna-update.workspace = true
fauna-mls.workspace = true
# The nest-hosted WASM plugin sandbox (`third-party.md` § Execution forms →
# WASM components): the runner (`plugin_runner`) drives it, the install leg
# compiles a fetched module with it.
fauna-plugin-host.workspace = true
# The web-serve component's capability-holder registry (web paywall, Pillar 2):
# the shared transient/authoritative grant-refresh contract over a direct
# `capability_grants` fetch (`web_content::holder`).
fauna-capability-holder.workspace = true
fauna-provisioning = { path = "../../libs/fauna-provisioning", features = ["atproto-seal", "oauth-issuer"]}
fauna-media = { workspace = true, features = ["process_media", "c2pa-detect"] }
arc-swap.workspace = true
# The OS interface table behind `acme::attached_interface_addresses` — the IP
# bridge cert's derived enable needs to know which global-unicast addresses are
# attached to this box itself (`tls-certificates.md` § B-IP). Same workspace pin
# `fauna-peer-sync` already reads its LAN candidates through.
if-addrs = { workspace = true }
notify.workspace = true
# UNCONDITIONAL, and `default-features = false` — the same edge `fauna-ffi`
# already takes (`libs/fauna-ffi/Cargo.toml`). The crate's always-on core is the
# authorization server's decision layer (`dpop`, `client_assertion`, `oauth_par`,
# `oauth_metadata`, `permission_set`, `fetch_guard`), and
# `behavior/authorization-server.md` § Goal rules the issuer is up whenever the
# nest is up, "independent of every optional bridge" — so the modules it decides
# with may not sit behind an optional-bridge feature. The heavy consume-side
# (atrium, the XRPC client, the DM poller) stays behind `client`, which the
# `bluesky` feature below turns on; a store-safe build gains only the pure core,
# whose whole dep set (fauna-core minus `network`, hex, base64, the dag-cbor
# decoder) the nest already carries.
#
# Path dep rather than `workspace = true`: the workspace entry carries the
# crate's default features, and cargo refuses `default-features = false` on an
# inheriting member. Same reason `fauna-ffi` and this manifest's own
# `[dev-dependencies]` line spell the path out.
fauna-bridge-atproto = { path = "../../libs/fauna-bridge-atproto", default-features = false }
fauna-bridge-nostr = { workspace = true, optional = true }
fauna-bridge-activitypub = { workspace = true, optional = true }
x25519-dalek.workspace = true
rand.workspace = true
lru.workspace = true
dashmap.workspace = true
async-trait = "0.1"
# Public-recursive DNS self-verification (`fauna.dns.verify_records` +
# web_content domain check) — see src/dns_verifier.rs. Default features pull the
# tokio runtime; no DNSSEC needed for the verify surface.
hickory-resolver = { workspace = true }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
blake3.workspace = true
# Sealing the nest's own opaque pagination cursors under a deployment-key subkey
# (`cursor_seal`) — nest-minted, nest-consumed, so it stays out of fauna-core.
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
axum = { workspace = true, features = ["multipart"] }
hyper-util.workspace = true
tower-http.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
rusqlite.workspace = true
uuid.workspace = true
futures-util.workspace = true
thiserror.workspace = true
argon2.workspace = true
getrandom.workspace = true
mail-parser.workspace = true
instant-acme.workspace = true
fauna-acme-http01 = { path = "../../libs/fauna-acme-http01" }
rustls.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
aws-sdk-s3 = { workspace = true, default-features = false, features = ["rt-tokio", "sigv4a"] }
# The nest supplies the SDK's HTTP client itself rather than taking either of
# `aws-sdk-s3`'s TLS features — rationale in the workspace manifest.
aws-smithy-http-client.workspace = true
toml.workspace = true
clap.workspace = true
# RFC 3339 parsing for the domain-expiry watch's RDAP `expiration` event
# (`domain_expiry.rs`). Already in the nest's artifact transitively via
# `fauna-mail`/`fauna-bridge-atproto`, so this line adds visibility, not code.
chrono.workspace = true
reqwest = { workspace = true, features = ["http2"] }
url.workspace = true
urlencoding.workspace = true
# OpenGraph/`<meta>` extraction for the D4 link-preview resolver
# (`src/link_preview/parse.rs`). `scraper` pulls its own `html5ever` (a second
# copy beside htmd's) — accepted: this parses attacker-controlled third-party
# HTML, where a full browser-grade tree-builder is correct and a hand-rolled
# tokenizer scan is exactly where subtle bugs land. `scraper` is mainstream +
# audited, so the supply-chain cost is small next to that correctness win.
scraper = "0.27"
governor.workspace = true
base64.workspace = true
zip.workspace = true
zstd.workspace = true
tar.workspace = true
sha2.workspace = true
# The DPoP nonce is a MAC over its window rather than a stored random token
# (`oauth_as_state`), so the authorization server needs HMAC directly. Already
# in the nest's artifact transitively via `fauna-payments` (a default feature),
# so this line adds visibility, not code — the `chrono` pattern above.
hmac.workspace = true
p256.workspace = true
p384.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
bytes.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
handlebars = "6"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
mime_guess = "2"
rcgen = "0.13"
x509-parser = "0.16"
serde_bytes = "0.11"
zeroize.workspace = true

# statvfs for the blob-store free-space disk guard (DiskBlobStore::available_bytes).
# Unix-only: rustix::fs (and statvfs) is `#[cfg(not(windows))]`, and the guard
# protects the Linux deploy target — a Windows nest only runs in the tier_3 e2e
# suite and fails-open. The non-Unix branch needs no rustix.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# `fauna_nest::test_support` — this crate lending its own integration tests the
# in-process test-nest builders it also lends `fauna-sync-agent`. The module's
# gate carries a `debug_assertions` arm, so a plain `cargo test -p fauna-nest`
# would compile without this line; the self dev-dependency is what keeps a
# **release-profile** test run (`cargo test --release`) compiling, since
# `debug_assertions` is off there and `cfg(test)` is *not* set on the
# crate-under-test when an integration test links it. Established shape — 13
# `libs/` crates do exactly this (`fauna-onboarding-machine`,
# `fauna-client-mail-settings`, `fauna-client-dns`, …); the production lib and
# binary builds stay feature-clean.
fauna-nest = { path = ".", features = ["test-helpers"] }
# `fauna_protocol::test_transport::{MpscTransport, make_pair}` — the shared
# in-memory dispatcher test double this crate's own test modules once
# hand-rolled independently (`sidecar_channel`,
# `federation_channel`). Same re-declaration pattern as the entries below:
# reaches a test build without ever reaching the shipped binary.
fauna-protocol = { workspace = true, features = ["test-helpers"] }
fauna-acme-http01 = { path = "../../libs/fauna-acme-http01", features = ["test-helpers"] }
# `nip17::wrap_dm_with_rumor_recipient` — the adversarial gift-wrap constructor
# the inbound bridge-DM gate's pins need, so a test can forge the rumor `p` tag
# a hostile sender picks. The re-declaration is how the feature reaches a test
# build without ever reaching the shipped binary (the fauna-acme-http01 pattern
# above); it is inert unless the `nostr` feature also brings the crate in.
fauna-bridge-nostr = { path = "../../libs/fauna-bridge-nostr", features = ["test-helpers"] }
# `test_support`'s dag-cbor + CID fixture helpers (the same pairing
# fauna-bridge-atproto's own record_refs/reverse_translate fixtures use).
# default-features = false keeps the heavy `client` feature (atrium-api,
# reqwest, tokio, dashmap, …) out of every fauna-nest test build that doesn't
# separately request it via `--features bluesky`.
fauna-bridge-atproto = { path = "../../libs/fauna-bridge-atproto", default-features = false, features = ["test-helpers"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
# `conformance_account_state_walk` drives two REAL account-store replicas
# against the nest's own class-2 feed handlers, which is the only place the
# W2.4 client walk and the W2.3 nest side meet in one process. (The store
# crate itself moved to [dependencies] with the custody-hosting pump.)
# The F2 round-trip tests build `app.bsky.feed.post` records through the same
# dag-cbor encoder the Go bridge uses (indigo's `JSONRecordToDagCBOR`), so the
# fixtures exercise the real byte shape rather than a Rust struct literal.
serde_ipld_dagcbor.workspace = true
# The F2.4 media fixtures additionally carry dag-json CID links (`{"/": …}`),
# which must land as tag-42 links — same pairing fauna-bridge-atproto's own
# fixtures use.
ipld-core = { version = "0.4", features = ["serde"] }
# `auth-ceremony`: onboarding_ws_rpc_roundtrip.rs drives the nest-binding read
# (`nest_trust::read_login_binding`) against the real nest_handshake handler.
fauna-client-core = { path = "../../libs/fauna-client-core", features = ["auth-ceremony"] }
# conformance_path_sealing.rs drives the SHARED snapshot read client
# (`SnapshotsClient` — the one every app's snapshot browse routes through) over
# an in-process requester bound to the real handlers, so the sealed-first render
# is proven against the actual `fauna.filesync.snapshot.{get,diff}` replies
# rather than a hand-built reply literal. Dev-dep only; the crate does not
# depend on fauna-nest, so no cycle.
fauna-client-snapshots = { path = "../../libs/fauna-client-snapshots" }
# (fauna-anon-client is now a prod-dep — see above — so its test consumers
# `anonymous_client_roundtrip.rs` / `onboarding_ws_rpc_roundtrip.rs` use it from
# there; no separate dev-dep entry needed.)
# onboarding_ws_rpc_roundtrip.rs drives the shared `WsRpcNestApi` (the onboarding
# machine's WS-RPC nest surface) over the native anonymous connector against an
# in-process nest. Dev-dep only; fauna-onboarding-machine does not depend on
# fauna-nest, so no cycle.
fauna-onboarding-machine = { path = "../../libs/fauna-onboarding-machine", features = ["test-observer"] }
# launch_machine_auth_roundtrip.rs drives `LaunchMachine` (its production
# `WsAuthConnector`) through the silent-challenge + handshake-refresh flow over
# the real anonymous WS-RPC connection against an in-process nest. test-helpers
# gives InMemoryPersistence. Dev-dep only; fauna-launch-machine does not depend
# on fauna-nest, so no cycle.
fauna-launch-machine = { path = "../../libs/fauna-launch-machine", features = ["test-helpers"] }
# conformance_actor_by_handle_client.rs connects an AUTHENTICATED `NestClient`
# over a real socket to an in-process nest and drives the conversations
# address-resolution adapter (`FaunaMlsBackend::resolve_address` →
# `NestConversationsRpc` → `fauna.actor.by_handle` + `keypackage.count`)
# end-to-end — the first real-wire test of the conversations client surface
# (tier_1's MockNest can't catch the cross-binary request/reply mapping). These
# four are client/shared crates that do not depend on fauna-nest, so no cycle.
# (`fauna-client` itself is now a prod dep — see the segment-backup destination
# arm note in [dependencies]; a [dependencies] entry is visible to tests too.)
