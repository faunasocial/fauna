# conformance_account_plane_bind.rs reads an account store thread's stack
# high-water under the linked nest's login dial: it drops the thread's unused
# stack pages (`madvise`) before the dial and reads which came back afterwards
# (`/proc/self/pagemap`), so the reading is the dial's own. Linux only — the
# page table read has no portable form.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

# The S8 D5 at-rest byte-scan proof calls the test-hooks-gated D4 scrub
# (`CacheDb::scrub_plaintext_where_sealed`), so its target only builds with
# that feature — the crate's first explicit [[test]] block (every other test
# file stays auto-discovered). Run:
# `cargo test -p fauna-nest --test conformance_at_rest_byte_scan --features test-hooks`.
[[test]]
name = "conformance_at_rest_byte_scan"
required-features = ["test-hooks"]

# The AP discovery surface through the full `build_router` — merged only under
# the feature, so without it every path falls to the landing page by design.
# Run: `cargo test -p fauna-nest --test ap_serving_router --features activitypub`.
[[test]]
name = "ap_serving_router"
required-features = ["activitypub"]

# The B5 windowed-holder proof needs the same feature for the opposite reason,
# and that difference is why it went unguarded for five weeks: its dependency on
# `test-hooks` is at RUNTIME, not compile time. It POSTs to
# `/api/v1/test/content/inject_epoch_sealed_mail`, a route
# `content_seal_epoch_test_hook::routes()` only merges under the feature, so
# without it the target compiles and RUNS — the request falls through to the
# static fallback, comes back 200 with a non-JSON body, and the test dies on an
# opaque `reqwest::Error { kind: Decode }` three lines later. Its sibling above
# fails to *compile* without the feature, which is what forced someone to
# declare it; nothing forces a runtime dependency, so `cargo test -p fauna-nest`
# has been reporting this target red since 2026-07-18 while
# `cargo check -p fauna-nest --tests` stayed green. Guarded here so the target is
# skipped rather than misleadingly red, and run for real by the
# `nest-testhooks-check` gate.
[[test]]
name = "conformance_content_sealing_epochs_client"
required-features = ["test-hooks"]

# The four `desktop_serve` loop proofs below have the SAME runtime dependency the
# target above has, arriving from the other direction: each sets
# `FAUNA_INSECURE_DISABLE_TLS=1` and then dials the loop it spawns over `http://`.
# That escape became `test-hooks`-gated when the plain-HTTP arm was compiled out of
# the two shipped desktop shells (`fauna-nest-service`, `fauna-nest-daemon`) — so
# without the feature these targets still COMPILE, but the loop they start serves
# HTTPS from the self-signed floor and every `http://` request dies on a protocol
# error rather than on the assertion under test.
#
# Declaring the dependency makes cargo SKIP them instead (silently, exit 0, the
# same trapdoor documented above) and `nest-test-hooks` runs them for real. Adding
# a target here without adding it to that recipe is how coverage disappears: the
# recipe is the feature's only real runner.
[[test]]
name = "desktop_serve_loop"
required-features = ["test-hooks"]

[[test]]
name = "desktop_serve_loopback"
required-features = ["test-hooks"]

[[test]]
name = "desktop_serve_port_change_loopback"
required-features = ["test-hooks"]

[[test]]
name = "index_survives_nest_restart"
required-features = ["test-hooks"]

# Same whole-boot harness (`run_serve_loop` over plain HTTP), same gate.
[[test]]
name = "owed_web_render_drained_at_boot"
required-features = ["test-hooks"]

# `fauna.protocol.echo` is served only by a `test-hooks` build (`src/lib.rs`'s
# `protocol_test` gate), so its WebSocket round-trip proof needs the feature.
[[test]]
name = "echo_round_trip"
required-features = ["test-hooks"]
