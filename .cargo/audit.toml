# cargo-audit's own exception list — deliberately EMPTY (release-integrity.md § Dependency
# verification → *The release attempt's advisory reading*, owner-ruled 2026-10-17).
#
# cargo audit itself grades nothing: every finding reaches the advisory check,
# which grades it against the maintainers' recorded exceptions — one entry per
# (advisory, crate, version), with a reach pass's evidence or the owner's approval. An id
# listed here would hide an advisory on every version of every crate it names, and no
# reading would ever see it again. Never add one.

[advisories]
ignore = []
