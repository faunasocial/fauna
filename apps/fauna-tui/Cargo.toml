[package]
name = "fauna-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
# The terminal app ships as per-OS release archives (and inside the macOS .pkg
# and Windows MSI) — NEVER through a language registry: `cargo install` was
# refused as a channel (installers/tui.md § Decisions, user ruling 2026-09-26),
# because it would publish this crate and the whole libs/fauna-* tree as a
# second, unattested public surface. This makes the refusal mechanical.
publish = false

[build-dependencies]
# The one derivation of `FAUNA_BUILD_COMMIT` — the commit the Status page's
# `status-build-sha` names (`ui/status.md` § State & data shape, the build leg).
fauna-build-commit = { path = "../../libs/fauna-build-commit" }

[features]
# ── the flavor split (`dynamic-features.md` § Platform-family surface excision) ─
# An app binary IS a flavor root, so the switch belongs here rather than on a
# dep line. Same two-halves shape as `fauna-ffi` / `fauna-wasm` / `fauna-nest`:
# `default` = the store-safe complement PLUS the registry members a flavor may
# excise, so a new non-registry surface is added to `store-safe` once and is in
# `default` by construction — there is no second list to keep in sync, which is
# precisely how an escape hatch is found broken on the day it is needed.
#
# The excised flavor is `--no-default-features --features store-safe`
# (`just tui-store-safe` / the `tui-store-safe-check` witness).
default = ["store-safe", "payments", "zaps", "p2p-share"]
# Every tui surface that is NOT a gated-feature-registry member. Legitimately
# EMPTY today — this crate's only other root feature is `e2e-agent`, which is
# never default-on. It exists anyway, for the reason `fauna-wasm`'s equally
# empty complement does: the day a non-registry default feature is added here,
# the bare `--no-default-features` spelling would silently drop it from the
# store-safe build — a regression that fails no build, because both flavors
# still compile.
store-safe = []
# ── the `payments` registry member (dynamic-features.md § Charter members) ────
# The money plane's tui surface: the author's payment-provider config and manual
# claim codes (profile Tiers §§4-5), the buyer's claim redemption (Settings →
# Subscriptions), and the post tip display (`monetization.md` § Tips).
#
# Rule (b) of the two-halves spine: both members forward from HERE rather than
# riding their dep lines, so `--no-default-features` genuinely drops the plane
# instead of re-acquiring it through cargo's unconditional dep-line features.
# `fauna-feed/payments` gates one thing there — `FeedManager::resolve_post_tips`
# — which is what makes `PostSummary.tips` stay `None` forever in this flavor;
# the field itself is ungated and inert by design, so the tip RENDER must carry
# its own `#[cfg]` too. An inert record whose ids still ship is exactly the trap
# § What "completely compiled away" means item 2 names (`TipView` turned
# `ffi-store-safe-check` red on 2026-08-11 with no sender anywhere in the graph):
# criterion 1 is a `strings`-grep for ELEMENT IDS, and a dead render still
# carries them.
payments = ["dep:fauna-client-payments", "fauna-feed/payments"]
# ── the `zaps` registry member (dynamic-features.md § Charter members) ────────
# A SUBSET member of `payments`: the NIP-57 Lightning plane's tui surface — the
# payee's zap-signer trust root on the Nostr page (`monetization.md` § Zap
# receipts — the trust model). It requires `payments` because a zap's only
# consequences ARE payments-plane surfaces, so excising the money plane excises
# this with it; excising `zaps` alone keeps provider-rail payments, which is the
# finer-grained hatch the Damus precedent shows a store actually demands.
#
# Rule (b) of the two-halves spine again: the shared client's own `zaps` feature
# forwards from HERE, not from its dep line, so `--no-default-features` genuinely
# drops the plane instead of re-acquiring it through cargo's unconditional
# dep-line features. `fauna-client-nostr/zaps` carries the
# `fauna.nostr.zap_signers.*` client AND (via `fauna-protocol/zaps`) the wire
# types, so both halves ride the one switch.
#
# The excision criterion that bites is the one `payments` documents above: a
# dead render still carries its ELEMENT IDS into a `strings`-grep, so the render
# site carries `#[cfg]` too, not just the glue. ui.yaml's `gated_features:` block
# declares the `nostr-zap-signer-` prefix that names them.
zaps = ["payments", "fauna-client-nostr/zaps"]
# ── the `p2p-share` registry member (dynamic-features.md § Charter members) ───
# The co-present offline share-initiation ceremony's tui surface (`p2p.md`
# § Offline share initiation) — `crate::offline_share` and the Folders page's
# eight `offline-{share,receive}-*` elements.
#
# Rule (b) again: it forwards from HERE, not from the dep line, so
# `--no-default-features` genuinely drops the plane instead of re-acquiring it
# through cargo's unconditional dep-line features. The excision criterion that
# bites is the same one `payments` documents — a dead render still carries its
# ELEMENT IDS into a `strings`-grep, so the render sites carry `#[cfg]` too,
# not just the glue.
#
# `fauna-iroh` is deliberately NOT named here: it is already an unconditional
# dep for the same-account peer-sync leg (`session.rs`'s `peer_transport`
# factory), so making it optional would break a surface this feature has
# nothing to do with. The ceremony reuses that dep for its own actor-keyed
# endpoint.
p2p-share = [
    "fauna-client-capabilities/p2p-share",
    # The transfer plane's shared halves: the pump + serve stores
    # (fauna-sync-engine), the M2 roster consult over Arc<MlsEngine>
    # (fauna-client-folders — its own `mls` feature is unconditional above),
    # and the share client crate itself (the sixth sink's refuse-not-repair
    # binding + the bind door's membership seam).
    "fauna-sync-engine/p2p-share",
    "fauna-client-folders/p2p-share",
    "dep:fauna-peer-share",
    # The host's shared half — the five app-agnostic `SharePlaneHost` answers
    # and the durable advertisement sink, lifted out of `share_glue.rs`
    # 2026-08-27. A leaf only share-plane hosts link, so it rides this feature
    # exactly as `fauna-peer-share` does.
    "dep:fauna-client-share-host",
]
# Escape hatch to build the e2e test-agent/automation surface into a
# --release profile (debug_assertions off). Never default-on; a release-
# profile e2e build turns this on explicitly (testing.md convention 15).
# Forwards to fauna-client-backup so its native_store clock-offset seam is
# also compiled in (backup_audit.rs re-exports it), and to fauna-sync-engine so
# the FAUNA_E2E_DEBOUNCE_MS override (always_resident.rs) is compiled in too.
#
# The shared crates' `test-helpers` seams forward from here too, rather than riding
# their dep lines unconditionally: a debug build reaches them through each crate's
# own `debug_assertions` arm (`just tui-debug` and the e2e harness pass no
# features), so naming them here is what makes a **release-profile** e2e build
# possible while a plain `--release` build strips them from the binary.
# `docs/goal/architecture/testing.md` convention 15.
e2e-agent = [
    # The agent itself: the HTTP server this crate's `automation` module hosts,
    # the op routing, and the actuation gate with its three `FAUNA_E2E_*` reads.
    # The dep line below stays unconditional (a debug build must reach the agent
    # and Cargo cannot condition a dependency on `debug_assertions`), so this
    # forward is the ONLY thing that puts the surface into a release-profile e2e
    # build — and its absence is what keeps a plain `--release` tui from linking
    # the agent at all, rather than trusting `--gc-sections` to drop it.
    "fauna-e2e-agent/e2e-agent",
    "fauna-client-backup/e2e-agent",
    # The Nests trust facet's render clock (`trust_clock`) — grant liveness and
    # custody receipt freshness, moved by `trust_facet_advance_clock`.
    "fauna-client-capabilities/e2e-agent",
    "fauna-sync-engine/e2e-agent",
    # `device_set_state_json` (fleet-removal convergence read) — the
    # release-profile e2e escape hatch; a plain debug build already reaches it
    # via `debug_assertions`.
    "fauna-client-account-runtime/e2e-agent",
    # The FAUNA_E2E_REGION_REGISTRY seed — the synthetic authority a tier_3
    # region journey trusts (`fauna_client_region::effective_registry`).
    "fauna-client-region/e2e-agent",
    # The FAUNA_E2E_CREDENTIAL_DIR store redirect — where the identity secret
    # is read and written; also FAUNA_E2E_FORCE_HEADLESS_STORE (the sealed-arm
    # forcing the tui headless constructor honours in test builds).
    "fauna-credential-store/e2e-agent",
    "fauna-atproto-settings-machine/e2e-agent",
    # The nest **dial** override — which URL the authenticated session opens a
    # socket to. Named explicitly even though
    # `fauna-onboarding-machine/test-helpers` below already forwards it, because
    # this crate calls `resolved_dial_url` at its own wizard and store-read
    # sites: the forward must not become implicit on a sibling's feature list.
    "fauna-launch-machine/e2e-agent",
    # The FAUNA_E2E_SUPPRESS_CONV_PUSH push-arm kill-switch (`conv_push_source`)
    # — the layer-5 missed-push proof's only lever. A debug build keeps it via
    # `debug_assertions`; this forward is what keeps a RELEASE-profile e2e build
    # able to run the drain-alone shape (convention 15).
    "fauna-client-conversations/e2e-agent",
    # `ScreenLockCore::advance_test_clock`/`advance_test_clock_silently` —
    # convention 14's fake clock for the screen-time lock (shared with linux).
    "fauna-core/e2e-agent",
    # The mail-import wizard's source-IMAP trust seed
    # (FAUNA_E2E_IMAP_EXTRA_CA_PEM) — `fauna-client-mail-settings` forwards it
    # down to `fauna-mail`, whose `NativeImapConnector::new` is the one door
    # every native consumer builds its source trust store through. Without it a
    # release-profile e2e tui cannot verify the harness's fake IMAP source, and
    # § The two TLS modes leaves no plaintext alternative.
    "fauna-client-mail-settings/test-helpers",
    # `ArchiveImportMachine::set_test_pause_after_records` — the e2e
    # restart-resume journey's causal anchor (convention 14), armed by the
    # `archive_import_pause_after` automation command. A debug build reaches it
    # through the crate's own `debug_assertions` arm; this forward keeps a
    # RELEASE-profile e2e build able to run that journey.
    "fauna-archive-import-machine/test-helpers",
    # The **registry** arms of the E2E bridge
    # (`call_registry_method_for_test`) — the account slots no free dispatcher
    # can reach, since the registry is built from this app's own `SecretStore`.
    # A debug build keeps them via `debug_assertions`; this forward is what lets
    # a RELEASE-profile e2e tui drive them (convention 15), and without it the
    # `automation.rs` delegation would not compile in that flavor at all.
    "fauna-client-accounts/test-helpers",
    # `run_alert_sweep_loop_wakeable` — the critical-alert loop with its
    # six-hour wait raceable by the `alert_sweep_wake` command (convention 14).
    # A debug build reaches it through `debug_assertions`; this forward keeps a
    # RELEASE-profile e2e tui able to compile `critical_alerts`' e2e arm.
    "fauna-client-alert-sweep/test-helpers",
    # `NestClient::set_reconnect_backoff_for_test` — the `reconnect_backoff`
    # command's pace override (convention 14's lever for the Cannot-connect
    # journey). Debug builds reach it through `debug_assertions`.
    "fauna-client/e2e-agent",
    "fauna-client-sync/test-helpers",
    "fauna-conversations/test-helpers",
    "fauna-feed/test-helpers",
    "fauna-onboarding-machine/test-helpers",
    "fauna-onboarding-machine/test-observer",
]

[[bin]]
name = "fauna-tui"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("e2e-agent", "store-safe", "payments", "p2p-share"))',
] }

[dependencies]
# Shared string table generated from i18n/strings/en.yaml (`just i18n-generate`).
# tui consumes the shared crate directly — no per-app generated strings file
# (priority #2). linux joined it 2026-08-19, re-exporting this crate as its own
# `crate::i18n::strings`; its former byte-identical emit_rust twin is deleted, so
# the generator now has exactly one Rust target.
fauna-i18n = { path = "../../libs/fauna-i18n" }
fauna-ui-ids = { path = "../../libs/fauna-ui-ids" }
# Shared in-process log capture: the `RingLayer` + rolling-file subscriber
# (`init_with_stderr`, stderr suppressed while the tui owns the screen) and the
# `snapshot`/`clear`/`format` surface the Settings → Logs page renders
# (observability.md § Surfaces). Native default features only.
fauna-log = { path = "../../libs/fauna-log" }
# Shared WS-RPC connection-supervisor types. The `connection-status` element
# (ui.yaml) renders `supervisor::ConnectionState`; the supervisor itself arrives
# with NestClient at the login milestone.
fauna-ws-substrate = { workspace = true }
# Identity (ActorKeypair) — direct Rust, no FFI (login.md § Keypair generation).
# `qr_render` builds `fauna_core::qr_matrix` (the shared boolean QR grid the
# Settings identity-export section paints — settings.md § Identity export; the
# same feature linux enables), off by default so the nest never links a QR encoder.
# `network`: the succession witness resolves a peer's handle domain to a
# dialable nest (SRV-aware `resolve_full_url`) before the anchored chain walk.
fauna-core = { workspace = true, features = ["qr_render", "local-clock", "network"] }
# The per-actor WS-RPC channel: connection lifecycle, auth handshake, reconnect
# supervisor — all shared (common.md § WS-RPC client binding).
fauna-client = { workspace = true }
# Multi-account registry + SecretStore seam (shared account/migration logic).
fauna-client-accounts = { workspace = true }
# The Settings account root (`ui/settings.md`): `fauna.quota.get` (the quota
# section), `fauna.profile.handle.change` (handle change), account delete — the
# shared typed `AccountClient<R>` surface, consumed directly like linux's
# `client.rs` (priority #2).
fauna-client-account = { path = "../../libs/fauna-client-account" }
# The shared typed `AdminClient<R>` surface (`admin.md` § Where logic lives) —
# the admin shell's dashboard stats + (future slices) users/tiers/nest go
# through it, exactly like linux/web, never a per-app admin RPC (priority #2).
fauna-client-admin = { path = "../../libs/fauna-client-admin" }
# The shared typed `fauna.bridges.*` surface — the standalone Nostr page's whole
# control plane (`ui/nostr.md` § WS-RPC migration contract: link / unlink /
# set_settings / list / list_follows / add_follow / remove_follow, keyed
# `bridge_id:"nostr"`). Consumed directly like linux's `nostr_tab.rs`, no FFI
# hop (priority #2); also carries `nostr_key_source_label`, the one shared
# stored-signing-mode → localized-label map every app renders.
fauna-client-bridges = { path = "../../libs/fauna-client-bridges" }
# The NIP-46 bunker roster control plane —
# `fauna.nostr.bunker.{create_invite,list,revoke,set_label}` behind the shared
# typed `NostrBunkerClient`, driving the Nostr page's *Connected apps* section
# (`ui/nostr.md` § The nest as the user's NIP-46 signer). Direct Rust like
# linux's `connected_apps_group`, no FFI hop. DMs are not this crate's: they
# are bridged rooms on unified Conversations, never this page (§ Layout & flow
# note 5).
fauna-client-nostr = { path = "../../libs/fauna-client-nostr" }
# Settings → Push notifications: the shared registration state machine (the
# install intent bit, the which-actor record, the leave-shape drops) the
# `ws-device` row rides (`common.md` § Push Notifications → *Registration*).
fauna-client-push = { path = "../../libs/fauna-client-push" }
# The shared account-store seams and helpers + the shared box-recovery
# projections (`recoverable_box_ids`, `selfhosted_recovery_command_for`) the
# `nest_recovery` / `recover_selfhosted_instructions` pages read
# (box-recovery.md § Recovery UI (step 4)).
fauna-client-config = { path = "../../libs/fauna-client-config" }
# The post-succession aftermath's leg 4 — `remint_capability_grants` plus its
# `GrantRemintProgress` projection, driven from the post-auth hook beside legs
# 1 and 2 (`succession-aftermath.md` § Re-key scope, the capability-grants row).
# `local-clock` for `custody_receipt_status_text`/`custody_held_bytes_text`
# (`view_model.rs`) — the same feature this crate already turns on directly on
# `fauna-core` below, forwarded one hop.
fauna-client-capabilities = { path = "../../libs/fauna-client-capabilities", features = ["local-clock"] }
# The share plane's client crate — `p2p-share` only (the fauna-sync-engine
# feature-note pattern: consumers gate their dep on their own feature).
fauna-peer-share = { workspace = true, optional = true }
# The share-plane host's shared half (`p2p.md` § Cross-user shared-set transfer
# → *What a leg still writes*): `ShareHostSeams` + the durable sink. Same gate.
fauna-client-share-host = { path = "../../libs/fauna-client-share-host", optional = true }
# The `ShareIngestDoor` seam's error contract (share_pump's Result); the
# agent adapter in sync_agent.rs implements it.
anyhow = { workspace = true }
# The T16 custody facet's ACT half (`ui/devices.md` § Custody facet): the five
# gestures' shared assembly + the `drive_ceremonies` pass, lifted out of this
# app 2026-08-17 so the other six legs share it. The
# PURE half (the folds) comes from fauna-client-capabilities above — the split
# exists because this crate is native-only and that one is wasm-clean.
fauna-client-custody = { path = "../../libs/fauna-client-custody" }
# The Personalization home's Trained topics facet (`behavior/topic-factors.md`
# § Authoring surface): `TrainedTopics` owns the four gestures AND the
# registry<->model-plane sequencing they span. Consumed directly like linux's
# `views/personalization/`, no FFI hop (priority #2).
fauna-client-personalization = { path = "../../libs/fauna-client-personalization" }
# The Backups page's RESTORE half (`ui/backups.md` §§ Restore history / Restore
# divergence / Restore from backup destination): the typed
# `fauna.filesync.snapshot.{list,list_restore_history,list_restore_divergence,
# restore_message_kind}` surface behind `SnapshotsClient`. Consumed directly
# like linux's `views/backups/restore.rs`, no FFI hop (priority #2) — the goal
# doc's § Where logic lives puts every one of those calls in this crate and
# keeps only the render rules per-app.
fauna-client-snapshots = { path = "../../libs/fauna-client-snapshots" }
# The gated Family page (`family-safety.md` § App surface): the typed
# `fauna.family.*` surface — the one `status` read both roles render from, the
# guardian's approvals queue + reach/content-policy update, contact
# pre-approval, and the graduate/transfer handshake. Consumed directly like
# linux's `views/family.rs` (priority #2, no FFI hop); the option catalogs,
# fail-closed label lookups and summary composers ride `fauna_core::format`.
fauna-client-family = { path = "../../libs/fauna-client-family" }
# The region content plane's app side (`region-blocking.md` § The content
# plane): the declared-region contract, the device record, the relay
# fetch-and-verify, the render's third rule source and the bundled scorers
# (through `fauna_labeler::region`). tui owns only the locale leaf and paint.
fauna-client-region = { path = "../../libs/fauna-client-region" }
# Three consumers: `build_linked_nests_machine(..)` backs the Settings → Nests
# page (2026-07-24) and resolves the just-connected nest's own `nest_actor_id`,
# and `native_backup_{destination_connector,
# inclusion_source}` supply the Backups page's audit pass with the two seams it
# does NOT implement itself (`ui/backups.md` § Audit-alert surface — "native
# apps call `fauna_client_pair::native_backup_inclusion_source`").
fauna-client-pair = { path = "../../libs/fauna-client-pair" }
# `conversations-witness`: the in-group succession witness `conv_backend`
# registers on the conversations session (`identity-succession.md`
# § Propagation → MLS groups). `aftermath`: the ordered post-succession pass
# `session.rs::spawn_succession_aftermath` spawns at every sign-in — the
# legs were already shared, the ORDER was not until the module landed.
fauna-client-recovery = { path = "../../libs/fauna-client-recovery", features = [
    "conversations-witness",
    "aftermath",
] }
# The succession-witness chain-source seam is dyn-dispatched, so its impl boxes
# its future.
async-trait = "0.1"
# The anonymous (pre-identity) connector, for exactly one caller: verifying a
# succession on the launch `superseded` screen. A refused identity cannot
# authenticate, so the chain fetch that names the successor as fact rather than
# as the nest's claim has to ride `succession.lookup` / `registration.chain` —
# both pre-identity kinds (`identity-succession.md` § Propagation).
fauna-anon-client = { path = "../../libs/fauna-anon-client" }
# Host-address reporting (`fauna.dns.set_host_address`) at admin confirmation —
# `host_address::report_host_address` + `NativeHostAddressProbe`, the same shared
# decision fn linux/apple/android/web drive (`domains-and-tls-bootstrap.md`
# § Host-address acquisition). No new logic here; tui was the last client without
# a call site. `local-clock` for `cert_status_text`'s expiry-date rendering
# (the `uniffi` scaffolding is for fauna-ffi only).
fauna-client-dns = { path = "../../libs/fauna-client-dns", features = ["local-clock"] }
# The client-side backup audit loop (`audit::run_audit_pass` + the
# `AuditStateStore` seam this client backs with a JSON file) driving the Backups
# page's `backup-destination-last-audit-time` / `backup-audit-alert` surface.
# All verdict logic is shared Rust; this client supplies persistence + rendering.
# `local-clock`: `row_text`'s resolved-row-text helpers (native-only).
fauna-client-backup = { path = "../../libs/fauna-client-backup", features = ["local-clock"] }
# The shared feed snapshot + its mutations (`feed.md` § State & data shape): the
# `FeedManager` is the whole read model + compose + feed/bridge mutations. cli is
# the SECOND direct-Rust consumer (linux is the first) — `FeedManager<Arc<NestClient>>`,
# no FFI hop. The `feed_inject_posts` seam the cross-app tier_2 suites drive is
# reached in debug via the crate's own `debug_assertions` arm and in a
# release-profile e2e build via this crate's `e2e-agent` feature — not enabled
# unconditionally (testing.md convention 15), exactly as linux does it.
#
# `payments` turns on `FeedManager::resolve_post_tips`, the tip surface's one
# gated member (`dynamic-features.md` § Charter members — tips are a buy-side
# gate surface). It is NOT named here: the flavor switch landed 2026-08-14, so this crate's own `payments` feature forwards it —
# an app binary IS a flavor root, and rule (b) of the two-halves spine keeps the
# forward off the dep line so `--no-default-features` genuinely drops the plane.
fauna-feed = { workspace = true }
# The shared retry-with-delay loop the engagement-cue rollup hydrate rides at
# session start — linux's `hydrate_with_retry` delegates to the same one.
fauna-sleep = { path = "../../libs/fauna-sleep" }
# The Task-delegation sub-page's shared view-model (`TaskDelegationView` composes
# the `fauna.state.delegation` pins + the live fauna.delegation.observe lease into the
# rendered rows, and owns the picker's option set as a correctness surface).
# Direct Rust, no FFI hop — the 2nd direct consumer after linux. NOT the `driver`
# feature: tui ships no lease loop, so it renders the surface as ViewerOnly.
fauna-client-delegation = { path = "../../libs/fauna-client-delegation" }
# The community-labeler catalog state machine (`content-moderation-and-ranking.md`
# § Tier-3): one snapshot drives BOTH the Personalization home's subscribed facet
# and the labeler-catalog page. `rpc-glue` is what brings the production
# `build_labeler_catalog_machine_with_grants` over the live `fauna.labelers.*` WS-RPC seam —
# without it only the fake nest-api is compiled. Direct Rust, no FFI hop: the 2nd
# direct consumer after linux.
fauna-labeler-catalog-machine = { path = "../../libs/fauna-labeler-catalog-machine", features = [
    "rpc-glue",
] }
# The connected-apps page machine (`ui/connected-apps.md`): the one roster, the
# Requests tray, the typed-code start and the per-row revoke verb. `rpc-glue`
# brings the production WS-RPC seam. tui is the lead app — the first consumer.
fauna-client-connected-apps = { path = "../../libs/fauna-client-connected-apps", features = [
    "rpc-glue",
] }
# The canonical create-feed rule catalog (`rule_type_options`): wire value +
# localized label + `RuleInputKind` per type, so the rule-builder shows only the
# widgets the selected type's encoder arm reads — the same source linux binds
# (`feed.md` § Where logic lives → Feed rule-builder presentation).
fauna-client-feed = { path = "../../libs/fauna-client-feed" }
# `fauna.posts.interact` — the interaction bar (like/reply/repost/quote) is client
# glue on every app, deliberately NOT a FeedManager method (`feed.md` § User actions).
fauna-client-posts = { path = "../../libs/fauna-client-posts" }
# The shared unified-conversations read model + mutations (`conversations.md`
# § State & data shape). Unlike `FeedManager<R>`, `ConversationsManager` is NOT
# generic — the tui consumes `Arc<ConversationsManager>` directly, in-process, the
# same way linux does (priority #2, the 2nd direct-Rust consumer). The
