# These two crates spell their seam opt-in `e2e-agent` rather than
# `test-helpers` (their gates read `any(debug_assertions, feature = "e2e-agent")`).
fauna-client-backup = { path = "../../libs/fauna-client-backup", features = ["e2e-agent"] }
fauna-atproto-settings-machine = { path = "../../libs/fauna-atproto-settings-machine", features = [
    "e2e-agent",
] }
# `test-util` gives the drafts autosave tests tokio's paused clock, so the
# 1.5 s debounce is asserted on virtual time — a latency-independent assertion
# rather than a real 1.5 s sleep per test (testing.md convention 14).
tokio = { workspace = true, features = ["test-util"] }
# The admin-logs ANSI pin installs a thread-scoped `RingLayer` subscriber so a
# real `tracing` emit drives the ring → format_line → element-text path — the
# pin must never hand-construct (pre-sanitized) ring entries.
tracing-subscriber = { workspace = true }
# The UI-path walk harness (`src/walk.rs`): randomized multi-step walks over
# the App state machine with shrinking to a minimal failing step sequence.
proptest = { workspace = true }
# Isolated temp dirs for the client-local prefs round-trip + the external-media
# fake-handler spawn tests (never touches the developer's real config dir).
tempfile = { workspace = true }
# account_scope's never-adopted pin seeds a real (if empty) flat SQLite file.
# Test-only: production SQLite goes through fauna-sync-engine, which owns the
# real rusqlite dependency.
rusqlite = { workspace = true }
