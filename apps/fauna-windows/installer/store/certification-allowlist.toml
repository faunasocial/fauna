# Windows App Certification Kit tests a Store package may fail without failing its
# build: read by scripts/grade-store-certification.py, the grade the public
# release-store-windows.yml workflow runs on each package's certification report
# (docs/goal/architecture/installers/windows.md § Store distribution (MSIX) →
# Build & packaging shape).
#
# An entry is for a test that cannot apply on a hosted runner, or to a package the
# Store signs at certification and this build only test-signs — never for a
# defect: a real failure is fixed in the package. Each entry names the test as the
# report spells it, the verdict it accepts, the arches it covers (both when
# omitted) and why:
#
#   [[allow]]
#   test = "<the report's TEST NAME>"
#   result = "FAIL"
#   arch = ["arm64"]
#   why = "<why this test cannot judge this package here>"
#
# Empty: no Fauna package has been certified yet.
