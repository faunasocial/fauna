android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 4g, not Gradle's 2g: a build-slot grant
# (docs/goal/architecture/core-bound.md § Per-core tokens) runs the Kotlin
# compiler in-process — inside this JVM — so no long-lived Kotlin compile daemon
# outlives the grant; compiling the full UniFFI-generated Kotlin binding surface
# here OOMs (`Java heap space` mid-`compileDebugKotlin`) at 2g.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
# The Kotlin compile daemon (used only by a build run outside a slot grant) is
# a separate JVM from the Gradle one above and has no explicit heap here
# otherwise; under this project's normal heavy
# concurrent dev-machine load (many sibling sessions building at
# once, docs/goal/architecture/build-machine-resources.md), its default heap
# is too small for compiling the full UniFFI-generated Kotlin binding surface,
# observed as `OutOfMemoryError: GC overhead limit exceeded` mid-`compileDebugKotlin`.
kotlin.daemon.jvmargs=-Xmx3g
