[package]
name = "fauna-acme-http01"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Exposes `test_support` (self-signed multi-SAN cert builder) to consumers'
# test suites via a `[dev-dependencies]` re-declaration with this feature.
test-helpers = []
# The HTTP-01 client's dark default directory (`E2E_DARK_DIRECTORY_URL`): with
# no override, an order goes to a closed loopback port, never the public CA.
# Forwarded from `fauna-nest`'s `test-hooks` alone — never default, never on a
# shipping build, and NOT folded into `test-helpers` (this crate's self
# dev-dependency turns that on for every test build, which would leave the
# production fallback's own test unrun).
e2e-dark-ca = []

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
axum.workspace = true
fauna-core = { path = "../fauna-core", default-features = false }
# The shared keypair→CSR→finalize→poll tail, once the order is `Ready` — the
# same mechanism `fauna-client-dns::acme_order`'s DNS-01 loop drives.
fauna-acme-core = { path = "../fauna-acme-core" }
instant-acme.workspace = true
# CSR + self-signed generation (the self-signed floor cert + this crate's own
# test fixtures — the finalize-step CSR itself now goes through fauna-acme-core).
# Same pin as fauna-nest (not a workspace dep).
rcgen = "0.13"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
x509-parser.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower-service.workspace = true

# ── pebble HTTP-01 real-wire acceptance (`tests/pebble_http01.rs`, #[ignore]) ──
# Everything here is DEV-ONLY. The self dev-dep turns on `test-helpers` for
# the integration-test build only (the production lib stays feature-clean).
fauna-acme-http01 = { path = ".", features = ["test-helpers"] }
# The pebble docker lifecycle + CA-trusting UA-tagged ACME client — shared
# with fauna-client-dns's identical pebble_dns01.rs harness (was two
# byte-identical copies).
fauna-pebble-testkit = { path = "../fauna-pebble-testkit" }
# In-process DNS responder pebble resolves through (answers A 127.0.0.1).
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
