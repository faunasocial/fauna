[package]
name = "fauna-cbor"
description = "Canonical IPLD dag-cbor codec, CID type, and sign-over-CID envelope."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11"
serde_ipld_dagcbor = { workspace = true }
cid = "0.11"
multibase = "0.9"
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
thiserror = { workspace = true }
ipld-core = { version = "0.4", features = ["serde"] }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true }
# Test-only: the tests cross-check our hand-built CIDs against the reference
# multihash implementation; production hashes with blake3 directly.
multihash-codetable = { version = "0.2", features = ["blake3"] }
