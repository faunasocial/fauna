[package]
name = "fauna-client-contacts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# fauna-protocol carries the typed `fauna.{knocks,contacts,inbox.mode}.*` wire
# types + the `RpcRequester` seam this crate is generic over (mirrors
# fauna-client-feed / fauna-client-notifications). `default-features = false`
# keeps the wasm build clean; native workspace builds re-enable defaults via
# Cargo feature unification. The path form is required to override
# `default-features`.
fauna-protocol = { path = "../fauna-protocol", default-features = false }

# wasm: forward fauna-protocol's `js` feature (fauna-core's js-sys time
# backend) so the transitive wasm build resolves. Off on native.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fauna-protocol = { path = "../fauna-protocol", default-features = false, features = ["js"] }

[dev-dependencies]
# The shared `RecordingRequester` / `block_on` test double the wire-contract
# tests below drive (one owner for the `RpcRequester` seam's fake).
fauna-client-testkit = { path = "../fauna-client-testkit" }
# Names the serde bounds the `RpcRequester::request` method requires, for the
# construction smoke test's mock impl. No `derive` needed (trait paths only).
serde = { workspace = true }
