# The offline co-present share ceremony FFI (src/offline_share.rs — the
# boundary the android / macOS / iOS / windows offline-share-* legs render
# from and act through; `docs/goal/behavior/p2p.md` § Offline share
# initiation). tui and linux reach
# `fauna_client_capabilities::group_ceremony_{node,view}` directly (Rust,
# no boundary needed); this is the SAME shared crate, crossed for the first
# time by a non-Rust-native app.
#
# `dep:fauna-client-capabilities` + its `p2p-share` feature for the ceremony
# node/peer/view modules (gated there behind that crate's own `p2p-share`,
# `lib.rs:28-33` — the same iroh-cleanliness bargain `fauna-iroh`'s own
# Cargo.toml documents); `fauna-client-capabilities/uniffi` turns on
# `group_ceremony_view`'s boundary-row derives, the same one-projection-two-faces
# split `custody` above uses; `dep:fauna-iroh` for `peer_leg_transport` (the
# assembler that binds the actor-keyed transport and hands back the bound
# addresses the compare code's addressing half needs — group_ceremony_node.rs's
# own module docs); `account-runtime` because `initiate`/`consent` both need
# this app's `AccountStoreHandle` (android is NOT yet a consumer of
# `account-runtime` — 
# so its leg of this feature stays unreachable until that lands, same as every
# other `account-runtime`-gated surface here); `fauna-sync-engine/p2p-share`
# (2026-08-25) so `src/offline_share.rs` can call the shared crate's
# `flush`/`spawn_config_persist`/`now_fn`/`now_secs`/`write_through` directly
# instead of holding its own copy (`fauna_sync_engine::offline_share`'s own
# module gate is `all(p2p-share, account-runtime)`, and this feature already
# carries `account-runtime` below).
#
# Default-on ONLY through `p2p-share` below, never through `store-safe`: the
# ceremony is the `p2p-share` registry member's other half (its
# `offline-share-*` / `offline-receive-*` surface — ui.yaml's
# `gated_features.p2p-share`), so the App-Store flavor excises it with the
# plane (`dynamic-features.md` § The App-Store escape hatch). It stays a
# feature of its own because the ceremony has no dependency on the plane's
# host. The Go mail-bridge `--no-default-features` build drops it too.
# The cross-user share PLANE's host (src/share_plane.rs — the one host the
# four native apps share: `fauna_sync_engine::share_glue`'s driver over
# `fauna_client_share_host::ShareHostSeams`, binding through the SAME
# per-session ceremony seat as `offline-share`; `docs/goal/behavior/p2p.md`
# § Cross-user shared-set transfer). tui and linux run the same driver
# natively. Named for the `p2p-share` gated-registry member it is
# (`dynamic-features.md` § Charter members), so it rides `default` and NEVER
# `store-safe`: the App-Store flavor excises the plane (§ The App-Store escape
# hatch), as tui's store-safe build excises its `share-transfer-*` /
# `share-serve-*` surface. It carries `offline-share` (the ceremony face, the
# same member's other half), which is therefore in no other feature's closure
# — `test_payments_excision_spine.py` computes `store-safe`'s closure and goes
# red if any `<dep>/p2p-share` forward re-enters it under another name.
p2p-share = [
    "offline-share",
    "conversations-session",
    "sync-agent-provisioning",
    "dep:fauna-client-share-host",
    "dep:fauna-peer-share",
]
offline-share = [
    "dep:fauna-client-capabilities",
    "fauna-client-capabilities/p2p-share",
    "fauna-client-capabilities/uniffi",
    "fauna-sync-engine/p2p-share",
    "dep:fauna-iroh",
    "dep:fauna-client-features",
    "account-runtime",
]
