# --target aarch64-linux-android` clean, zero warnings. The Apple half is now
# verified too — on a macOS dev machine, 2026-07-30: a cold `just apple-ffi`
# (cross-checkout cache MISS, so a real build) compiled `c2pa v0.90.3` for every
# target slice and assembled all 5, zero errors. Both halves of this claim hold
# at 0.90.3. Still true and worth keeping in mind: NO gate builds the Apple
