# CORRECTED 2026-09-10 (was: "the wasm web build leaves this at the stub -- no
# crate in the wasm graph enables the features"). That was false, and it was
# the kind of false that invites a cleanup: it read as licence to prune an
# edge that is load-bearing. The shipped web bundle DOES run the curated
# pipeline -- `libs/fauna-conversations/Cargo.toml`'s wasm32 block requests
# `process_media` (alone, no `c2pa-detect`), which is exactly what
# `docs/goal/ui/media.md` § Encryption at rest calls for, and what
# `libs/fauna-wasm/src/lib.rs`'s const-assert has pinned since 2026-07-20.
# Measure it, don't trust a comment:
#   CARGO_RESOLVER_FEATURE_UNIFICATION=selected cargo build --unit-graph \
#     -Z unstable-options --locked --target wasm32-unknown-unknown -p fauna-wasm
# The env override is not optional -- without it `.cargo/config.toml`'s dev
# workspace unification answers for the whole workspace rather than for this
# artifact, which is how the original claim came to be measured wrong in both
# directions. A merge gate runs that resolution for all five shipped
# artifacts.
fauna-media = { path = "../fauna-media", default-features = false, features = [
    "process_media",
    "c2pa-detect",
] }
fauna-conversations = { workspace = true, features = ["uniffi"] }
fauna-index = { workspace = true, features = ["uniffi"] }
# The index *orchestration* the MDA bridge leg drives over the FFI boundary
# (`src/content_index_session.rs`): the mail builder, the mail/calendar key ring
# and the rail-read that opens a slice. Non-optional for the same reason
# `fauna-index` is — the Go mail-bridge build (`--no-default-features
# --features labeler`) is this module's FIRST consumer, so gating it behind a
# default-on feature would drop exactly the caller it exists for.
fauna-client-index = { workspace = true }
# Mail-segment backup coordinator. Plan 5 T9. `BackupCoordinator` (and the
# `db`/`SyncDb` it owns) lives in the shared `fauna-sync-engine` crate, so
# depend on the engine directly.
# See `libs/fauna-ffi/src/mail_backup.rs` for the UniFFI wrapper.
fauna-sync-engine = { workspace = true }
# The share plane's host half every native host shares, and the admission
# types its trait speaks — `p2p-share` only.
fauna-client-share-host = { path = "../fauna-client-share-host", optional = true }
# The share-link author seam — `e2e-harness` only (its private-link export).
fauna-client-share = { path = "../fauna-client-share", optional = true }
fauna-peer-share = { workspace = true, optional = true }
# The seed-holding app's W3 account-store assembly — the eleven params that are
# the same on every native app, performed once (tui and linux are the other two
# consumers). Optional + folded into the default-on `account-runtime` feature so
# the Go mail-bridge `--no-default-features` build drops the whole graph.
fauna-client-account-runtime = { path = "../fauna-client-account-runtime", optional = true }
# The local sync-agent IPC seam (`SyncPipeClient::connect_socket` + the shared
# `convergence` loop + `SyncCapability`/`RequestMethod` wire types), wrapped by
# src/sync_agent_provisioning.rs as the FaunaKit provisioning driver. Optional +
# folded into the default-on `sync-agent-provisioning` feature so the Go mail-bridge
# `--no-default-features` build drops the native-socket crate. Its convergence /
# unix-transport modules are themselves `#[cfg(any(unix, windows))]`, matching the
# `#[cfg(unix)]` wrapper module (macOS is the only driver; windows uses its own C#
# codec, never this crate over FFI).
fauna-ipc = { path = "../fauna-ipc", optional = true }
fauna-mls = { path = "../fauna-mls", default-features = false, features = ["native"] }
fauna-peer = { path = "../fauna-peer" }
# The iroh substrate, for `offline-share`'s `peer_leg_transport` (see that
# feature); `fauna-iroh`'s `quic` feature pulls iroh only when it is on.
fauna-iroh = { path = "../fauna-iroh", features = ["quic"], optional = true }
tokio = { workspace = true }
# CancellationToken for the segment-backup push-debounce loop handle
# (src/segment_backup.rs `FfiPushDebounceHandle`).
tokio-util = { workspace = true }
reqwest = { workspace = true }
openmls = { workspace = true }
# Implements `fauna_conversations::OutboundMailSink` for the native SMTP sink
# (`conversations_session`, src/nest_client.rs) — the trait is `#[async_trait]`.
async-trait = "0.1"
uniffi = { workspace = true, features = ["cli"] }
# `#[fauna_uniffi_async::export]` runs each async export on a tokio runtime
# worker, off the foreign executor's small poll stack
# (`docs/goal/architecture/apps/native-async-execution.md` § The rule).
fauna-uniffi-async = { workspace = true }
# Only the `logs` module's startup line needs it; optional + folded into `logs`.
tracing = { workspace = true, optional = true }
# Destination-id minting for src/backup_destinations.rs; optional + folded into
# the `backup-destinations` feature (mirrors linux `destinations.rs`).
uuid = { workspace = true, optional = true }
ed25519-dalek.workspace = true
hex.workspace = true
blake3.workspace = true
serde_json.workspace = true
rand.workspace = true
getrandom.workspace = true
tempfile.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The conversations-seam wiring tests (`account_runtime.rs`): a no-nest
# `RpcRequester` for the real account store they install, whose generic
# `request` bounds name serde's traits.
serde = { workspace = true }
# `serde_bytes::ByteBuf` is needed by tests/wrapped_blob_ffi.rs to
# construct `SubmissionToken` fixtures whose `user_sig` field is a
# `ByteBuf`. The seal-side FFI signature itself takes the
# canonical-CBOR bytes of the token (see `seal_submission_token_blob`),
# so the production crate has no need for `serde_bytes`. Version
# tracks the rest of the workspace (`libs/fauna-mls`, `libs/fauna-protocol`).
serde_bytes = "0.11"
# `media_upload`'s `public_post_image_yields_thumbnail_part` test builds a real
# >300px PNG to exercise the on-device `process_media` thumbnail path through
# the `process_and_seal_upload` binding, via `fauna-media`'s shared
# `test_fixtures::build_png` (the same fixture that crate's own tests use —
# priority #2, one canonical body instead of a hand-rolled local copy).
# `image` is already in-graph via the normal `process_media` dep above; this
# re-listing just turns on the feature gate exposing the shared builder to
# the test build (dev-deps never reach the release FFI build).
fauna-media = { path = "../fauna-media", default-features = false, features = [
    "test-fixtures",
] }
# The Search-page snapshot injection seam (`SearchManager::set_snapshot_for_test`),
# so src/search_manager.rs's tests pin that the façade reads *through* to the
# manager rather than caching, without standing up a transport. Dev-only: the
# production dep above stays plain, and the helper is compiled out of the
# release FFI builds. Mirrors the `fauna-feed/test-helpers` forwarding used by
# the Feed façade's inject seam.
fauna-client-search = { path = "../fauna-client-search", features = ["test-helpers"] }
# `wrapped_blob::submission_token::fresh_signed_token` — the canonical
# SubmissionToken test fixture, shared with fauna-mls's own tests (mirrors
# `fauna-conversations`'s identical `test-helpers` request on this same crate
# for its MLS-2 forged-Welcome seam). Dev-only: excluded from `cargo build`.
fauna-mls = { path = "../fauna-mls", features = ["test-helpers"] }
# `Cid::of_raw` — tests/mail_index_session.rs's in-memory `__index` rail is
# content-addressed exactly the way the production rail is, so a listing hands
# out the same hashes a fetch is keyed by. Dev-only: the production crate never
# addresses a blob itself, it hands bytes to the caller's rail.
fauna-cbor = { path = "../fauna-cbor" }
# `test_fixtures::item` — the shared `FeatureStatusItem` builder src/features.rs's
# own tests use, one canonical body instead of a hand-rolled local copy
# (mirrors `fauna-tui`'s identical `test-fixtures` request on this crate).
# Dev-only: the production dep above (behind `value-format`) stays optional
# and plain.
fauna-client-features = { path = "../fauna-client-features", features = [
    "test-fixtures",
] }
# `fixtures` — the synthetic registry and signed documents src/region.rs's own
# tests hold a plane over (the same request `fauna-tui` makes). Dev-only.
fauna-client-region = { path = "../fauna-client-region", features = [
    "test-fixtures",
] }
# `chunk_seal::FramedChunk::arbitrary_for_fixtures` — the fixtures-only door
# src/mail.rs's `webdav_open_file` tests use to reproduce a file the Go WebDAV
# MDA sealed UNFRAMED before 2026-09-03, a shape no production writer can
# produce any more. Dev-only: the release FFI cannot reach it.
fauna-core = { path = "../fauna-core", default-features = false, features = [
    "test-helpers",
] }
# `locks::ServingLock` — src/erase_guard.rs's tests stand in for a sibling APP
# declared only at the shared store root, and read the root back to prove the
# FFI seat declares itself there. Already in-graph through fauna-sync-engine,
# which re-exports `db`/`root` but not `locks`.
fauna-account-store = { path = "../fauna-account-store" }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
