[package]
name = "fauna-ffi"
description = "UniFFI bindings for Fauna iOS and Android apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The full client face = everything a store-safe build keeps, PLUS the
# controversial-class planes a build flavor may excise. Splitting it this way
# means the excised flavor is `--no-default-features --features store-safe`
# with NO second copy of the list to keep in sync: a new client surface is
# added to `store-safe` once and is in `default` by construction. (The
# alternative — spelling the ~40-entry complement on the recipe's command line
# — rots the first time someone adds a feature and forgets the other list,
# which is precisely how an escape hatch is found broken on the day it is
# needed. `dynamic-features.md` § The App-Store escape hatch.)
default = ["store-safe", "payments", "zaps", "p2p-share"]
# (`account-runtime` rides `store-safe` below — it is an app surface, not a
# gated-feature-registry member.)
# The KIDS flavor's complement — every app surface the `kids` build of the
# android/ios apps keeps (`family-safety.md` § The account age band → the
# kids-app bullet, item (4); `dynamic-features.md` § Compile-time excision).
# It is the store-safe set minus the planes the kids app excises, nested
# INSIDE `store-safe` below so there is still exactly one list: a new surface
# lands here (kept by the kids app) or in `store-safe`'s own tail (excised),
# never in a second copy. The kids build is
# `--no-default-features --features kids-safe,kids-floor`.
kids-safe = ["accounts-registry", "pairing", "value-format", "moderation-badge", "mime", "render", "folders", "folders-author", "logs", "conversations-session", "markdown-authoring", "backup-destinations", "backup-audit", "task-delegation", "deployment-seed", "host-address", "muted-keywords", "sync-prefs", "member-review", "contact-overlays", "recovery-ceremony", "recovery-aftermath", "filter-marks", "spam-threshold-override", "custody", "snapshots-immediate-delete", "profile-client", "nest-trust", "drafts", "labeler", "qr-render", "personalization", "sync-engine-host", "sync-agent-provisioning", "push-subscription", "account-runtime"]
# Every app surface that is NOT a gated-feature-registry member. This is the
# App-Store escape-hatch flavor's feature set: the kids complement plus the
# planes the kids flavor excises — the feed and posting (`feed-badge`,
# `feed-rules`, `feed-manager`, the feed's source-badge `search`), discovery
# (`search-manager`), every bridge (`mail-admin`, `mail-import`,
# `atproto-settings`, `nostr-npub-confirm`), web publishing (`web-content`),
# monetization (`subscriptions-author`) and third-party anything
# (`connected-apps`, `labeler-catalog`).
store-safe = ["kids-safe", "feed-badge", "feed-rules", "feed-manager", "search", "search-manager", "mail-admin", "mail-import", "atproto-settings", "nostr-npub-confirm", "web-content", "subscriptions-author", "connected-apps", "labeler-catalog"]
# The kids flavor's compiled-in content floor (`family-safety.md` § The account
# age band → the kids-app bullet, item (4)): composes
# `fauna_core::obligation::KIDS_CONTENT_FLOOR` — the four guardian categories at
# `block` — strictest-wins into every render face's guardian input
# (src/family.rs `render_guardian_policy`). Off everywhere but the kids build:
# it is an ADDITION a flavor asks for, not an excision, so it sits in no
# `default`. Guardian Notify is deliberately not floored. Pure cfg gate — the
# constant is ungated data in fauna-core, so no dep is forwarded.
kids-floor = []
# The community-labeler WASM executor FFI (src/labeler.rs — `run_wasm_labeler`
# over the shared fauna-labeler runtime; labeler-registry design §6). Default-on
# so native-client FFI (Apple/Android) can self-serve labels over their own
# decrypted content (`content-moderation-and-ranking.md` § Tier-3, frame line 72),
# AND — unlike the other client-only default features — the Go mail-bridge build
# **explicitly re-enables it** (`just mail-bridge-ffi` adds `--features labeler`
# to its `--no-default-features` build) because the standalone content-processor
# holder is a role of that binary and IS the executor's server-side consumer.
# Gating `dep:fauna-labeler` keeps the wasmi interpreter out of a
# `--no-default-features` build that wants neither surface.
# ── the `payments` registry feature (dynamic-features.md) ────────────────────
# The money plane: payment-provider config, claim mint/redeem and tips
# (src/payments_client.rs over fauna-client-payments' `fauna.payments.*` +
# `fauna.tips.*` kinds). Default-ON — excision is what a build FLAVOR asks for,
# never the default posture — and gated so an App-Store escape-hatch build
# (`just apple-ffi-store-safe`) ships an artifact that provably cannot reach a
# real-money flow: no UI surface, no wire senders, no re-enable path
# (`docs/goal/architecture/dynamic-features.md` § What "completely compiled
# away" means).
#
# Rule (b) of the two-halves spine: this forwards `fauna-protocol/payments`
# from its OWN feature rather than naming it on the dep line, so
# `--no-default-features` genuinely drops the plane instead of re-acquiring it
# through cargo's unconditional dep-line features — the exact shape that rode
# 12 automation seams into five release artifacts before 2026-08-01
# (convention 15, `tests/e2e-unified/tests/test_ffi_flavor_split.py`).
#
# `fauna-feed/payments` gates ONE thing there: `FeedManager::resolve_post_tips`,
# the only caller of the `fauna.tips.list` kind (tips are a named buy-side gate
# surface — dynamic-features.md § Charter members). The `PostSummary::tips`
# field and its `TipView` record stay ungated and inert, so the snapshot record
# shape — and every binding generated from it — is identical in both flavors.
#
# NOT forwarded on purpose: `fauna-client-subscriptions` carries no payments
# plane — a priced tier's `TierAskingPrice` is ungated wire, so composing and
# reading one survives excision as inert metadata.
payments = [
    "dep:fauna-client-payments",
    "fauna-protocol/payments",
    "fauna-feed/payments",
]
# ── the `zaps` registry feature (dynamic-features.md § Charter members) ──────
# The NIP-57 half: the `fauna.nostr.zap_signers.*` trust root
# (src/nostr_client.rs' FfiNostrZapSignerClient + FfiZapSignerEntry) and the
# `FfiNestClient::nostr_zap_signers()` accessor.
#
# **A SUBSET MEMBER: it requires `payments`.** Excising `payments` excises this
# with it; excising `zaps` alone leaves provider-rail payments intact — the
# "Damus flavor", and the finer-grained hatch the Damus precedent shows a store
# actually demands (Apple forced the zap button off posts while the rest of the
# app stayed). The relation lives in fauna-protocol's manifest, once, and is
# inherited here rather than re-declared per crate.
#
# Default-ON for the same reason as `payments`: excision is a build FLAVOR's
# choice, never the default posture. Rule (b): both halves forwarded from this
# feature — the client face AND the wire plane — because forwarding only the
# client crate leaves the `fauna.nostr.zap_signers.*` kind strings in the
# artifact, a half-excision that reads green to a symbol-level check.
zaps = ["payments", "fauna-protocol/zaps", "fauna-client-nostr/zaps"]
# The Python e2e harness's NETWORKED seed exports (`src/cabi/harness.rs`:
# `fauna_harness_create_set` / `_record_change` / `_report_conflict` — a set
# born custody-first and its change records signed through the shared funnels,
# `mls-group-key-material.md` § M2 → *Writer-signed change records*). Test
# surface, so compiled out of release artifacts (e2e convention 15,
# `e2e-automation-surface-gating.md`): only `just e2e-ffi` turns it on (and
# `test-helpers` forwards it, for the windows harness's flavor). Implies
# `sync-engine-host`: `fauna_harness_sync_pass`, the harness's signed file
# writer, builds the apps' own in-process engine host (`src/sync_engine_host.rs`)
# rather than a second engine assembly. Names the credential store itself:
# `fauna_harness_create_set` hosts the account store for the call, and its
# writer-key slot is a file-backed store under a temp dir — the minimal
# `--no-default-features` flavor `just e2e-ffi` builds pulls it from nowhere
# else. Names `fauna-client-capabilities` for the same reason: the `ext.*`
# grant builder and the principal's row sealer run its mint and its open.
# Names `fauna-bridge-nostr` for `fauna_harness_nostr_gift_wrap_dm`: the far
# Nostr user's gift wrap is built by the in-tree `nip17::wrap_dm`, and no app
# flavor links that crate (the nest holds the custodial key, not the app).
# Names `fauna-client-share` for `fauna_harness_create_private_link`: the private
# share link a viewer journey opens is minted and registered by the shared
# `ShareClient`, which no app flavor names directly yet.
e2e-harness = ["sync-engine-host", "dep:fauna-credential-store", "dep:fauna-client-capabilities", "dep:fauna-bridge-nostr", "dep:fauna-client-share"]
labeler = ["dep:fauna-labeler", "dep:serde_bare", "fauna-mail/parser"]
# The personalization surface's community-labeler-catalog page FFI
# (src/labeler_catalog.rs — the `LabelerCatalogMachine` browse /
# inspect-before-subscribe / (un)subscribe over `fauna.labelers.*`).
# Default-on so the Apple/Android/Windows app FFI exports it (all 7
# apps reach parity, content-moderation-and-ranking.md § Tier-3), but
# gated so the Go mail-bridge `--no-default-features` build drops it — the
# bridge is a server with no catalog-browsing UI, and its native `rpc-glue`
# seam pulls the client crates uniffi-bindgen-go can't emit (same
# Go-incompatibility reason as `folders`/`devices`). Distinct from `labeler`
# (the WASM label() executor the bridge DOES need) — a different surface.
# Pulls `account-runtime`: the per-labeler grant mint reads the account's
# mail custody (`fauna.state.mail`) through the seat's account-store handle.
labeler-catalog = ["dep:fauna-labeler-catalog-machine", "account-runtime"]
# The ATProto settings page's login-plane FFI
# (src/atproto_settings.rs — `AtprotoSettingsMachine`: app-credential
# mint/list/reveal/revoke, connected-app sessions, and the per-account
# external-apps kill-switch over `fauna.bridges.atproto.*`;
# atproto-pds-full.md § App surface). Default-on so the Apple/Android/Windows
# app FFI exports it (all 7 apps reach parity), but gated so the Go
# mail-bridge `--no-default-features` build drops it — the bridge is a server
# with no settings UI, and its native `rpc-glue` seam pulls the client crates
# uniffi-bindgen-go can't emit (same Go-incompatibility reason as
# `labeler-catalog`/`folders`/`devices`).
atproto-settings = ["dep:fauna-atproto-settings-machine", "dep:fauna-client-alerts", "dep:fauna-client-alert-sweep", "dep:fauna-client-atproto"]
# The connected-apps page FFI (src/connected_apps.rs — `ConnectedAppsMachine`:
# the one roster over every third-party principal, the Requests tray, the
# typed-code Connect-an-app start and per-client blocks; ui/connected-apps.md).
# Default-on so the Apple/Android/Windows app FFI exports it (all 7 apps), gated
# for the Go mail-bridge `--no-default-features` build exactly like
# `atproto-settings`, whose `ConsentCardRow` the snapshot carries (so it implies it).
# Implies `mail-admin` too: the mail app passwords are roster rows, read through
# the session's `MailSettingsMachine`, which `build_connected_apps_machine` takes.
connected-apps = ["dep:fauna-client-connected-apps", "atproto-settings", "mail-admin"]
# The multi-account registry seam (src/accounts_registry.rs — FfiSecretStore
# callback interface + FfiAccountRegistry + the RegistryLaunchPersistence
# handle for LaunchMachine::new; long-term-store.md § Multi-account evolution
# → Shared seam). Default-on so the Apple/Android/Windows app FFI exports
# it (their switcher + launch wiring consume it), but gated so the Go
# mail-bridge `--no-default-features` build drops it — the bridge is a server
# with no accounts, and the `Arc<dyn LaunchPersistence>` handle would drag the
# fauna_launch_machine namespace into uniffi-bindgen-go output as a Go package
# the module doesn't carry (same Go-incompatibility class as `value-format`).
# Carries `fauna-core/uniffi` since 2026-09-09: `FfiSignOutResidue::line` hands a
# `LocalizedText` across the boundary (the sign-out residue line), and that type
# is only a `uniffi::Record` under fauna-core's own `uniffi` feature — the same
# registration `task-delegation` declares below. In a `store-safe`/`default`
# build it was already on transitively; naming it here is what makes
# `--features accounts-registry` alone compile. `tracing` logs a residue record
# that could not be written (src/sign_out_residue.rs).
accounts-registry = ["fauna-core/uniffi", "dep:fauna-client-accounts", "dep:fauna-credential-store", "dep:fauna-i18n", "dep:tracing"]
# The user-facing profile READ/WRITE RPC face (src/profile_client.rs — the
# FfiProfileClient over the shared fauna-client-profile ProfileClient).
# Default-on so the Apple/Android/Windows app FFI exports it for the profile
# edit form (the shared sign/decode logic every app lifts onto — the
# `fauna-client-profile::build_profile` sign_and_pack step — profile.md
# § Where logic lives), but
# gated so the Go mail-bridge `--no-default-features` build drops it — the bridge
# is a server with no profile-edit UI (same dead-code rationale as
# `markdown-authoring` / `subscriptions-author`). fauna-client-profile is a
# non-optional dep (only built-in types cross its FFI boundary), so this gates
# only the module's compilation, not a dep.
#
# NOT gated (since 2026-08-03): the pure half in src/profile.rs — the record
# mirrors, decode_profile_display, and build_edited_profile{,_with_images}.
# Composing and decoding a `Profile` needs no nest connection, so it follows
# post.rs/posts_client.rs rather than bundling both halves under one flag; the Go
# atproto bridge's projection tests build real profile bytes with those builders
# instead of inventing a fixture (atproto-pds-full.md § F2 detail).
#
# Pulls `recovery-ceremony` in: the edit form's base load
# (`FfiProfileClient::load_edit_base`) is the shared read-prove-record
# (`fauna_client_recovery::ceremony::load_profile_edit_base`), which records a
# succession link the base needs through `FfiAccountRegistry` (profile.md § After
# an identity succession → the linkless bullet). Both ride `store-safe` already.
profile-client = ["recovery-ceremony"]
# The backup-destination management FFI (src/backup_destinations.rs — config read +
# add/edit/remove-and-save over the shared account-store + mutate helpers, plus the
# enroll-time resolve the add/edit dialogs call). Default-on so the Apple/Android/
# Windows app FFI exports it for the backups-page destination CRUD (the 5-client
# lift), but gated so the Go mail-bridge `--no-default-features` build drops it — the
# bridge is a server with no destination-management UI (same dead-code rationale as
# `folders`). fauna-client-config / fauna-sync-engine are already non-optional deps,
# so this gates only the module's compilation, not a dep.
# Pulls `account-runtime`: the destination list and its marks live in the account
# plane's `fauna.state.backup`, read and written through this process's
# account-store handle (`crate::backup_seam`); and `deployment-seed` for the
# bound-nest-id resolution every read/write keys that list by. Every flavor that
# ships the surface already hosts both (all three sit in `store-safe`).
backup-destinations = ["dep:uuid", "dep:fauna-client-backup", "account-runtime", "deployment-seed"]
# The client-side backup **audit** FFI (src/backup_destinations.rs — the one
# encapsulating `backup_audit_run_pass` + the `backup_audit_observe` feed).
# Default-on so the four UniFFI shells (windows/macos/ios/android) can render the
# audit-alert surface at all — `docs/goal/ui/backups.md` § Audit-alert surface names
# this face as their single shared prerequisite, linux/tui/web reaching the same
# shared loop as library code instead. Gated out of the Go mail-bridge
# `--no-default-features` build for the same reason as `backup-destinations`: the
# bridge is a server with no backups page. Unlike its sibling this DOES pull deps —
# `fauna-client-backup` for the pass itself and `fauna-client-pair` for the native
# connector/inclusion seams — plus `fauna-core/uniffi` so `BackupAuditAlertReason`
# gets its `uniffi::Enum` registration cross-crate (the row carries the alert reason,
# never the raw verdict).
# Pulls `backup-destinations` because the audit face lives *inside* that module —
# enabling this alone would otherwise compile to nothing at all, silently.
backup-audit = [
    "backup-destinations",
    "dep:fauna-client-backup",
    "dep:fauna-client-pair",
    "fauna-core/uniffi",
]
# (The `backup-lease` feature — the lease wiring for the in-app segment-backup
# upload driver — was removed 2026-08-17: the driver it gated was deleted with
# the slice-5 flip, leaving the feature gating no code. `backup-upload` is a
# nest-run kind; the fauna-client-delegation dep survives via `task-delegation`
# below.)
# The Task-delegation Settings surface FFI (src/task_delegation.rs — the Ffi*
# mirrors of the shared `fauna_core::delegation` view-model enums + the
# FfiTaskDelegationView Object over `fauna_client_delegation::TaskDelegationView`
# + FfiNestClient::task_delegation_view_for_device). Default-on so the Apple/Android/Windows
# app FFI exports it for the `task-delegation` page (the 6-client lift onto one
# shared async view-model, participants.md § Task delegation), but gated so the Go
# mail-bridge `--no-default-features` build drops it: the bridge is a server with
# no Settings UI, and — like `render` / `feed-badge` / `moderation-badge` — the
# row's `name: FfiTaskDelegationRow.name` return is a `fauna_core` `LocalizedText`
# (a `uniffi::Record` gated behind `fauna-core/uniffi`), for which uniffi-bindgen-go
# emits an uncompilable bare `fauna_core` cross-namespace import. So this forwards
# **`"fauna-core/uniffi"`** for the `LocalizedText` registration AND pulls
# **`"dep:fauna-client-delegation"`** (the shared async view; the optional dep's
# only remaining enabler, so a featureless build drops the crate entirely).
# Pulls `account-runtime`: the surface reads and saves through the shared
# `fauna_sync_engine::preference_surfaces` gestures, which take this
# process's account-store handle (config-dissolution.md § The `__config`
# dissolution schedule → *The closure order* steps (1) and (5)); every flavor that ships
# the surface already hosts the runtime (both sit in `store-safe`).
task-delegation = ["fauna-core/uniffi", "dep:fauna-client-delegation", "account-runtime"]
# The deployment-seed custody-map FFI (src/deployment_seed.rs — the recovery
# reads over the account plane's `fauna.state.deployment-seeds` kind, the
# custody leg's post-auth entry and the plane rotation drive; the native twin of
# tui/linux's `fauna_client_account_runtime::deployment_seeds` seam).
# Default-on so the Apple/Android/Windows app FFI exports it, but gated so the
# Go mail-bridge `--no-default-features` build drops it — the bridge is a
# server with no onboarding/recovery surface (same dead-code rationale as
# `backup-destinations`). Pulls `fauna-client-pair` for the bound-nest-id
# comparand and `account-runtime` for the account-store handle the custody leg
# and the rotation drive write through. `box-recovery.md` § The plane-era
# recovery floor.
deployment-seed = ["dep:fauna-client-pair", "account-runtime"]
# The client host-address reporting FFI (src/host_address.rs — the native twin of
# linux's direct drive + the web `reportHostAddress` binding: classify the
# dial-address, never publish a private/LAN one, report the public IP via
# `fauna.dns.set_host_address`). Default-on so the Apple/Android/Windows app FFI
# exports it for the onboarding + post-auth host-address report, but gated so the
# Go mail-bridge `--no-default-features` build drops it — the bridge is a server
# with no onboarding surface (same dead-code rationale as `deployment-seed`), and
# its fn calls the gated `FfiNestClient::nest_arc()` accessor. Pulls
# `fauna-client-dns` (the shared `host_address` decision + `NativeHostAddressProbe`);
# already an optional dep behind `mail-admin`. `domains-and-tls-bootstrap.md`.
host-address = ["dep:fauna-client-dns"]
# The tier-1 muted-keywords FFI (src/muted_keywords.rs — the `muted-words`
# Settings sub-page's read/set/add/remove over the shared
# preference_surfaces gestures, plus the
# matches_muted_keywords sync wrapper over the shared
# fauna_core::keyword::body_excludes_matches the conversation collapse render
# calls). Default-on so the Apple/Android/Windows app FFI exports it for the
# muted-words page + conversation apply (the 5-client lift onto one shared
# matcher, content-moderation-and-ranking.md § Q3), but gated so the Go
# mail-bridge `--no-default-features` build drops it — the bridge is a server
# with no muted-words UI, its read/set fns call the gated `FfiNestClient::nest_arc()`
# accessor (like `backup-destinations` / `subscriptions-author`), and gating the
# built-in-typed matcher too keeps the checked-in Go bindings byte-identical
# (same off-win-regen rationale as `nest-trust` / `mime`). fauna-client-config /
# fauna-core are already non-optional deps, so this gates only the module's
# compilation, not a dep. Forwards `fauna-client-config/uniffi` for the
# `MutedWordsSnapshot` record (the page's rows + `loaded` bit) — behind THIS
# feature so the bridge build still registers nothing and the Go bindings stay
# byte-identical.
# Pulls `account-runtime`: the surface reads and saves through the shared
# `fauna_sync_engine::preference_surfaces` gestures, which take this
# process's account-store handle (config-dissolution.md § The `__config`
# dissolution schedule → *The closure order* steps (1) and (5)); every flavor that ships
# the surface already hosts the runtime (both sit in `store-safe`).
muted-keywords = ["fauna-client-config/uniffi", "account-runtime"]
# The sync-preferences FFI (src/sync_prefs.rs — the Folders page's "Sync
# defaults" section read/set over the shared preference_surfaces
# gestures).
# Same shape + gating rationale as `muted-keywords`: fauna-client-config and
# fauna-core are already non-optional deps, so this gates only the module's
# compilation, not a dep. Default-on; the Go mail-bridge --no-default-features
# build drops it (no sync-settings UI on the bridge).
# Pulls `account-runtime`: the surface reads and saves through the shared
# `fauna_sync_engine::preference_surfaces` gestures, which take this
# process's account-store handle (config-dissolution.md § The `__config`
# dissolution schedule → *The closure order* steps (1) and (5)); every flavor that ships
# the surface already hosts the runtime (both sit in `store-safe`).
sync-prefs = ["account-runtime"]
# The unattested-member review FFI (src/member_review.rs — the Settings
# Recovery Kit's ephemeral pass + the permanent `member_review` page: roster
# read, row-text formatting, Keep/Remove verdict persistence over the shared
# fauna_client_config::{load_member_reviews,decide_member_review} seam).
# `ConversationsManager::evict_person_everywhere`/`::handle_for_person` need
# no feature of their own — they're exported directly on the manager object,
# always compiled in. Same shape + gating rationale as `muted-keywords`:
# fauna-client-config / fauna-core / fauna-conversations are already
# non-optional deps, so this gates only the module's compilation, not a dep.
# Default-on; the Go mail-bridge --no-default-features build drops it (no
# settings UI on the bridge). The review ROWS rest on the succession ledger,
# read through the account-store handle, hence `account-runtime`.
member-review = ["account-runtime"]
# The private contact overlay's FFI face (src/contact_overlays.rs —
# `contacts.md` § The private overlay: the projection's reads, the private
# section's staged editor and its Save), built once for android, windows,
# macOS and iOS. Same shape + gating rationale as `member-review`: default-on,
# dropped by the Go mail-bridge --no-default-features build (no contacts UI on
# the bridge, and its `fauna_core` record returns are what uniffi-bindgen-go
# cannot import). The Save writes through the account-store handle, hence
# `account-runtime`.
contact-overlays = ["account-runtime", "value-format"]
# The stolen-identity succession ceremony FFI (src/recovery.rs —
# identity-succession.md § Implementation status today: "The three remaining apps
# (windows, macOS, iOS) still owe the native leg: trigger UI + a `db_path_for`
# resolver + an `FfiError` variant, compiled where their consumers live").
# Unlike `member-review`'s shape this DOES gate a dep — `fauna-client-recovery`
# was not reachable from this crate at all before — which is why the dep is
# `optional = true`. Default-on via `store-safe`; the Go mail-bridge
# --no-default-features build drops it (no settings UI, no identity to succeed)
# and keeps the checked-in Go bindings byte-identical.
# Pulls `accounts-registry` in rather than assuming it: the ceremony persists the
# successor seed, reads it back, and records the succession link, all through
# `FfiAccountRegistry` — so this module cannot compile without it, and a feature
# combination that omitted it would fail at build time rather than degrade.
recovery-ceremony = ["dep:fauna-client-recovery", "accounts-registry"]
# The post-succession aftermath FFI (src/succession_aftermath.rs —
# succession-aftermath.md § Re-key scope's `BackupKey` corpus row). The
# ceremony's sibling half, so it pulls `recovery-ceremony` in rather than
# assuming it: the two are one user-visible act, and an app that can hand its
# account to a successor but never re-seal the corpus is the exact half-built
# state this pair exists to prevent.
#
# It turns on `fauna-client-recovery/aftermath` — which is what gates the shared
# driver's own optional deps — plus the three crates whose progress projections
# this module's `AftermathSink` impl names by type. Those three are already
# optional deps here; a feature combination that omitted one would fail at build
# time rather than degrade, which is the same reason `recovery-ceremony` pulls
# `accounts-registry`.
#
# Default-on via `store-safe`; the Go mail-bridge --no-default-features build
