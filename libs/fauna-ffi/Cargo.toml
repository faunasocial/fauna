# vice versa). Default-on through `store-safe` — every native app hosts the
# account plane — and dropped by the Go mail-bridge's `--no-default-features`
# build, which holds no user identity and cannot emit the `fauna-client*`
# namespaces uniffi-bindgen-go chokes on (same reason as `sync-engine-host`).
