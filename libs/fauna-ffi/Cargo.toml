# (without `folders`) a valid, compiling combination. Pulls `account-runtime`:
# the follow / unfollow / list faces read and write the account's
# `fauna.state.follows` rows through the handle (`follows_seam` in src/lib.rs),
# and the shared-folder content-key custody is the `fauna.state.folder-keys`
# kind, read and written through the seat's store
# (`account_runtime::folder_key_store`).
folders-author = ["fauna-client-folders/mls", "conversations-session", "dep:fauna-devices-machine", "account-runtime"]
# Shared value formatting (src/value_format.rs — relative time / byte sizes /
# durations). Default-on for the Apple/Android/Windows app FFI; gated out of
# the Go mail-bridge `--no-default-features` build because its `LocalizedText` /
# `RelativeTimeDisplay` returns are `fauna_core` types and uniffi-bindgen-go emits
# an uncompilable bare `fauna_core` cross-namespace import for them (same
# Go-incompatibility reason as `mail-admin` / `pairing`). The bridge is a server
# with no value-formatting surface, so dropping it is harmless. Forwards
# `fauna-core/local-clock` for `format_unix_local` — plain-`String` return
# (not a `fauna_core` type), so it carries none of this feature's own
# Go-incompatibility; harmless to bundle since the Go build already turns the
# whole feature off.
value-format = ["fauna-core/local-clock", "dep:fauna-client-features", "dep:fauna-client-region", "dep:fauna-client-status"]
# Shared search-result card formatters (src/search.rs — content_type_badge +
# clean_snippet over fauna_client_search::render). Default-on for the
# Apple/Android/Windows app FFI; gated out of the Go mail-bridge
# `--no-default-features` build for the same reason as `value-format`
# (`search_content_type_badge` returns a `fauna_core` LocalizedText →
# uniffi-bindgen-go cross-namespace import). The bridge has no search surface.
search = []
# Shared content-label badge presentation (src/content_category.rs —
# content_label_style over fauna_core::content_category). Default-on for the
# Apple/Android/Windows app FFI (replaces the per-app category→label/icon/
# colour maps in `ContentLabelBadge.{kt,svelte,...}`); gated out of the Go
# mail-bridge `--no-default-features` build for the same reason as `render`
# (the export returns a `fauna_core` `ContentLabelStyle` embedding a
# `LocalizedText` → uniffi-bindgen-go cross-namespace import). Forwards
# `fauna-core/uniffi` so `ContentLabelStyle` gets its `uniffi::Record`
# registration cross-crate. The bridge has no moderation surface.
moderation-badge = ["fauna-core/uniffi"]
# Shared MIME-type detection (src/mime.rs — content_type_for_filename over the
# fauna_core::share extension→MIME catalog). Default-on for the Apple/Android/
# Windows app FFI (replaces per-app hand-rolled maps, e.g. the windows
# MimeDetect image-only map); gated out of the Go mail-bridge
# `--no-default-features` build to keep this free fn over built-in types off the
# checked-in Go bindings and avoid an off-win Go regen (same rationale as
# `nest-trust`: uniffi-bindgen-go COULD emit it, but the bridge has no
# client-filename MIME surface). Pure cfg gate — fauna-core is non-optional.
mime = []
# Shared render-model plaintext flattener (src/render.rs —
# render_document_to_plaintext over RenderDocument::to_plaintext). Default-on for
# the Apple/Android/Windows app FFI; gated out of the Go mail-bridge
# `--no-default-features` build for the same reason as `value-format`/`search`
# (the export takes a `fauna_core` RenderDocument → uniffi-bindgen-go
# cross-namespace import). Forwards `fauna-core/uniffi` so RenderDocument gets
# its `uniffi::Record` registration cross-crate (render-model.md § Implementation
# status — direct embed). The bridge has no render surface.
render = ["fauna-core/uniffi"]
# Shared QR module-matrix encoder (src/qr.rs — qr_matrix / qr_quiet_zone_modules over
# `fauna_core::qr_matrix`), which the Settings identity-export section draws on
# Apple/Android/Windows (settings.md § Identity export). Default-on for the client FFI,
# gated out of the Go mail-bridge `--no-default-features` build for the same reason as
# `render`/`value-format` (the bridge has no QR surface, and the export returns a
# `fauna_core` QrMatrix → uniffi-bindgen-go cross-namespace import). Forwards
# `fauna-core/uniffi` so QrMatrix gets its `uniffi::Record` registration cross-crate, and
# `fauna-core/qr_render` for the encoder itself (off by default there — the nest never
# renders a QR).
qr-render = ["fauna-core/qr_render", "fauna-core/uniffi"]
# The client residual-HTTP TLS-pin query accessors (src/trust.rs:
# spki_sha256_of_cert_der / pinned_spki_for_host / authority_of) the windows C#
# DirectNestClient's cert-validation callback uses to trust a self-signed nest the
# same way the Rust stack does (the shared pinned SPKI). All three are free fns
# over built-in types, so uniffi-bindgen-go CAN emit them — but the Go mail-bridge
# has no client HTTP-pin surface, so gating them out of the `--no-default-features`
# build keeps them off the checked-in Go bindings and avoids an off-win Go regen
# (memory reference_ffi_gate_conversations_session_excludes_go). The sibling
# install_nest_identity_pin_store stays ungated (already in the Go bindings).
# Pure cfg gate — needs no extra dep (fauna-client / fauna-protocol are non-optional).
nest-trust = []
# The four admin mail machines (src/mail_admin.rs). Default-on so the
# Apple/Android/Windows app FFI exports them, but gated so the Go mail-bridge
# FFI build (`uniffi-bindgen-go` over a `--no-default-features` .so) drops them —
# the Go bridge has no use for client admin machines, and uniffi-bindgen-go emits
# uncompilable bare cross-namespace imports for the fauna-client-{dns,mail-settings}
# packages they pull in (the same Go-incompatibility reason the other
# client-crate features are gated). See
# `justfile` `mail-bridge-ffi` + `docs/goal/architecture/build-system.md`.
# `account-runtime`: the credentialed DNS machine reads and writes the
# account's `fauna.state.dns` row through the seat's account-store handle.
mail-admin = ["dep:fauna-client-dns", "dep:fauna-client-mail-settings", "account-runtime", "fauna-client-folders/mail-settings"]
# The user-settings Linked-nests machine (src/pairing.rs). Default-on for the
# Apple/Android/Windows app FFI, gated out of the Go mail-bridge
# `--no-default-features` build for the same cross-namespace-import reason as
# `mail-admin` (the Go bridge has no use for the client linked-nests machine).
# Pulls `account-runtime`: the trust facet mints from the account's mail
# custody (`fauna.state.mail`) through the seat's account-store handle, and
# `fauna-client-folders/mls` for the folder-custody set names the facet names a
# paywall grant's folder from (`CustodyOwnedSetNames`).
pairing = ["dep:fauna-client-pair", "account-runtime", "fauna-client-folders/mls"]
# The shared log-ring exposure (src/logs.rs + FfiAdminClient::logs). Default-on
# for the Apple/Android/Windows app FFI's Settings → Logs page, gated out of
# the Go mail-bridge `--no-default-features` build for the same
# cross-namespace-import reason as `value-format` (its `LogEntry` / `LogLevel`
# returns are `fauna_log` types; the Go bridge has no Logs surface). Pulls
# `fauna-log` with its `uniffi` feature so the owned types cross the boundary.
logs = ["dep:fauna-log", "dep:tracing"]
# The native-client FaunaMls conversations *receive* session
# (src/nest_client.rs `FfiNestClient::conversations_session`). Default-on so the
# Apple/Android/Windows app FFI exports it, but gated out of the Go mail-bridge
# `--no-default-features` build because its return is the cross-crate
# `fauna_conversations::ConversationsSession` Object and uniffi-bindgen-go emits an
# uncompilable bare `fauna_conversations` cross-namespace import for it (same
# Go-incompatibility reason as `mail-admin` / `pairing` / `value-format` / `logs`).
# The Go bridge is a server with no client-conversations surface, so dropping it is
# harmless. fauna-conversations/-mls/-client-conversations are already non-optional
# deps, so this gates the leaking export + its imports; it also turns on
# fauna-mail's `segments-receive` (the inbound `open_inbound_record` decrypt the
# `NestMailInboundSource` mail-receive sources need — kept off the Go bridge build).
#
# It also carries the member-side **succession witness** and its peer-anchor
# harvest sweep (`succession-aftermath.md` § Propagation → *MLS groups*): both
# are properties of having a conversations session at all, not of the recovery
# *ceremony*, so they ride this gate rather than `recovery-ceremony`. That is
# why `dep:fauna-client-recovery` is turned on here as well — the crate is
# optional so the Go mail-bridge `--no-default-features` build still drops it
# whole, and the bridge has no conversations session to witness for.
conversations-session = [
    # The mail key cache reads the account's mail custody (`fauna.state.mail`)
    # through the seat's account-store handle.
    "account-runtime",
    "fauna-mail/segments-receive",
    "fauna-conversations/client-display",
    "dep:fauna-client-recovery",
    "fauna-client-recovery/conversations-witness",
]
# The native-client `__drafts` persistence seam (src/drafts.rs — FfiDraftsClient
# over fauna_client_drafts::DraftsClient + FfiNestClient::drafts, AND the canonical
# stateful FfiDraftsSync over DraftsSync + FfiNestClient::drafts_sync). Default-on
# so the Apple/Android/Windows app FFI exports it for the per-app draft-
# persistence v2 legs (the 6-client lift onto the shared seal + WS transport,
# file-sync.md § Drafts Sync — "do NOT re-implement the seal or the WS call per
# client"), but gated out of the Go mail-bridge `--no-default-features` build: the
# bridge is a server with no compose UI, and dropping it keeps both handles off
# the checked-in Go bindings so no off-win Go regen is needed (same gate rationale
# as `nest-trust`'s built-in-typed free-fns; memory
# reference_ffi_gate_conversations_session_excludes_go). The `dep:` form makes
# fauna-client-drafts optional, so a featureless build drops the crate entirely.
drafts = ["dep:fauna-client-drafts"]
# The source-side IMAP import client (src/mail_import.rs — `FfiMailImportClient`),
# per mailbox-migration.md § Client-driven streaming model: the concrete
# `ImapSession<NativeTlsTransport>` facade UniFFI needs, since it cannot export
# the generic the transport seam is built on. Pulls fauna-mail's
# `imap-client-native` (tokio + tokio-rustls), which is NOT wasm-safe — fine
# here, this crate is the native shell; the browser reaches the same protocol
# core through fauna-wasm and the pure `imap-client` feature.
#
# Default-on so the five native apps get it, and gated so the Go mail-bridge
# `--no-default-features` build DROPS it: the bridge never imports from a
# foreign mailbox, and dropping it keeps `imap-proto`/rustls out of the bridge
# and leaves `libs/fauna-mail-go` unchanged (no off-win Go regen). Same
# reasoning as `drafts` above.
mail-import = ["fauna-mail/imap-client-native"]
# Expose the state machines' `set_*_for_test` setters + observer/connector doubles
# via UniFFI for E2E, so a test build's bridge can drive snapshots (tracked
# internally — "E2E bridge contract").
#
# This is where such forwards BELONG, and as of 2026-08-01 EVERY entry below is
# reached only through this feature: the onboarding/launch-machine dep lines no
# longer name `test-helpers`/`test-observer` themselves, so `testing.md`
# convention 15 rule (b) now holds here and a plain `--release` build carries
# none of the 23 seams (two-column symbol-table proof in that doc's
# § Implementation status).
#
# ⚠ A real gate is not the same as clean artifacts — a build recipe can still
# turn the feature on. All three native families are split into production/test
# flavor pairs: android (`just android-ffi` / `android-ffi-test`, staged per
# Gradle buildType), apple (`apple-ffi` / `apple-ffi-test`, and likewise
# `apple-ffi-host` / `apple-ffi-host-test`) and windows (`windows-ffi` /
# `windows-ffi-test`, whose production flavor also runs the generated-bindings
# `*ForTest` witness in `_windows-ffi-bindgen`). The production flavors pass NO
# test features, so shipped artifacts carry none of these seams. (An earlier
# version of this comment predated the apple/windows splits and claimed the
# shipped macOS/iOS/Windows artifacts DO carry the seams — stale; verified
# against the justfile recipes 2026-08-13 review.)
test-helpers = [
    # The harness's networked seed exports (the `e2e-harness` feature above).
    "e2e-harness",
    # The loud surfaces' e2e seams (`src/e2e_seams.rs`, and the wake beside the
    # re-sweep loop in `src/critical_alerts.rs`): the shared counters and
    # backoff parser, the NestClient reconnect pace, and the wakeable loop.
    "dep:fauna-e2e-contract",
    "fauna-client/e2e-agent",
    # The per-test factory reset's fresh dial budget (`dial_budget_clear_for_test`).
    "dep:fauna-ws-substrate",
    "fauna-ws-substrate/test-helpers",
    "fauna-client-alert-sweep?/test-helpers",
    # `fauna-mail`'s source-IMAP trust seed (FAUNA_E2E_IMAP_EXTRA_CA_PEM), read
    # inside `NativeImapConnector::new` — the trust store `FfiMailImportClient`
    # builds for apple/android/windows. The `*-ffi-test` flavors are
    # release-profile, so without this forward the arm is absent from exactly the
    # builds the e2e drives.
    "fauna-mail/test-helpers",
    "fauna-onboarding-machine/test-helpers",
    "fauna-launch-machine/test-helpers",
    "fauna-conversations/test-helpers",
    # The FAUNA_E2E_SYNC_AGENT_BIN pin read FfiChildAgentSpawner's spawn
    # resolves through (agent_spawner::agent_binary) — compiled out of a
    # production fauna-ffi build together with the spawner itself.
    "fauna-client-sync/test-helpers",
    # The Feed-page snapshot injection seam (FfiFeedManager::inject_posts_for_test
    # over fauna_feed::test_support + set_feed_snapshot_for_test) — the windows/apple
    # e2e twin of the conversations inject seam, driving the unverified-source-badge
    # `Failed` arm a real nest can't serve. Doubly gated out of Go (inside the
    # default-off-in-Go `feed-manager` module, behind test-helpers).
    "fauna-feed/test-helpers",
    # The D10 delegation row's RENDER clock (never the mint clock) — the seam
    # `atproto_delegation_advance_clock` drives so a test reaches
    # expiring_soon/expired without sleeping out the ~90-day window
    # (convention 14: a fake clock, never a sleep). The machine gates its setter
    # on `debug_assertions OR e2e-agent`, and the apple-ffi/windows-ffi builds
    # are `--release`, so the feature must be forwarded explicitly or the setter
    # does not exist in the very builds the e2e drives.
    "fauna-atproto-settings-machine?/e2e-agent",
    # The backup-audit clock offset (`set_backup_audit_clock_offset_secs`, the
    # `backup_audit_run_now` agent command's mechanism) — same rationale as the
    # delegation clock above: `fauna-client-backup` gates its setter on
    # `debug_assertions OR e2e-agent`, and the release apple-ffi/windows-ffi
    # builds need it forwarded explicitly.
    "fauna-client-backup?/e2e-agent",
    # The trust facet's render clock (`set_trust_clock_offset_secs`, the
    # `trust_facet_advance_clock` agent command's mechanism) — same rationale:
    # `fauna-client-capabilities::trust_clock` gates its setter on
    # `debug_assertions OR e2e-agent`, and the dep is optional (weak `?/`).
    "fauna-client-capabilities?/e2e-agent",
    # The fleet-removal convergence read (`device_set_state_json`, the
    # `FfiNestClient::device_set_state_json` export's mechanism) — same
    # rationale as the delegation clock above: `fauna-client-account-runtime`
    # gates it on `debug_assertions OR e2e-agent`, and the dep is optional
    # (`account-runtime` feature), so the weak `?/` form is required — a plain
    # `/` would turn the dependency on unconditionally.
    "fauna-client-account-runtime?/e2e-agent",
    # The conversations push-arm kill-switch (`conv_push_source`'s
    # `FAUNA_E2E_SUPPRESS_CONV_PUSH` read) — the layer-5 missed-push receive
    # proof's only lever on the four UniFFI apps (macos, ios, windows, android),
    # gated on `debug_assertions OR e2e-agent` in `fauna-client-conversations`.
    # Forwarded rather than left to the profile so the flavor, not the build
    # profile, is what decides — the `apple-ffi-test`/`windows-ffi-test`/
    # `android-ffi-test` recipes all pass this feature, whatever profile they
    # happen to use today.
    "fauna-client-conversations/e2e-agent",
    # The region plane's test-capable-build seams (the registry seed and the
    # declared-region override, `fauna-client-region`'s `e2e-agent`, convention
    # 15) — the release-profile `*-ffi-test` flavors need them forwarded, the
    # same rationale as the conversations kill-switch above.
    "fauna-client-region?/e2e-agent",
    # The resident engine's full-reconcile cadence (`always_resident::rescan_interval`,
    # the FAUNA_E2E_RESCAN_MS read) — linux and tui forward this from their own
    # `e2e-agent` feature; the four UniFFI apps never did, so a released
    # `--release` e2e build ran the 300s production cadence with no test able
    # to see or budget for it (`drivers/ios.py`'s launch env has set the var
    # since 2026-08-25). `fauna-sync-engine` is already a direct dependency
    # below, gated the same `debug_assertions OR e2e-agent` way.
    "fauna-sync-engine/e2e-agent",
    # The screen_time.rs test-clock seams — same rationale and gate as above,
    # on the other direct dependency that carries them.
    "fauna-core/e2e-agent",
    # The `dial` module's nest-dial override seams (lib.rs/dial.rs) — distinct
    # from the `fauna-launch-machine/test-helpers` forward above (that crate
    # deliberately splits `test-helpers` scaffolding from this `e2e-agent`
    # redirect seam, per its own manifest comment).
    "fauna-launch-machine/e2e-agent",
    # The DNS-credential-verify fake-provider decorator (`maybe_wrap_fake`,
    # `fauna-client-dns/src/lib.rs`) gates on `debug_assertions OR
    # feature="test-helpers"` — `debug_assertions` covers macOS's debug
    # apple-ffi-host build, but `apple-ffi-test`'s iOS slice is `--release`, so
    # without this forward the decorator never wraps and every credential-add
    # verify hits the real (unreachable-in-sandbox) provider until it times
    # out. Same class of gap row 392 already fixed for e2e-agent seams; this
    # one uses `test-helpers` instead, so it needs its own forward.
    "fauna-client-dns?/test-helpers",
    # The drafts autosave-window seam (FAUNA_E2E_DRAFTS_AUTOSAVE_DEBOUNCE_MS),
    # read inside `fauna_client_drafts::autosave_debounce` — the one accessor
    # `autosave_debounce_ms` answers from, so apple/android/windows all reach it
    # without app-side plumbing. Same release-profile reason as the DNS forward
    # above: `apple-ffi-test`'s iOS slice is `--release`, and iOS's leave-flush
    # witness needs the window pushed PAST the test so a landed draft can only
    # be the flush. `?` because the dep is optional behind `drafts`.
    "fauna-client-drafts?/test-helpers",
    # The registry half of the E2E bridge (`call_registry_method_for_test`,
    # `src/accounts_registry.rs`) and the store fault it arms, which
    # `fauna-client-accounts` gates on `debug_assertions OR test-helpers` — the
    # same release-profile `apple-ffi-test` reason as the DNS forward above.
    # `?` because the dep is optional behind `accounts-registry`.
    "fauna-client-accounts?/test-helpers",
]

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[build-dependencies]
# The one derivation of `FAUNA_BUILD_COMMIT` (`ui/status.md` § State & data shape,
# the build leg) — stamped so `fauna_ffi_build_commit()` names the commit the
# native app's shared Rust was compiled from.
fauna-build-commit = { path = "../fauna-build-commit" }

[dependencies]
# The shared `CloudBackupExclusion::ExcludedByShell` callback is typed
# `anyhow::Result`, so the mobile custodian face (src/custodian_host.rs)
# needs the crate to build one from a foreign excluder's error.
anyhow = { workspace = true }
fauna-core = { path = "../fauna-core", default-features = false }
fauna-labeler = { path = "../fauna-labeler", optional = true }
# BARE codec for the labeler `label()` ABI (input `LabelerPostInput` / output
# `Vec<Label>`); gated with `labeler` since only that module serializes them.
serde_bare = { workspace = true, optional = true }
fauna-client-core = { path = "../fauna-client-core" }
# WS-RPC client + the Layer-3 typed-call seams. Wrapped by the
# FfiNestClient / FfiBridgesClient / FfiEmailClient / FfiSubscriptionsClient
# UniFFI façade (src/nest_client.rs, bridges.rs, email_client.rs,
# subscriptions_client.rs) so Apple/Windows/Android reach the same
# `fauna.bridges.*` / `fauna.email.*` / `fauna.subscriptions.*` kinds the
# Rust-native Linux app calls directly.
fauna-client = { path = "../fauna-client" }
# `test-helpers` only — the pure, wasm-safe half of the e2e observable contract.
fauna-e2e-contract = { path = "../fauna-e2e-contract", optional = true }
# `test-helpers` only — the process dial budget's per-test clear
# (`src/e2e_seams.rs::dial_budget_clear_for_test`).
fauna-ws-substrate = { path = "../fauna-ws-substrate", optional = true }
# The `BearerSource` seam (+ `ApiError`) the seed-less File Provider host adapts a
# Swift Keychain reader onto (`file_provider_host.rs` `ForeignBearer`), the same
# trait the bearer-only Windows sync-service uses. Already transitive via
# fauna-client; a direct path dep so the `use fauna_nest_http::…` resolves.
fauna-nest-http = { path = "../fauna-nest-http" }
# The pre-identity (anonymous) WS-RPC connector. Home of the shared
# recipient-resolution seam (`resolve_nest` / `resolve_handle` in src/resolve.rs)
# that calls the anonymous `fauna.nest.resolve` / `fauna.actor.by_handle`
# discovery kinds — so Apple/Windows/Android stop hitting the deleted
# `/api/v1/{resolve-node,actor/by-handle}` HTTP twins in per-app glue
# (priority #2/#4; api-layers.md discovery row). Already in the tree transitively via fauna-{onboarding,launch}-machine;
# named directly here so the seam reads from one place.
fauna-anon-client = { path = "../fauna-anon-client" }
fauna-client-account = { path = "../fauna-client-account" }
# The multi-account registry (NOTE: -accounts, plural — distinct from the
# WS-RPC account client above). src/accounts_registry.rs wraps it so native
# apps implement only the FfiSecretStore key/value glue
# (long-term-store.md § Multi-account evolution → Shared seam). Optional —
# behind the default-on `accounts-registry` feature the Go build drops.
fauna-client-accounts = { path = "../fauna-client-accounts", optional = true }
# The shipped catalog, for the one line the registry renders itself — a refused
# activation (`FfiAccountRegistry::switch_refusal`). `accounts-registry`-gated.
fauna-i18n = { path = "../fauna-i18n", optional = true }
# The shared credential slots (the T10 account-store writer key first of all)
# reach the phones' own secure store over the SAME FfiSecretStore seam —
# `install_platform_credential_store` in src/accounts_registry.rs lends the
# app's store to the crate's foreign arm (apps/common.md § Credential storage
# → The shared Rust credential slots on the phones). Rides the registry's
# gate: it is the registry's store being lent.
fauna-credential-store = { path = "../fauna-credential-store", optional = true }
fauna-client-admin = { path = "../fauna-client-admin" }
fauna-client-family = { path = "../fauna-client-family" }
# The gated-feature plane's transparency read + its render derivations
# (src/features.rs). Optional behind `value-format`, which is what gates the
# module itself (its LocalizedText returns would make uniffi-bindgen-go emit a
# bare `fauna_core` import) — so the Go mail-bridge's `--no-default-features`
# build does not compile the crate at all. NOT gated on `payments`/`zaps`: the
# read answers for whichever registry members a build ships.
fauna-client-features = { path = "../fauna-client-features", optional = true }
# The region content plane's app side (src/region.rs). Optional behind
# `value-format` for the same reason as `fauna-client-features` above.
fauna-client-region = { path = "../fauna-client-region", optional = true }
# The shared Status snapshot (src/status.rs — the node/sync/MLS/build legs and
# the `status-*` text projection, `ui/status.md` § State & data shape). Optional
# behind `value-format` for the same reason as `fauna-client-features` above.
fauna-client-status = { path = "../fauna-client-status", features = ["local-clock"], optional = true }
fauna-client-bridges = { path = "../fauna-client-bridges" }
# Encrypted-CalDAV Events store (events.md Decision B): `CalDavClient` over the
# `fauna.bridges.*` calendar RPCs + client-side seal/unseal of the
# `bridge_caldav_*` store, wrapped over UniFFI as FfiCaldavClient in
# src/caldav_client.rs so Apple / Windows / Android read/write the same encrypted
# store the Rust-native Linux app calls `CalDavClient` for directly (and the
