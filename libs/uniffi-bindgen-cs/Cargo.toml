[package]
name = "uniffi-bindgen-cs-fauna"
description = "C# UniFFI bindings generator (vendored from NordSecurity/uniffi-bindgen-cs PR #168, patched for uniffi 0.31)"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"

[lib]
name = "uniffi_bindgen_cs"
path = "src/lib.rs"

[[bin]]
name = "uniffi-bindgen-cs"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
askama = { version = "0.13", default-features = false, features = ["config", "derive", "alloc"] }
camino = "1.0.8"
cargo_metadata = "0.19"
clap = { workspace = true }
extend = "1.1"
fs-err = "2.7"
heck = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
textwrap = "0.16"
toml = "0.9"

uniffi_bindgen = "0.31"
uniffi_meta = "0.31"
uniffi_udl = "0.31"
