[package]
name = "fauna-client-share"
description = "Shared-Rust author seam for browser-openable share links: mint + seal + register, list with verified re-derivation, revoke, expiry options, link states, eligibility (share-links.md § Where logic lives)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The `fauna.share.*` wire types + the `RpcRequester` seam this crate is generic
# over. `default-features = false` keeps the crate wasm32-clean (drops the
# native-only `p2p` default); native builds re-enable via feature unification.
# Same pattern as fauna-client-media / fauna-client-sync.
fauna-protocol = { path = "../fauna-protocol", default-features = false }
# `share::ShareToken` (mint + sign + token id), `label_custody` (the share
# filename seal/render funnel), `identity::ActorKeypair`, `crypto::BackupKey`.
# `default-features = false` drops fauna-core's `network` default so the wasm
# build stays clean, exactly as fauna-client-media does.
fauna-core = { path = "../fauna-core", default-features = false }
hex = { workspace = true }
serde_bytes = "0.11"
# The viewer page's strings (`viewer`). Plain constants, wasm32-clean; only the
# ones the viewer names reach its wasm.
fauna-i18n = { path = "../fauna-i18n" }

# wasm: forward fauna-protocol's `js` feature (fauna-core's js-sys time
# backend) so the transitive wasm build resolves. Off on native.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fauna-protocol = { path = "../fauna-protocol", default-features = false, features = ["js"] }

[dev-dependencies]
# The shared `RpcRequester` doubles + `block_on` (one owner for the seam's fake).
fauna-client-testkit = { path = "../fauna-client-testkit" }
serde = { workspace = true }
base64 = { workspace = true }
