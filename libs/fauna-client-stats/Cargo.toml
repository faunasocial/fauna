[package]
name = "fauna-client-stats"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# fauna-protocol carries the typed `fauna.stats.*` wire types + the
# `RpcRequester` seam this crate is generic over. `default-features = false`
# keeps the crate wasm32-clean (drops native-only features); native
# workspace builds re-enable them via Cargo feature unification. The path
# form is required to override `default-features` — Cargo refuses the
# override on a `workspace = true` entry whose workspace definition doesn't
# disable defaults. Same pattern as fauna-client-snapshots.
fauna-protocol = { path = "../fauna-protocol", default-features = false }

# wasm: forward fauna-protocol's `js` feature (fauna-core's js-sys time
# backend) so the transitive wasm build resolves. Off on native.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fauna-protocol = { path = "../fauna-protocol", default-features = false, features = ["js"] }

[dev-dependencies]
# The shared `RecordingRequester` / `block_on` test double the wire-contract
# tests below drive (one owner for the `RpcRequester` seam's fake).
fauna-client-testkit = { path = "../fauna-client-testkit" }
# Names the serde bounds `RpcRequester::request` requires, for the
# construction smoke test's mock impl.
serde = { workspace = true }
