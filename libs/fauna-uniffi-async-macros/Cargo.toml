[package]
name = "fauna-uniffi-async-macros"
version.workspace = true
edition.workspace = true
license.workspace = true

# The `#[fauna_uniffi_async::export]` attribute. Depend on `fauna-uniffi-async`
# (which re-exports it next to the runtime helper its expansion calls), never
# on this crate directly.
[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
