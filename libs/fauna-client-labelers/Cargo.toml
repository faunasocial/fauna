[package]
name = "fauna-client-labelers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `RpcRequester` + `ByteBuf` + the `labelers::{List,Inspect,Subscribe,Unsubscribe}*`
# wire types for the `fauna.labelers.*` seam (`rpc.rs`). `default-features =
# false` drops the native-only `p2p`/wireguard default so this crate stays
# wasm-clean; `js` forwarded on wasm below. Mirrors fauna-client-capabilities.
fauna-protocol = { path = "../fauna-protocol", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
fauna-protocol = { path = "../fauna-protocol", default-features = false, features = ["js"] }

[dev-dependencies]
# The shared `RecordingRequester` / `block_on` test double the wire-contract
# tests below drive (one owner for the `RpcRequester` seam's fake).
fauna-client-testkit = { path = "../fauna-client-testkit" }
# Names the `serde::Serialize` / `serde::de::DeserializeOwned` bounds in the
# `rpc.rs` mock `RpcRequester` impls (mirrors fauna-client-capabilities).
serde = { workspace = true }
