[package]
name = "fauna-client-notifications"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# fauna-protocol carries the typed `fauna.notifications.*` wire types + the
# `RpcRequester` seam this crate is generic over (mirrors fauna-client-feed /
# fauna-client-posts). `default-features = false` keeps the wasm build clean;
# native workspace builds re-enable defaults via Cargo feature unification. The
# path form is required to override `default-features`.
fauna-protocol = { path = "../fauna-protocol", default-features = false }
# `notification_text` returns the shared in-process `LocalizedText` carrier and
# decides "is this body key in the catalog" against the generated catalog
# itself (behavior/notifications.md § Localized body). Both are dependency-light
# and wasm-clean.
fauna-core = { path = "../fauna-core", default-features = false }
fauna-i18n = { path = "../fauna-i18n" }
# `NotificationDestination` is a serde type so the wasm boundary can hand the
# web SPA the same decision every other app gets (the `SearchNav` shape).
serde = { workspace = true, features = ["derive"] }

# wasm: forward fauna-protocol's `js` feature (fauna-core's js-sys time
# backend) so the transitive wasm build resolves. Off on native.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fauna-protocol = { path = "../fauna-protocol", default-features = false, features = ["js"] }

[dev-dependencies]
# The shared `RecordingRequester` / `block_on` test double the wire-contract
# tests below drive (one owner for the `RpcRequester` seam's fake).
fauna-client-testkit = { path = "../fauna-client-testkit" }
# Names the serde bounds the `RpcRequester::request` method requires, for the
# construction smoke test's mock impl. No `derive` needed (trait paths only).
serde = { workspace = true }
# Pins the externally-tagged shape `NotificationDestination` crosses the wasm
# boundary in (the web SPA reads `{ External: { url } }` / `"Family"`).
serde_json = { workspace = true }
