[package]
name = "fauna-client-posts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# fauna-protocol carries the typed `fauna.posts.*` wire types + the
# `RpcRequester` seam this crate is generic over (mirrors fauna-client-bridges).
# `default-features = false` drops the native-only `p2p` feature so this crate
# compiles to wasm32; native workspace builds re-enable it via Cargo feature
# unification (fauna-client pulls it). The path form is required to override
# `default-features` — Cargo refuses the override on a `workspace = true` entry
# whose workspace definition doesn't disable defaults.
fauna-protocol = { path = "../fauna-protocol", default-features = false }

# wasm: forward fauna-protocol's `js` feature (fauna-core's js-sys time
# backend) so the transitive wasm build resolves. Off on native.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fauna-protocol = { path = "../fauna-protocol", default-features = false, features = ["js"] }

[dev-dependencies]
# The shared `RecordingRequester` / `block_on` test double the wire-contract
# tests below drive (one owner for the `RpcRequester` seam's fake).
fauna-client-testkit = { path = "../fauna-client-testkit" }
# Names the serde bounds the `RpcRequester::request` method requires, for the
# construction smoke test's mock impl. No `derive` needed (trait paths only).
serde = { workspace = true }
