# Recorded exceptions for the `dep-npm-audit` check — the
# known-vulnerability check over the locked npm closure of each Deno tree.
# Owner: docs/goal/architecture/release-integrity.md § Dependency verification →
# *The locked npm closure*.
#
# An advisory is closed by bumping the lockfile to a fixed version. An entry here is
# for an advisory that cannot be fixed yet (no fixed version inside the 7-day minimum
# release age, or the fix is a major bump still owed) AND whose vulnerable code is
# shown not to run in anything this project ships or builds. `reason` states that
# showing, in our own words — never the advisory's text pasted in.
#
# One entry per (tree, advisory id, package); every field is required. An entry that
# matches no reported advisory fails the check: remove it, so it cannot cover a later
# advisory by accident.
#
# [[exception]]
# tree = "apps/fauna-web"            # the directory that tracks the deno.lock
# id = "GHSA-xxxx-xxxx-xxxx"
# package = "name"
# reason = "..."
# recorded = "YYYY-MM-DD"
