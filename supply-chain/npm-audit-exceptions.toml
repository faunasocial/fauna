package = "astro"
reason = "The fix (7.4.5 and later; the queued need takes 7.4.7) was published on 2026-11-13, inside the 7-day minimum release age. The finding needs a template that renders an element under a dynamic tag name with attributes an attacker controls. No page or component under sites/fauna-social/src uses a dynamic tag name, and every page is rendered at build time from the repository's own files, with no visitor input. Carried from 0.1.6 (astro 7.3.5); the bump is a queued need."
recorded = "2026-11-13"

