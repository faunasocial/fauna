# Recorded exceptions for the `dep-npm-audit` check — the
# known-vulnerability check over the locked npm closure of each Deno tree.
# Owner: docs/goal/architecture/release-integrity.md § Dependency verification →
# *The locked npm closure*.
#
# An advisory is closed by bumping the lockfile to a fixed version. An entry here is
# for an advisory that cannot be fixed yet (no fixed version inside the 7-day minimum
# release age, or the fix is a major bump still owed) AND whose vulnerable code is
# shown not to run in anything this project ships or builds. `reason` states that
# showing, in our own words — never the advisory's text pasted in.
#
# One entry per (tree, advisory id, package); every field is required. An entry that
# matches no reported advisory fails the check: remove it, so it cannot cover a later
# advisory by accident.
#
# [[exception]]
# tree = "apps/fauna-web"            # the directory that tracks the deno.lock
# id = "GHSA-xxxx-xxxx-xxxx"
# package = "name"
# reason = "..."
# recorded = "YYYY-MM-DD"

[[exception]]
tree = "apps/fauna-web"
id = "GHSA-gcqx-w48m-w2h4"
package = "deepmerge"
reason = "No fixed release exists (4.3.1 is the newest). It reaches the web tree only through the Svelte Vite build plugin, which merges the build's own configuration objects at build time; it is not in the shipped bundle and never sees user or network data. Owner-approved in bump round 17 (2026-11-05) knowing it runs in the build. Remove when a fixed deepmerge, or a plugin release without it, clears the 7-day age."
recorded = "2026-11-05"

[[exception]]
tree = "sites/fauna-social"
id = "GHSA-r3h5-4585-7x3w"
package = "astro"
reason = "The fix (7.4.7) was published on 2026-11-13, inside the 7-day minimum release age. The finding is in the image endpoint of Astro's Node server adapter. The site is built with output 'static' (sites/fauna-social/astro.config.mjs) and its lock holds no Node adapter package, so no server endpoint of Astro's exists in what is deployed: the pages are files. Carried from 0.1.6 (astro 7.3.5); the bump is a queued need."
recorded = "2026-11-13"

[[exception]]
