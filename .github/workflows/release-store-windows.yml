name: Release (Microsoft Store packages)

# The two Microsoft Store packages (Fauna-Store-x64.msix, Fauna-Store-arm64.msix)
# are built HERE -- on GitHub-hosted runners, from the public commit a version
# records -- and graded in the job. The owner downloads the run's artifacts,
# checks each SHA-256 and identity, and uploads them in Partner Center. Design:
# docs/goal/architecture/release-integrity.md § Release signing -> *A store
# upload is built from a recorded public commit*, and
# docs/goal/architecture/installers/windows.md § Store distribution (MSIX).
#
# Why a workflow of its own, dispatched by hand, and not a job in release.yml:
#
#   * The Store signs the package itself, so a Store payload is UNSIGNED and is
#     never a download. release.yml's `release` job downloads every artifact of
#     its run, hashes, cosign-signs and publishes all of them; a Store job in
#     that run would put its packages on the GitHub Release. A separate workflow
#     cannot leak into it by construction.
#   * The input is the PUBLIC COMMIT the version records, so "built from the
#     recorded commit" holds because the runner checks out exactly that commit
#     and the job asserts it did.
#
# Trust: no secret, no Environment, a read-only token. Nothing here publishes;
# the artifacts expire with the run.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "The public commit the version records (full 40-hex SHA)"
        required: true
        type: string
      # The Store ships a store flavour (installers/windows.md § Store
      # distribution, the flavour paragraph): `store-no-payments` from the
      # first version whose recorded commit carries the Windows leg of that
      # flavour, `store-safe` for an older commit. This text reaches the public
      # repository only in a tree that carries the leg, so the default meets an
      # older commit only when one is dispatched on purpose -- and the resolve
      # step below refuses that, naming `store-safe`. (A commit that old also
      # predates the hosted-runner recipes, which the step before it refuses.)
      flavour:
        description: "The store flavour to build: store-no-payments (payments and zaps excised, sharing kept) or store-safe (all three excised; a recorded commit older than the store-no-payments leg)"
        required: true
        type: choice
        options:
          - store-no-payments
          - store-safe
        default: store-no-payments

permissions:
  contents: read

concurrency:
  group: release-store-windows-${{ inputs.commit }}
  cancel-in-progress: false

env:
  # The Partner Center reservation (installers/windows.md § Identity &
  # coexistence). The packer writes it into the manifest; the grade step
  # reads it back out of the package.
  STORE_IDENTITY_NAME: FaunaSocial.FaunaSocial
  STORE_PUBLISHER: "CN=E8868D60-047A-46A3-B608-0D4CA88AB791"
  # The runner's Python writes stdout in cp1252; the packer and the grade
  # print non-ASCII, which crashed the pack before it built anything.
  PYTHONUTF8: "1"
  # Artifact build: per-invocation feature resolution, never workspace-unified
  # (.cargo/config.toml § feature unification) -- the recipe's own setting.
  CARGO_RESOLVER_FEATURE_UNIFICATION: selected

jobs:
  # `just windows-store-package <arch> <flavour> <identity> <publisher>` -- the
  # recipe the machines build the package with (release-integrity.md § What a
  # release ships -> *Every release build runs the `just` recipe*), from the
  # recorded commit's own tree: its production FFI and C# bindings, the sync
  # agent and the shell extension, the self-contained app published with
  # MSBuild, the staged payload and the pack, each arch named by its triple from
  # this x64 runner. The flavour is the dispatch's `flavour` input
  # (installers/windows.md § Store distribution, the flavour paragraph):
  # Microsoft Store Policies 10.8 ask a non-game app taking payment to name the
  # commerce provider at each transaction, so the Store build carries no
  # payments plane, and zaps go with it; `store-safe` drops peer-to-peer sharing
  # too. The recipe's flavour table is the one place a flavour's settings live.
  # The direct-download MSI (release.yml) keeps the full build.
  build-store:
    strategy:
      # Each architecture reports on its own: a red on one leg says nothing
      # about the other, and cancelling it hides the evidence.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Refuse anything but a full commit SHA
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::commit must be a full 40-hex SHA, got '$COMMIT'"; exit 1; }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Assert the checkout is the recorded commit
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          head="$(git rev-parse HEAD)"
          [ "$head" = "$COMMIT" ] || {
            echo "::error::checked out $head, the version records $COMMIT"; exit 1; }

      # The recorded commit's recipes are what build the package, so they must
      # build both arches from this x64 runner: a tree older than that has a
      # scripts/cargo-win.cmd that assumes an arm64 host and a
      # windows-store-package that builds arm64 as the implicit host -- on this
      # runner, an x64 package under the arm64 name. Such a commit (0.1.5's
      # included) is refused here, naming where it can still be built.
      - name: Refuse a recorded commit whose recipes predate the hosted runner
        shell: bash
        run: |
          grep -qF 'host: x86_64-' scripts/cargo-win.cmd \
            && grep -qF 'arm64) TARGET=aarch64-pc-windows-msvc;' justfile || {
            echo "::error::this recorded commit's Windows recipes predate the x64 hosted runner (its scripts/cargo-win.cmd assumes an arm64 host, and its windows-store-package builds arm64 as the host); build its packages on an arm64 Windows machine from a public clone at that commit: just windows-store-package <arch> <flavour> <identity> <publisher>"
            exit 1; }

      # The flavour, resolved once and read by the build and the grade. A
      # flavour's settings live in `just windows-store-package`'s table; this
      # step only refuses a flavour the recorded commit cannot build.
      - name: Resolve the flavour
        shell: bash
        env:
          FLAVOUR: ${{ inputs.flavour }}
        run: |
          case "$FLAVOUR" in
            store-no-payments)
              grep -q FaunaExcisePayments apps/fauna-windows/FaunaApp/FaunaApp/FaunaApp.csproj || {
                echo "::error::this recorded commit predates the store-no-payments leg (FaunaApp.csproj has no FaunaExcisePayments); dispatch it with flavour=store-safe"
                exit 1; }
              ;;
            store-safe) ;;
            *)
              echo "::error::unknown flavour '$FLAVOUR'"
              exit 1 ;;
          esac
          echo "STORE_FLAVOUR=$FLAVOUR" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0, toolchain from rust-toolchain.toml
        with:
          target: ${{ matrix.rust_target }}
          rustflags: ""
          cache: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: '10.0.204'  # = global.json; moves only in a bump round

      - name: Install uv
        shell: bash
        run: bash scripts/install-uv.sh
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      # Build and pack. The recipe builds the PRODUCTION FFI (no `test-helpers`:
      # the automation surface is compiled out of a shipped package, convention
      # 15) in the store flavour and the app against its excised face, and its
      # packer refuses a payload missing its native core or carrying the
      # automation surface. The package lands in build/installer/.
      - name: Build and pack the Store package
        shell: bash
        run: just windows-store-package ${{ matrix.arch }} "$STORE_FLAVOUR" "$STORE_IDENTITY_NAME" "$STORE_PUBLISHER"

      # The XAML compiler can fail with no message on the console; the binary
      # log the recipe's publish writes carries its diagnostics. Nothing secret
      # is in scope in this workflow.
      - name: Keep the publish log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: publish-binlog-${{ matrix.arch }}
          path: build/installer/app-publish-${{ matrix.arch }}.binlog
          if-no-files-found: warn

      # Grade the PACKAGE: the grade reads the finished .msix back -- identity
      # (the reservation above, the version in Package.wxs, this arch),
      # runFullTrust as the only capability, every PE built for this arch, no
      # .pdb, no automation surface, and the flavour's excision: the packaged
      # fauna_ffi.dll carries no `fauna.payments.*` / `fauna.tips.*` /
      # zap-signer kind string, and the peer-to-peer sharing faces exactly when
      # the flavour keeps them (`just windows-store-safe-check`'s native
      # column). Standard-library Python, run on the runner image's own
      # interpreter.
      #
      # The grade comes from THIS workflow's commit, not the recorded one: an
      # older recorded commit may predate a grade, and the grade is a check on
      # the package, not part of what the version builds. Sparse: the packer,
      # its identity helper and the installer files they read at import.
      - name: Check out the grade (this workflow's commit)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: grader
          sparse-checkout: |
            scripts
            apps/fauna-windows/installer

      - name: Grade
        run: >
          python grader/scripts/build-store-package.py
          --grade build/installer/Fauna-Store-${{ matrix.arch }}.msix
          --flavour "$env:STORE_FLAVOUR"
          --package-wxs apps/fauna-windows/installer/Package.wxs
          --arch ${{ matrix.arch }}
          --identity-name "$env:STORE_IDENTITY_NAME"
          --publisher "$env:STORE_PUBLISHER"

      - name: SHA-256
        shell: bash
        working-directory: build/installer
        run: |
          sha256sum Fauna-Store-${{ matrix.arch }}.msix > Fauna-Store-${{ matrix.arch }}.msix.sha256
          cat Fauna-Store-${{ matrix.arch }}.msix.sha256

      # Workflow artifacts, NOT release assets: an unsigned Store payload is not
      # a download (the Store signs it at certification).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: store-windows-${{ matrix.arch }}
          path: |
            build/installer/Fauna-Store-${{ matrix.arch }}.msix
            build/installer/Fauna-Store-${{ matrix.arch }}.msix.sha256
          if-no-files-found: error
