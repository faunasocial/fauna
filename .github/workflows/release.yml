name: Release

# Server/CLI binaries (four Rust targets), the terminal app's Linux and
# Windows archives (fauna-tui + fauna-sync-agent; the macOS ones are
# release-macos.yml's, which holds the signing credentials) and the Windows MSI
# installer (x64 + ARM64) are built HERE -- from this repository's tag, on
# GitHub-hosted runners -- and every published file is cosign-signed with this workflow's own
# Sigstore identity, so anyone can check that a download is the exact output of
# this source and this workflow (the verification recipe ships in the release
# notes below). Design: docs/goal/architecture/release-integrity.md § Release
# signing -> When a release workflow publishes.
#
# When it publishes: on a `v*` TAG ref, and on nothing else -- every other ref
# is a dry run. A branch dispatch builds all four Rust targets and both Windows
# arches and publishes nothing (`github.ref` is `refs/heads/...`, so the
# `release` job's guard is false); a `v*` tag push -- or a dispatch naming the
# tag as its ref, which produces the same `github.ref` -- publishes. Same rule
# as `release-macos.yml`, expressed against the ref alone.
#
# Trust split, same shape as `release-macos.yml`: the build jobs hold no
# credentials and only a read token; the `release` job alone can write, and it
# runs inside the `release` Environment (required reviewer + `v*` tags only),
# so nothing is published without a human approving that specific run.
#
# The stores (docs/goal/architecture/installers/store-review.md § The store
# legs): the Microsoft Store's two packages are built by `store-windows`, which
# calls release-store-windows.yml as a reusable workflow -- no credential, and
# artifact names no publish pattern takes -- and the approved `release` job
# submits them to Partner Center as its LAST steps, after the downloads are
# out, so the owner's one approval of the run covers the store too (GitHub
# approves an Environment per job, never per run). A stores-only dispatch
# (`stores_commit`, at the version's tag) builds the store packages from that
# recorded commit and runs the store steps alone, publishing no download: how a
# store step that went red after its release's downloads were out is finished.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # A stores-only run (installers/store-review.md § The store legs, *A
      # version already tagged is taken into the stores by the same steps,
      # dispatched*): the public commit a version records. The store builds
      # are made from it, and the approved job runs its store steps alone and
      # publishes no download. Empty (and on every tag push): the full release.
      stores_commit:
        description: "Stores only: the public commit the version records (full 40-hex SHA); empty for the full release"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Artifact builds: per-invocation feature resolution, never workspace-unified
  # (.cargo/config.toml § feature unification) -- the recipes' own setting, so a
  # shipped binary carries only the features its own invocation asks for.
  CARGO_RESOLVER_FEATURE_UNIFICATION: selected
  # A Windows runner's Python writes stdout in cp1252, and the recipes' Python
  # (the staleness gate, the generators, the FFI witnesses) prints non-ASCII.
  PYTHONUTF8: "1"

jobs:
  # Gate: supply chain must be clean
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0, toolchain from rust-toolchain.toml
        with:
          rustflags: ""
          cache: false
      # Built `--locked` on an exact STABLE toolchain, never the pinned nightly:
      # cargo-vet's own lockfile pins dependency versions the nightly in
      # rust-toolchain.toml refuses to compile (the first dispatch, 2026-10-10,
      # died here on `rustix` 0.37's reserved `rustc_` attributes), and an
      # unlocked install resolves whatever is newest that day (wasm-pack's broke
      # on a withdrawn `zip`, 2026-10-16). The internal supply-chain workflow
      # builds the same tool `--locked` on stable. What it verifies — the tree's
      # own Cargo.lock — stays `--locked` below, on the pinned toolchain.
      - name: Install cargo-vet
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 install --locked cargo-vet@0.10.2
      - name: Verify supply chain
        run: cargo vet --locked

  # Build Rust server/CLI binaries (all 4 targets)
  build-rust:
    needs: supply-chain
    if: inputs.stores_commit == ''
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Native, not cross-compiled: the linux desktop app links GTK4 and
          # libadwaita, which an x64 runner cannot supply for arm64 simply.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0, toolchain from rust-toolchain.toml
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          cache: false

      # libdbus-1-dev: the tray crate (ksni) links libdbus-sys, whose build
      # script finds dbus-1 through pkg-config (ci.yml's linux jobs install it too).
      - name: Install GTK4/libadwaita/dbus dev packages (for fauna-linux)
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config

      - name: Install uv
        run: bash scripts/install-uv.sh
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          command -v bwrap || { sudo apt-get update && sudo apt-get install -y bubblewrap; }
          bwrap --unshare-all --ro-bind / / true
          ldconfig -p | grep -q 'libseccomp\.so\.2 ' || { echo "libseccomp.so.2 missing (libseccomp2)"; exit 1; }
      # The cargo boundary (docs/goal/architecture/build-compile-cache.md § The
      # boundary's scope and what OFF means, decision (6)): puts the shipped cargo
      # shim first on PATH, so every later cargo of this job — a recipe's, a bare
      # step's, one a tool spawns — compiles with no network; the job's last step
      # witnesses it.
      - name: Put every cargo behind the boundary
        run: uv run --no-project python scripts/cargo-boundary.py runner-setup

      # The nest a release ships is the image's flavor: the same feature set
      # the Dockerfile's nest build line enables (pinned by the publish
      # tooling's workflow-shape tests), so a downloaded binary and the image
      # are one server.
      - name: Build the nest (the image's flavor)
        run: just nest ${{ matrix.target }}

      - name: Build server binaries
        run: just servers-release ${{ matrix.target }}

      - name: Build fauna-linux (Linux)
        if: contains(matrix.target, 'linux')
        run: just linux-release ${{ matrix.target }}

      # The terminal app's channel (docs/goal/architecture/installers/tui.md
      # § The ratified channel): one archive per Linux target carrying
      # fauna-tui + fauna-sync-agent + fauna-cli + install.sh, assembled by the
      # one script the install-then-drive witness runs too. fauna-cli is the
      # cli app's device shell (package fauna-cli-device; apps/cli.md § The
      # device shell), the archive's third member since decision 4. The full
      # default-feature flavor (a direct download, not a store). The macOS
      # trio is NOT built here: its archive must be Developer ID-signed and
      # notarized before it is published, so it is built and signed by
      # release-macos.yml, whose `sign` job holds those credentials.
      - name: Build fauna-tui + fauna-sync-agent + fauna-cli (Linux)
        if: contains(matrix.target, 'linux')
        run: just tui-release ${{ matrix.target }}

      - name: Collect and rename binaries
        run: |
          mkdir -p artifacts
          target=${{ matrix.target }}
          case "$target" in
            x86_64-unknown-linux-gnu)   suffix="x86_64-linux" ;;
            aarch64-unknown-linux-gnu)  suffix="aarch64-linux" ;;
            x86_64-apple-darwin)        suffix="x86_64-darwin" ;;
            aarch64-apple-darwin)       suffix="aarch64-darwin" ;;
          esac

          # collect <bin> <asset> <notices artifact>: a binary the build did
          # not produce fails the job — a release missing an asset must not
          # publish quietly. Each bare binary gets its sibling
          # <asset>.NOTICES.txt from the notices generator, for the manifest
          # artifact named, resolved for this leg's own triple only
          # (shipped-notices.md § Per channel, the bare-binary row); a
          # generator that refuses fails the job too. LICENSE-MIT and
          # LICENSE-APACHE come once per release, from the x86_64 Linux leg
          # below, and are signed and summed with every other asset.
          collect() {
            src="target/${target}/release/$1"
            if [ ! -f "$src" ]; then
              echo "::error::the build produced no ${src} (asset $2-${suffix})"
              exit 1
            fi
            cp "$src" "artifacts/$2-${suffix}"
            just shipped-notices "$3" "artifacts/$2-${suffix}.NOTICES.txt" --target "$target" || exit 1
          }

          for crate in fauna-nest fauna-push-relay fauna-cors-proxy fauna-front-door; do
            collect "$crate" "$crate" "release-${crate#fauna-}"
          done

          # The linux desktop app: package fauna-linux, binary fauna-desktop.
          if [[ "$target" == *linux* ]]; then
            collect fauna-desktop fauna-linux release-linux-desktop
          fi

          # Fauna's two licence texts, once per release: one leg's artifact
          # carries them (the publish job merges every leg's into one set).
          if [ "$target" = x86_64-unknown-linux-gnu ]; then
            just shipped-licences artifacts
          fi

          # The terminal app's archive: fauna-tui-<suffix>.tar.gz (Linux
          # targets). Its notices file is written outside artifacts/: it ships
          # inside the archive, never as an asset of its own.
          if [[ "$target" == *linux* ]]; then
            just shipped-notices terminal-archive-linux notices/terminal-archive-linux.txt --target "$target"
            bash apps/fauna-tui/packaging/assemble-archive.sh \
              --bin-dir "target/${target}/release" --out artifacts --suffix "$suffix" \
              --notices notices/terminal-archive-linux.txt
            rm -rf "artifacts/fauna-tui-${suffix}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rust-${{ matrix.target }}
          path: artifacts/

      - name: Every cargo compiled behind the boundary
        if: ${{ !cancelled() }}
        run: uv run --no-project python scripts/cargo-boundary.py runner-witness

  # The Windows MSI installer (x64 + ARM64), built as parallel jobs per arch
  # that hand their outputs on as `part-windows-*` artifacts: the MSVC
  # fauna_ffi.dll + its C# bindings, the Windows service crates, the terminal
  # app's binaries and the gnullvm Go mail bridge each build on a runner of
  # their own, and `build-windows` assembles the .NET app, the MSI and the
  # terminal archive from them. One serial job per arch measured FFI 58 min,
  # services 63, tui + cli 40 and then the Go bridge, the .NET app, the MSI and
  # the smoke test in the 0.1.5 dry run (run 39559634265) -- past 180 min, with
  # the hosted 360 as the only ceiling left -- so the arch's wall clock is now
  # the slowest part plus the assembly. A `part-` artifact is an intermediate:
  # the `release` job downloads by name pattern and never sees one.
  #
  # Every build here is a `just` recipe the dev machines build with
  # (release-integrity.md § What a release ships -> *Every release build runs
  # the `just` recipe*), each taking the target the runner names. The MSVC
  # recipes run cargo through scripts/cargo-win.cmd, which sets up the x64
  # host's tools for the target's arch -- the INCLUDE among them that ring's
  # clang build for aarch64-pc-windows-msvc (through hickory) needs to find the
  # MSVC and Windows SDK headers ("'assert.h' file not found" without it).

  # fauna-ffi and its C# UniFFI bindings, both consumed by the .NET build:
  # FaunaApp.Core compiles Generated/uniffi/*.cs and the app packs
  # runtimes/<rid>/native/fauna_ffi.dll (both gitignored), which is where
  # `just windows-ffi` stages them. The bindgen tool builds for the host (x64)
  # and reads metadata from the target-arch dll -- uniffi metadata is
  # arch-independent. It builds the PRODUCTION flavor -- NO `test-helpers` --
  # so the shipped MSI carries no test seam (docs/goal/architecture/testing.md's
  # automation surface rule; the app's own automation code is `#if DEBUG`-gated
  # and this is a Release build), and the recipe's own witness refuses any seam
  # export in the bindings it generated.
  windows-ffi:
    needs: supply-chain
    if: inputs.stores_commit == ''
    strategy:
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            dotnet_rid: win-x64
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            dotnet_rid: win-arm64
    runs-on: windows-latest
    # Measured at most 62 min per arch over eight split runs (0.1.5 dry runs
    # and the v0.1.5 tag run, 37-62 min); about 1.5x that.
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0, toolchain from rust-toolchain.toml
        with:
          target: ${{ matrix.rust_target }}
          rustflags: ""
          cache: false

      - name: Install uv
        shell: bash
        run: bash scripts/install-uv.sh
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Build FFI + generate C# bindings
        shell: bash
        run: |
          just windows-ffi release ${{ matrix.rust_target }}
          mkdir -p part/uniffi
          cp apps/fauna-windows/FaunaApp/FaunaApp.Core/Generated/uniffi/*.cs part/uniffi/
          cp apps/fauna-windows/FaunaApp/FaunaApp/runtimes/${{ matrix.dotnet_rid }}/native/fauna_ffi.dll part/fauna_ffi.dll

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: part-windows-ffi-${{ matrix.arch }}
          path: part/
          if-no-files-found: error

  # The installer ships the sync agent + two machine-service exes (FaunaNest,
  # FaunaBridge -- one per virtual account) plus the shell-ext cdylib
  # (`just windows-services-release`, each crate its own cargo invocation, so
  # the shipped agent carries only the feature set it asks for). These crates
  # are root-workspace members, so they build from the repo root against the
  # one committed Cargo.lock and `--locked` holds for real.
  windows-services:
    needs: supply-chain
    if: inputs.stores_commit == ''
    strategy:
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    # Measured at most 76 min per arch over eight split runs (45-76 min, the
    # arm64 leg the slower); about 1.5x that.
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0, toolchain from rust-toolchain.toml
        with:
          target: ${{ matrix.rust_target }}
          rustflags: ""
          cache: false

      - name: Install uv
        shell: bash
        run: bash scripts/install-uv.sh
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Build Rust binaries (Windows service crates)
        shell: bash
        run: |
          just windows-services-release ${{ matrix.rust_target }}
          rel=target/${{ matrix.rust_target }}/release
          mkdir -p part
          cp "$rel/fauna-sync-agent.exe" "$rel/fauna-nest-svc.exe" "$rel/fauna-bridge-svc.exe" "$rel/fauna_shell.dll" part/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: part-windows-services-${{ matrix.arch }}
          path: part/
          if-no-files-found: error

  # The terminal app (installers/tui.md § The ratified channel): the MSI's
  # TerminalApp feature carries fauna-tui.exe and fauna-cli.exe (the cli app's
  # device shell, package fauna-cli-device — the archive's third member,
  # decision 4) beside fauna-sync-agent.exe (TerminalApp.wxs), and the same
  # binaries ship as the per-arch zip archive with the agent — the
  # headless-box download. The Store MSIX does NOT carry them (user ruling
  # 2026-09-26). Full default-feature flavor, built by `just tui-release` as on
  # the Linux and macOS legs; the agent that recipe builds beside them is left
  # here -- the MSI and the zip ship the services part's, built in its own
  # invocation.
  windows-terminal:
    needs: supply-chain
    if: inputs.stores_commit == ''
    strategy:
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    # Measured at most 52 min per arch over eight split runs (32-52 min); about
    # 1.5x that.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0, toolchain from rust-toolchain.toml
        with:
          target: ${{ matrix.rust_target }}
          rustflags: ""
          cache: false

      - name: Install uv
        shell: bash
        run: bash scripts/install-uv.sh
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Build fauna-tui + fauna-cli (terminal app + cli app)
        shell: bash
        run: |
          just tui-release ${{ matrix.rust_target }}
          rel=target/${{ matrix.rust_target }}/release
          mkdir -p part
          cp "$rel/fauna-tui.exe" "$rel/fauna-cli.exe" part/
          # The zip's notices file, written here where the Rust toolchain is
          # (build-windows assembles without one) and carried in the part.
          just shipped-notices terminal-archive-windows part/THIRD-PARTY-NOTICES.txt --target ${{ matrix.rust_target }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: part-windows-terminal-${{ matrix.arch }}
          path: part/
          if-no-files-found: error

  # Cross-compile the Go fauna-mail-bridge MDA (`just windows-mail-bridge-build`,
  # whose `_windows-go-cgo-env` holds the one fauna-ffi feature set the bridge
  # links: `--no-default-features --features labeler`). It builds a SEPARATE
  # gnullvm fauna_ffi.dll -- whose toolchain IS llvm-mingw, so cgo links its
  # GNU import lib (libfauna_ffi.dll.a) natively, sidestepping the MSVC<->MinGW
  # seam; the C# app keeps its own crt-static MSVC fauna_ffi.dll (a different
  # job, never mixed). Hands on fauna-mail-bridge.exe + the gnullvm
  # fauna_ffi.dll + libunwind.dll (the gnullvm dll's one non-OS runtime dep,
  # the target triple's own copy), all three staged by the recipe in target/,
  # and the toolchain's licence files the recipe stages beside them
  # (llvm-mingw/LICENSE.TXT, which the MSI's notices copy for libunwind.dll, and
  # llvm-mingw/mingw32/, the mingw-w64 runtime's, which the gnullvm link puts
  # into the exe and its dll): the assembly job has no toolchain to take them from.
  windows-mail-bridge:
    needs: supply-chain
    if: inputs.stores_commit == ''
    strategy:
      matrix:
        include:
          - arch: x64
            rust_target_gnullvm: x86_64-pc-windows-gnullvm
            go_arch: amd64
          - arch: arm64
            rust_target_gnullvm: aarch64-pc-windows-gnullvm
            go_arch: arm64
    runs-on: windows-latest
    # Measured at most 38 min per arch over eight split runs (23-38 min); about
    # 1.5x that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0, toolchain from rust-toolchain.toml
        with:
          target: ${{ matrix.rust_target_gnullvm }}
          rustflags: ""
          cache: false

      - name: Install uv
        shell: bash
        run: bash scripts/install-uv.sh
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      # Go toolchain for the cgo fauna-mail-bridge MDA (the IMAP/CalDAV server
      # the FaunaBridge service supervises). Version pinned via the module's go.mod.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: bins/fauna-bridges/go.mod

      # MinGW (LLVM) cross-compiler for the cgo MDA. Go's cgo does NOT support
      # MSVC cl.exe, so the MDA links a dedicated gnullvm fauna_ffi.dll built
      # with llvm-mingw. The x86_64-host build bundles BOTH the
      # x86_64-w64-mingw32 and aarch64-w64-mingw32 cross-compilers, so this ONE
      # install on the x64 runner serves both matrix arches. Version-pinned and
      # checksum-verified; the expected value is the sha256 content digest of
      # the public release asset. The MSI's notices name this release for its
      # libunwind.dll (installer/shipped-notices.toml, the bundled entry, with
      # the LLVM version it is built from): a tier_1 test holds them equal.
      - name: Install llvm-mingw (cgo cross-compiler for the Go MDA)
        shell: pwsh
        run: |
          $ver = "20260616"
          $digest = "sha256:b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35"
          $sha = $digest.Substring(7)
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip" -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($got -ine $sha) { throw "llvm-mingw checksum mismatch: expected $sha got $got" }
          Expand-Archive $zip -DestinationPath C:\ -Force
          "C:\llvm-mingw-$ver-ucrt-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The serial job's gnullvm build ran with the arm64 leg's INCLUDE in its
      # environment; the part keeps that environment rather than change two
      # things at once.
      - name: MSVC headers for the arm64 clang build (ring)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the ARM64 C++ tools on this runner" }
          $include = cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" amd64_arm64 >nul && set INCLUDE" | Select-String '^INCLUDE=' | Select-Object -First 1
          if (-not $include) { throw "vcvarsall amd64_arm64 set no INCLUDE" }
          "$include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Go mail-bridge MDA (cgo, gnullvm)
        shell: bash
        run: |
          just windows-mail-bridge-build ${{ matrix.rust_target_gnullvm }} ${{ matrix.go_arch }}
          mkdir -p part/llvm-mingw
          cp target/fauna-mail-bridge.exe target/fauna_ffi.dll target/libunwind.dll part/
          cp target/llvm-mingw/LICENSE.TXT part/llvm-mingw/
          cp -r target/llvm-mingw/mingw32 part/llvm-mingw/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: part-windows-mail-bridge-${{ matrix.arch }}
          path: part/
          if-no-files-found: error

  # Assemble each arch's MSI and terminal archive from the parts above: the
  # .NET app, the MSI, the zip, and (x64) the install smoke. No Rust builds here:
  # the Rust toolchain and Go are here for the MSI's notices file alone, whose
  # generator reads `cargo tree` and `go version -m` and compiles nothing.
  build-windows:
    needs: [windows-ffi, windows-services, windows-terminal, windows-mail-bridge]
    strategy:
      matrix:
        include:
          - arch: x64
            dotnet_rid: win-x64
          - arch: arm64
            dotnet_rid: win-arm64
    runs-on: windows-latest
    # Measured at most 9.4 min per arch over the five split runs that reached it
    # (6-10 min), before the notices step: a toolchain install, the locked crate
    # set fetched and the closure resolved (6.5 min on a loaded Windows dev VM with
    # a warm cache, 2026-11-13; not yet measured on a hosted runner); about 1.5x
    # the sum.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: '10.0.204'  # = global.json; moves only in a bump round

      # The MSI's notices file covers the parts' Rust and Go closures and this
      # job's NuGet one, and project.assets.json exists only here, so the
      # generator runs here: `cargo` for its resolve (no target, nothing built)
      # and `go` for the bridge's recorded module list.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0, toolchain from rust-toolchain.toml
        with:
          rustflags: ""
          cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: bins/fauna-bridges/go.mod

      - name: Install uv
        shell: bash
        run: bash scripts/install-uv.sh
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add WixToolset.Util.wixext/6.0.2
          wix extension add WixToolset.UI.wixext/6.0.2
          wix extension add WixToolset.Firewall.wixext/6.0.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: part-windows-ffi-${{ matrix.arch }}
          path: parts/ffi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: part-windows-services-${{ matrix.arch }}
          path: parts/services
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: part-windows-terminal-${{ matrix.arch }}
          path: parts/terminal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: part-windows-mail-bridge-${{ matrix.arch }}
          path: parts/mail-bridge

      # The C# bindings and the native dll go where the app's build expects
      # them, BEFORE the .NET build (both paths are gitignored).
      - name: Stage the C# bindings + native dll
        shell: bash
        run: |
          mkdir -p apps/fauna-windows/FaunaApp/FaunaApp.Core/Generated/uniffi
          cp parts/ffi/uniffi/*.cs apps/fauna-windows/FaunaApp/FaunaApp.Core/Generated/uniffi/
          mkdir -p apps/fauna-windows/FaunaApp/FaunaApp/runtimes/${{ matrix.dotnet_rid }}/native
          cp parts/ffi/fauna_ffi.dll \
             apps/fauna-windows/FaunaApp/FaunaApp/runtimes/${{ matrix.dotnet_rid }}/native/fauna_ffi.dll

      # Publish self-contained so the MSI runs on a bare VM with no .NET 10 /
      # Windows App SDK runtime install (the works-out-of-the-box invariant):
      # `just windows-app-publish`, the one publish recipe the Store package's
      # app is built with too (MSBuild, never `dotnet publish` -- the recipe has
      # the why).
      - name: Build .NET app
        shell: bash
        run: just windows-app-publish ${{ matrix.arch }}

      # The XAML compiler can fail with no message on the console; the binary
      # log the recipe writes carries its diagnostics.
      - name: Keep the publish log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: publish-binlog-${{ matrix.arch }}
          path: build/installer/app-publish-${{ matrix.arch }}.binlog
          if-no-files-found: warn

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p stage/${{ matrix.arch }}/icons stage/${{ matrix.arch }}/app
          cp parts/services/fauna-sync-agent.exe stage/${{ matrix.arch }}/
          cp parts/terminal/fauna-tui.exe        stage/${{ matrix.arch }}/
          cp parts/terminal/fauna-cli.exe        stage/${{ matrix.arch }}/
          cp parts/services/fauna-nest-svc.exe   stage/${{ matrix.arch }}/
          cp parts/services/fauna-bridge-svc.exe stage/${{ matrix.arch }}/
          cp parts/services/fauna_shell.dll      stage/${{ matrix.arch }}/fauna_shell.dll
          # The Go MDA + its gnullvm runtime DLLs. These ship beside
          # fauna-bridge-svc.exe in INSTALLFOLDER; the WinUI app's own MSVC
          # fauna_ffi.dll lands under app/ (a different MSI dir), so the two
          # same-named dlls never collide.
          cp parts/mail-bridge/fauna-mail-bridge.exe stage/${{ matrix.arch }}/
          cp parts/mail-bridge/fauna_ffi.dll         stage/${{ matrix.arch }}/
          cp parts/mail-bridge/libunwind.dll         stage/${{ matrix.arch }}/
          cp apps/fauna-windows/shell-ext/src/icons/*.ico stage/${{ matrix.arch }}/icons/
          # Package.wxs's ARPPRODUCTICON reads $(var.IconDir)AppIcon.ico.
          cp apps/fauna-windows/FaunaApp/FaunaApp/Assets/AppIcon.ico stage/${{ matrix.arch }}/icons/
          cp -r apps/fauna-windows/FaunaApp/FaunaApp/bin/Release/*/publish/* stage/${{ matrix.arch }}/app/ || \
          cp -r apps/fauna-windows/FaunaApp/FaunaApp/bin/Release/*/*/publish/* stage/${{ matrix.arch }}/app/

      # The three licence files Notices.wxs installs beside the binaries
      # (shipped-notices.md § Per channel, the Windows MSI row), by the recipe the
      # test fixture runs too. After the publish, whose restore wrote the
      # project.assets.json the NuGet leg reads and whose deps.json names the
      # runtime packs it copied and the runtime of the .NET app host its .exe is
      # (downloaded by the restore, or the SDK's own copy, which the leg finds in
      # the packs folder beside the `dotnet` on PATH — the one the publish ran);
      # the bridge is the mail-bridge part's, whose directory holds
      # libunwind.dll and the toolchain's licence files (its own and the
      # mingw-w64 runtime's) the bundled leg copies. A generator that refuses
      # fails the job.
      - name: Stage the licence and notices files
        shell: bash
        run: just windows-msi-notices stage/${{ matrix.arch }}/notices ${{ matrix.arch }} parts/mail-bridge/fauna-mail-bridge.exe

      # Every -d path MUST be absolute. WiX resolves App.wxs's
      # <Files Include="$(var.AppDir)**"> harvest relative to the .wxs file's
      # directory (apps/fauna-windows/installer/), NOT the working dir — a
      # relative AppDir silently harvests ZERO app files and ships an app-less MSI
      # that still "builds successfully". ${{ github.workspace }} is the checkout
      # root (= the cwd staging wrote into), so it anchors all vars absolutely.
      # NoSparsePackage: the shell extension's sparse package needs a signer to
      # register on a user's machine, and this MSI has none yet, so it is left out
      # (ShellExt.wxs) rather than shipped inert.
      - name: Build MSI
        run: >
          wix build -arch ${{ matrix.arch }}
          -ext WixToolset.Util.wixext
          -ext WixToolset.UI.wixext
          -ext WixToolset.Firewall.wixext
          -o Fauna-Setup-${{ matrix.arch }}.msi
          apps/fauna-windows/installer/*.wxs
          -loc apps/fauna-windows/installer/Strings.wxl
          -d SyncBin=${{ github.workspace }}/stage/${{ matrix.arch }}/fauna-sync-agent.exe
          -d TuiBin=${{ github.workspace }}/stage/${{ matrix.arch }}/fauna-tui.exe
          -d CliBin=${{ github.workspace }}/stage/${{ matrix.arch }}/fauna-cli.exe
          -d NestBin=${{ github.workspace }}/stage/${{ matrix.arch }}/fauna-nest-svc.exe
          -d BridgeBin=${{ github.workspace }}/stage/${{ matrix.arch }}/fauna-bridge-svc.exe
          -d MailBridgeBin=${{ github.workspace }}/stage/${{ matrix.arch }}/fauna-mail-bridge.exe
          -d MailBridgeFfiDll=${{ github.workspace }}/stage/${{ matrix.arch }}/fauna_ffi.dll
          -d MailBridgeLibunwindDll=${{ github.workspace }}/stage/${{ matrix.arch }}/libunwind.dll
          -d ShellDll=${{ github.workspace }}/stage/${{ matrix.arch }}/fauna_shell.dll
          -d IconDir=${{ github.workspace }}/stage/${{ matrix.arch }}/icons/
          -d AppDir=${{ github.workspace }}/stage/${{ matrix.arch }}/app/
          -d NoticesDir=${{ github.workspace }}/stage/${{ matrix.arch }}/notices/
          -d NoSparsePackage=1

      # The terminal app's Windows archive: fauna-tui.exe + fauna-sync-agent.exe
      # + fauna-cli.exe in one zip per arch (no install script on Windows — the
      # user unpacks it into a directory on PATH; installers/tui.md). Staged by
      # the same assemble-archive.sh the Linux legs use, so the payload is
      # defined once.
      - name: Assemble the fauna-tui archive
        shell: bash
        run: |
          bash apps/fauna-tui/packaging/assemble-archive.sh \
            --bin-dir "stage/${{ matrix.arch }}" \
            --out tui-archive --suffix "${{ matrix.arch }}-windows" --exe \
            --notices parts/terminal/THIRD-PARTY-NOTICES.txt

      - name: Zip the fauna-tui archive
        shell: pwsh
        run: Compress-Archive -Path "tui-archive/fauna-tui-${{ matrix.arch }}-windows/*" -DestinationPath "fauna-tui-${{ matrix.arch }}-windows.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            Fauna-Setup-${{ matrix.arch }}.msi
            fauna-tui-${{ matrix.arch }}-windows.zip

      # Real msiexec install/uninstall smoke of the x64 MSI. The asserts live in
      # apps/fauna-windows/installer/ci-smoke.ps1, which the arm64 leg's smoke
      # (the smoke-windows-arm64 job below) runs too: install with every
      # feature, one Add/Remove Programs entry, every installed native binary
      # built for the arch, the FaunaNest + FaunaBridge services Running, the
      # shell-extension CLSIDs activating, a plain uninstall preserving
      # %ProgramData%\Fauna\ and REMOVE_USER_DATA=1 deleting it. Runs ONLY on
      # the x64 leg: windows-latest is an x64 runner and cannot install an
      # ARM64-targeted MSI ("not supported by this processor type"). Safe in
      # CI: this is an ephemeral runner, so the perMachine service install
      # disrupts nothing.
      - name: Smoke-test install/uninstall (x64)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: ./apps/fauna-windows/installer/ci-smoke.ps1 -Msi Fauna-Setup-x64.msi -Arch x64

      # Logs on failure ONLY: the `release` job downloads every `windows-*`
      # artifact of the run and signs and publishes each file, so a log
      # uploaded on success would ship as a release asset. A failed smoke fails the run, and then
      # nothing is released.
      - name: Upload installer smoke logs
        if: ${{ failure() && matrix.arch == 'x64' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-installer-smoke-logs-x64
          path: '*.log'
          if-no-files-found: ignore

  # The same install/uninstall smoke for the ARM64 MSI, on GitHub's hosted
  # Windows ARM64 runner: what only a real arm64 install proves is that the
  # arm64 binaries load, the FaunaNest and FaunaBridge services start and the
  # arm64 shell DLL registers and activates (docs/goal/architecture/installers/
  # windows.md § Testing). It runs here, on a disposable runner, and never on a
  # dev machine: a CI-built MSI installing machine services on a machine that
  # builds releases is exactly the prebuilt-binary install that is ruled out.
  # No credentials; it gates the `release` job like the x64 smoke does.
  smoke-windows-arm64:
    needs: build-windows
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: apps/fauna-windows/installer

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: windows-arm64

      - name: Smoke-test install/uninstall (arm64)
        shell: pwsh
        run: ./apps/fauna-windows/installer/ci-smoke.ps1 -Msi Fauna-Setup-arm64.msi -Arch arm64

      - name: Upload installer smoke logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-installer-smoke-logs-arm64
          path: '*.log'
          if-no-files-found: ignore

  # NOTE: there is no standalone Go release artifact. The Go mail-bridge
  # (bins/fauna-bridges) is cgo — it links libfauna_ffi.so — so it cannot be
  # CGO_ENABLED=0 cross-compiled. Per docs/goal/architecture/installers/
  # {docker,linux-nest}.md the bridge ships built-from-source: the docker image
  # (recommended deploy) builds it in a cgo build stage, and the bare-metal
  # path builds it via `just mail-bridge-build`. Neither consumes a prebuilt
  # release binary.

  # The Microsoft Store's two packages, built and graded from the recorded
  # public commit by release-store-windows.yml (its own header says how), as
  # jobs of THIS run that hold no credential. On a tag the recorded commit is
  # the tag's; on a stores-only dispatch it is the one the dispatch names. Its
  # artifacts (`store-windows-<arch>`, `certification-<arch>`) match no pattern
  # the `release` job publishes; the job's store steps take them by their own.
  store-windows:
    needs: supply-chain
    uses: ./.github/workflows/release-store-windows.yml
    with:
      commit: ${{ inputs.stores_commit || github.sha }}
      flavour: store-no-payments

  # A run that does not publish (a branch dispatch) checks the Microsoft Store
  # step's inputs and stops: the packages, their certification grade, the
  # version's store text and how far the leg goes, with no credential and no
  # store call (store-review.md § The store legs, the dry-run sentence).
  store-dry-run:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.store-windows.result == 'success' }}
    needs: store-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: store-windows-*
          path: store-windows
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: certification-*
          path: store-certification
          merge-multiple: true
      - name: Install uv
        run: bash scripts/install-uv.sh
      - name: Microsoft Store leg (dry run)
        run: >
          uv run --no-project python scripts/msstore-submit.py --dry-run
          --version tree --packages store-windows --certification store-certification
          --record store-legs.json

  # The Play upload: the `storeNoPayments` Android App Bundle, built UNSIGNED by
  # the recipe the machines build it with (`just android-bundle-store-no-payments`,
  # its automation-surface strip check and excision scan in the same body), in a
  # job that holds no secret and names no Environment. Its artifact is named
  # `store-android-bundle`, outside the `rust-*`/`windows-*` patterns the
  # `release` job publishes, so the bundle is never a download; the approved job
  # signs and uploads it as its last steps (installers/store-review.md § The
  # store legs; installers/android.md § Signing model).
  #
  # The scripts and the store texts come from this run's own tree; the bundle is
  # built from the version's recorded public commit on a stores-only run
  # (`stores_commit`), from this tree otherwise.
  android-store-bundle:
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        if: inputs.stores_commit != ''
        with:
          ref: ${{ inputs.stores_commit }}
          path: store-build
          persist-credentials: false
      - name: Resolve the tree and the version
        env:
          STORES_COMMIT: ${{ inputs.stores_commit }}
        run: |
          set -euo pipefail
          if [ -n "$STORES_COMMIT" ]; then
            [[ "$STORES_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "stores_commit is not a full 40-hex SHA" >&2; exit 1; }
            [ "$(git -C store-build rev-parse HEAD)" = "$STORES_COMMIT" ] || { echo "the checkout is not $STORES_COMMIT" >&2; exit 1; }
            TREE="$PWD/store-build"
          else
            TREE="$PWD"
          fi
          VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' "$TREE/Cargo.toml")"
          if [ -z "$STORES_COMMIT" ] && [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "the tree's version $VERSION is not the tag $GITHUB_REF_NAME" >&2; exit 1
          fi
          echo "TREE=$TREE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0, toolchain from rust-toolchain.toml
        with:
          rustflags: ""
          cache: false
      - name: Install uv
        run: bash scripts/install-uv.sh
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      # The runner's own JDK 21 and Android NDK (no setup action); the NDK's
      # clang wrappers on PATH are what the FFI recipe checks for.
      - name: The runner's JDK 21 and NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build the storeNoPayments bundle (unsigned)
        working-directory: ${{ env.TREE }}
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          just android-bundle-store-no-payments
      # The inputs the store step needs, checked with no credential in scope: the
      # bundle is unsigned and of this version, and Play's text is approved for it.
      # A dry run (a branch dispatch) stops here: the `release` job never runs.
      - name: Check the Play leg's inputs
        run: |
          AAB="$TREE/apps/fauna-android/app/build/outputs/bundle/storeNoPayments/app-storeNoPayments.aab"
          uv run --no-project python scripts/store-leg-play.py check --version "$VERSION" --aab "$AAB" --tree "$TREE"
          mkdir -p store-android-bundle
          cp "$AAB" store-android-bundle/app-storeNoPayments.aab
          echo "$VERSION" > store-android-bundle/VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: store-android-bundle
          path: store-android-bundle/
          if-no-files-found: error

  # Sign all binaries and create the GitHub Release. Publishes only on a `v*`
  # tag ref (a branch dispatch skips this job — the dry run), and only after a
  # maintainer approves the run into the `release` Environment.
  release:
    # A stores-only run (`stores_commit`) skips the download builds, so the
    # guard reads each need's result instead of the default "every need passed".
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled()
      && needs.android-store-bundle.result == 'success'
      && needs.store-windows.result == 'success'
      && (inputs.stores_commit != ''
          || (needs.build-rust.result == 'success'
              && needs.build-windows.result == 'success'
              && needs.smoke-windows-arm64.result == 'success'))
    needs: [build-rust, build-windows, smoke-windows-arm64, android-store-bundle, store-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write        # upload the release assets
      id-token: write        # the Sigstore keyless identity behind the signatures
    steps:
      # The tree, for the downloads table's check below. First: a checkout
      # cleans its directory, so it must not run after the downloads.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      # The published artifacts only, by name: `rust-<target>` and
      # `windows-<arch>`. The Windows jobs' `part-windows-*` intermediates are
      # never published -- every file this job downloads is signed and shipped.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: inputs.stores_commit == ''
        with:
          pattern: rust-*
          path: all-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: inputs.stores_commit == ''
        with:
          pattern: windows-*
          path: all-artifacts
          merge-multiple: true

      - name: Install uv
        run: bash scripts/install-uv.sh

      # fauna.social/apps links each file in installer/downloads.json at this
      # release. Refuse to publish a release the table disagrees with, either
      # way: a linked file missing here, or a file here the table never named.
      - name: The downloads table matches the release
        if: inputs.stores_commit == ''
        run: uv run --no-project python installer/check-downloads.py installer/downloads.json release.yml all-artifacts

      - name: Install cosign
        if: inputs.stores_commit == ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Generate SHA256SUMS
        if: inputs.stores_commit == ''
        working-directory: all-artifacts
        run: sha256sum * > SHA256SUMS

      - name: Sign all artifacts with cosign
        if: inputs.stores_commit == ''
        working-directory: all-artifacts
        run: |
          for file in *; do
            case "$file" in *.bundle) continue ;; esac
            cosign sign-blob --yes --bundle "${file}.bundle" "$file"
          done

      - name: Create GitHub Release
        if: inputs.stores_commit == ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: all-artifacts/*
          # A tag is pushed at UAT entry, so the Release starts as a pre-release:
          # the direct-download channel's pre-release track. `fauna-publish
          # release` flips it after the promote to :latest.
          prerelease: true
          # release-macos.yml publishes into this same Release, in whichever
          # order the two runs finish: append, never replace, its notes. This
          # step alone generates the change list, so it is listed once.
          append_body: true
          generate_release_notes: true
          # public-text: release-body-main
          body: |
            Fauna is free and open-source software for your feed, messages,
            mail, photos, files and calendar, served from a small server you
            control. This release carries the server binaries (`fauna-nest` and its companions), the Linux desktop app, the terminal app for Linux and Windows (its archives also carry `fauna-cli`, the program an AI assistant runs to work in Fauna), and the Windows installer (`Fauna-Setup-x64.msi`, `Fauna-Setup-arm64.msi`), each built by this workflow from the tagged source.

            Code signing policy: https://fauna.social/code-signing-policy/

            ## Verify Downloads

            Every file this repository's `Release` workflow released, other
            than the `.bundle` signatures themselves, was signed by that
            workflow with its Sigstore identity, in the `.bundle` file beside
            it (the regex below is anchored to this repository, so a signature
            from anywhere else fails). The Mac download (the `.dmg`) and the
            terminal app's Mac archives, with their `.sha256` files, come from
            the `Release (macOS)` workflow instead; its own section of these
            notes says how to check the `.dmg` and the archives. Install
            [cosign](https://docs.sigstore.dev/cosign/system_config/installation/), then:

            ```bash
            # Verify a specific binary
            cosign verify-blob \
              --certificate-identity-regexp="^https://github\.com/faunasocial/fauna/" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              --bundle <binary>.bundle \
              <binary>

            # Or verify all at once via checksums
            cosign verify-blob \
              --certificate-identity-regexp="^https://github\.com/faunasocial/fauna/" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              --bundle SHA256SUMS.bundle \
              SHA256SUMS
            sha256sum --check SHA256SUMS   # macOS: shasum -a 256 --check SHA256SUMS
            ```
          # public-text-end: release-body-main

      # ---- the Google Play leg: last, converging (installers/store-review.md
      # § The store legs). Its credentials rest in this Environment only. ----
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: store-android-bundle
          path: store-android-bundle
      - name: "Play: sign the bundle with the upload key"
        env:
          FAUNA_PLAY_UPLOAD_KEYSTORE: ${{ secrets.FAUNA_PLAY_UPLOAD_KEYSTORE }}
          FAUNA_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.FAUNA_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: >-
          uv run --no-project python scripts/store-leg-play.py sign
          --aab store-android-bundle/app-storeNoPayments.aab
          --out store-android-bundle/app-storeNoPayments-signed.aab
      # A refusal of permission (Google may take up to 48 hours to apply the
      # service account's release permissions) is waited out inside this step,
      # 20 minutes at most, inside this job's 60; past that the step is red and
      # a stores-only dispatch at the tag finishes it.
      - name: "Play: release on internal testing"
        id: play-upload
        env:
          FAUNA_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.FAUNA_PLAY_SERVICE_ACCOUNT_JSON }}
        run: >-
          uv run --no-project python scripts/store-leg-play.py upload
          --version "$(cat store-android-bundle/VERSION)"
          --aab store-android-bundle/app-storeNoPayments-signed.aab
          --result store-legs.json
      # ---- the Microsoft Store leg: the two packages this run's `store-windows`
      # built and graded, submitted to Partner Center's private audience (public
      # only when installer/store-legs.toml says so), the version's *What's new*
      # from installer/store-texts/ at this tag; converging. The credential is
      # an Entra application in the Manager role, resting only in this
      # Environment. A red Play upload does not hold it back: the two stores are
      # independent, the job stays red, and one stores-only run finishes both,
      # each converging. ----
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: success() || steps.play-upload.outcome == 'failure'
        with:
          pattern: store-windows-*
          path: store-windows
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: success() || steps.play-upload.outcome == 'failure'
        with:
          pattern: certification-*
          path: store-certification
          merge-multiple: true
      - name: Microsoft Store leg
        if: success() || steps.play-upload.outcome == 'failure'
        env:
          FAUNA_MSSTORE_TENANT_ID: ${{ secrets.FAUNA_MSSTORE_TENANT_ID }}
          FAUNA_MSSTORE_CLIENT_ID: ${{ secrets.FAUNA_MSSTORE_CLIENT_ID }}
          FAUNA_MSSTORE_CLIENT_SECRET: ${{ secrets.FAUNA_MSSTORE_CLIENT_SECRET }}
        run: >
          uv run --no-project python scripts/msstore-submit.py
          --version "${GITHUB_REF_NAME#v}" --packages store-windows
          --certification store-certification --record store-legs.json
      # The leg's result, read by the release attempt's `stores` step: store,
      # version, build, track, state, the stamp of the store's reading and its
      # identifiers — no secret, no address, no tester.
      - name: Keep the store legs' record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: store-legs
          path: store-legs.json
          if-no-files-found: ignore
