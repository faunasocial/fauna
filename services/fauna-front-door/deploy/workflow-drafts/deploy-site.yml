# DRAFT — Track H swaps this into .github/workflows/deploy-site.yml at the
# VPS cutover (replacing the Azure SWA upload; build steps unchanged).
# Push-triggered + path-filtered per the 2026-08-10 user ratification:
# main is leak-checked pre-merge by the cheap gates, and the site build has
# its own async merge-gate, so a push that reaches main is already vetted.
name: Deploy fauna.social site

on:
  push:
    branches: [main]
    paths:
      - "sites/fauna-social/**"
      - "docs/sites/fauna-social/**"
      # + the governance-documents source tree (the third declared source of
      #   `just site` — build-system.md § Public website build names it). Its
      #   literal path is private-repo-only per the publish leak-check's
      #   dangling-path rule, so Track H spells it out at activation — and the
      #   open-source cut must decide how that tree ships for public builds.
  workflow_dispatch: {}

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Build exactly as the current deploy-site.yml does (just site →
      # sites/fauna-social/dist/). Carry those steps over verbatim.
      - name: Build site
        run: |
          cd sites/fauna-social
          deno install
          deno task build
      - name: Upload release
        env:
          DEPLOY_KEY: ${{ secrets.DOOR_DEPLOY_KEY }}
        run: |
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::12}"
          install -m 600 /dev/null key && printf '%s\n' "$DEPLOY_KEY" > key
          # `-az --delete` and the absolute release path are the ONE shape the
          # box's forced command accepts (door-deploy-receive.sh) — change both together.
          rsync -az --delete -e "ssh -i key -o StrictHostKeyChecking=accept-new" \
            sites/fauna-social/dist/ \
            deploy@fauna.social:/srv/fauna/site/releases/"$STAMP"/
          ssh -i key deploy@fauna.social flip site "$STAMP"
