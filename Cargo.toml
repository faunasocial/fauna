fauna-credential-store = { path = "libs/fauna-credential-store" }
fauna-sidecar-client = { path = "libs/fauna-sidecar-client" }
fauna-protocol = { path = "libs/fauna-protocol" }
fauna-cbor = { path = "libs/fauna-cbor" }
fauna-carv2 = { path = "libs/fauna-carv2" }
fauna-proxy-protocol = { path = "libs/fauna-proxy-protocol" }
fauna-conn-limit = { path = "libs/fauna-conn-limit" }
fauna-deployment-flags = { path = "libs/fauna-deployment-flags" }
fauna-tls-bootstrap = { path = "libs/fauna-tls-bootstrap" }
fauna-mda-supervisor = { path = "libs/fauna-mda-supervisor" }
fauna-nest-supervisor = { path = "libs/fauna-nest-supervisor" }
fauna-peer = { path = "libs/fauna-peer" }
fauna-update = { path = "libs/fauna-update" }
fauna-calendar = { path = "libs/fauna-calendar" }
fauna-contacts = { path = "libs/fauna-contacts" }
fauna-cfapi = { path = "libs/fauna-cfapi" }
fauna-index = { path = "libs/fauna-index" }
fauna-client-index = { path = "libs/fauna-client-index" }
fauna-conversations = { path = "libs/fauna-conversations" }
fauna-feed = { path = "libs/fauna-feed" }
fauna-mail = { path = "libs/fauna-mail" }
fauna-payments = { path = "libs/fauna-payments" }
