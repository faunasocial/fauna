[workspace.package]
# The product version — the fleet-wide source of truth every other surface
# copies (docs/goal/architecture/product-version.md; version-lockstep gate).
version = "0.1.3"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/faunasocial/fauna"

[workspace.dependencies]
# Fauna crates
fauna-core = { path = "libs/fauna-core" }
fauna-uniffi-async = { path = "libs/fauna-uniffi-async" }
fauna-labeler = { path = "libs/fauna-labeler" }
fauna-plugin-host = { path = "libs/fauna-plugin-host" }
fauna-mls = { path = "libs/fauna-mls" }
fauna-capability-holder = { path = "libs/fauna-capability-holder" }
fauna-bridge-atproto = { path = "libs/fauna-bridge-atproto" }
fauna-bridge-nostr = { path = "libs/fauna-bridge-nostr" }
fauna-bridge-activitypub = { path = "libs/fauna-bridge-activitypub" }
fauna-transport = { path = "libs/fauna-transport" }
fauna-ui-ids = { path = "libs/fauna-ui-ids" }
fauna-iroh = { path = "libs/fauna-iroh" }
fauna-peer-channel = { path = "libs/fauna-peer-channel" }
fauna-peer-share = { path = "libs/fauna-peer-share" }
fauna-peer-sync = { path = "libs/fauna-peer-sync" }
fauna-client = { path = "libs/fauna-client" }
fauna-ws-substrate = { path = "libs/fauna-ws-substrate" }
fauna-e2e-agent = { path = "libs/fauna-e2e-agent" }
fauna-e2e-contract = { path = "libs/fauna-e2e-contract" }
