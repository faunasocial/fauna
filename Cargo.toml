fauna-media = { path = "libs/fauna-media", default-features = false }
fauna-segment-store = { path = "libs/fauna-segment-store", default-features = false }
fauna-sleep = { path = "libs/fauna-sleep" }
fauna-sync-engine = { path = "libs/fauna-sync-engine" }
fauna-account-store = { path = "libs/fauna-account-store" }
fauna-account-plane = { path = "libs/fauna-account-plane" }
fauna-account-seams = { path = "libs/fauna-account-seams" }
fauna-account-port = { path = "libs/fauna-account-port" }
fauna-ipc = { path = "libs/fauna-ipc" }
