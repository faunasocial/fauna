# The post tip surface (monetization.md § Tips; post-tip-total / post-tip-count
# / post-tip-list-button / post-tip-list / post-tip-item, IDs user-approved
# 2026-08-11). Rendered from fauna_core::format::tip_amount / ::tip_count, so
# every app shows the same unit and the same singular.
#
# DELIBERATELY MECHANISM-BLIND — no "zap", no "Lightning": a tip arriving over a
# future mechanism reuses these strings unchanged, which is the same property
# the wire and the shared view have (monetization.md § One model, many
# mechanisms, two targets). The per-tip `mechanism` token is attribution, and
# nothing branches on it.
tips:
  # Sats are the display unit, msats the wire unit; a sub-sat tip keeps msats
  # rather than rounding real money down to "0 sats".
  sats: '{value} sats'
  msats: '{value} msats'
  # Counts EVERY tip, including any whose receipt carried no parseable amount —
  # so this can read "3 tips" on a post that shows no total at all.
  count: '{count} tips'
  count_one: 1 tip
  # post-tip-list — the newest-first attribution window.
  list_title: Tips
  # post-tip-list-button's label/tooltip; opens that window.
  list_open: Who tipped
  # A tipper the mechanism named but this box could not resolve to a local
  # actor. Their mechanism-native id (a Nostr pubkey today) renders beside it
  # when there is one; an outside tip still counts and still displays.
  sender_unknown: Someone
  # A tip whose receipt carried no parseable amount — a real state, never shown
  # as "0 sats" (monetization.md § Tips).
  amount_unknown: Amount not reported
  # post-tip-list's "and N others" line, when the window is bounded (has_more).
  more: and {count} more
onboarding:
  welcome:
    title: Fauna
    subtitle: Your personal, private communications nest.
    tagline: |-
      Private messaging and file sync,
      built on your own server.
  # Launch-screen surface shown when the silent-challenge fast path
  # can't reach the saved nest. Per docs/goal/behavior/onboarding.md
  # §"App-launch routing" the user can wait + Retry, or fall back to
  # the wizard at handle_entry. Cross-app element ids:
  # `launch-transient-error`, `launch-retry-button`,
  # `launch-fallthrough-button`.
  launch:
    transient_error: Couldn't reach your nest. Check your connection and try again.
    use_different_nest: Use a different nest
    # Defensive launch surface (nest/common.md § Client-state recoverability):
    # shown when the app-launch sequence itself dies or never settles — an
    # unhandled failure between boot and the first rendered surface. The
    # technical detail is appended by the app; the promise "your data is
    # safe" is literal (the failure is render-side, the store is untouched).
    launch_failed: "Startup hit a problem. Your data is safe — you can retry, or continue setup below."
    # (security.md § Transport trust): shown when the nest's
    # pinned deployment identity changed, or it can no longer prove the identity
    # the client previously trusted (the SSH known_hosts model). The warning is
    # the UNIFORM all-app model (ratified 2026-07-13), carried by the shared
    # `LaunchMachine`, and is always rendered WITHOUT a retry CTA — a retry cannot
    # change the verdict and must never silently re-pin. `_trust` backs the
    # re-trust button (`trust_nest_identity()`). The ui.yaml
    # `launch_identity_changed` page was widened beyond `platforms: [web]` on
    # 2026-07-13; both strings render on web, linux, tui, android and apple
    # (macOS + iOS, 2026-07-13). **windows is the sole remaining gap** — it routes
    # its launch on the machine already (`App.xaml.cs`), so it has the phase; it
    # just has no arm for it yet.
    identity_changed_warning: This nest's identity has changed, or it can no longer prove the identity you previously trusted. It may have been re-deployed or had its key rotated — or someone may be impersonating it. Don't continue unless you were expecting this change.
    identity_changed_trust: Trust this nest and continue
    # identity-succession.md § Propagation → "Own device fleet": every OTHER
    # device of a succeeded fleet learns by being refused on its next connect,
    # and the affordance is the existing identity-import flow — so this text
    # lands on the import screen's own `error-message` rather than minting a
    # launch surface of its own. Two strings, because the successor the refusal
    # names is CLAIMED until it has been verified against the registration
    # chain: `_superseded` is what we can say immediately and asserts nothing
    # about which identity took over; `_superseded_verified` names it only once
    # `resolve_successor` has proven the hop. Never present the claim as fact —
    # the nest is enforcer and distributor, never authorizer.
    identity_superseded: This identity was succeeded — import the new identity to continue. Your account now belongs to a new identity, and this one can no longer sign in.
    identity_superseded_verified: This identity was succeeded — import the new identity to continue. Your account now belongs to {successor}.
    # box-recovery.md § Recovery UI (step 4): the surviving-device recovery
    # entry on the launch retry surface. Shown only when the admin custodies
    # ≥1 deployment seed.
    recover_lost_box: Recover a lost box
    # nest-retirement.md § Layout & flow: always shown on the launch retry
    # surface — it needs only a cloud token, no custodied seed.
    retire_server: Retire a server
    # version-compatibility.md 5 item 9: the account index at `fauna/index` is
    # present and this build cannot use it. TWO strings because the two verdicts
    # have OPPOSITE remedies, and an app that collapses them tells half its
    # users to do something that cannot work. Both are rendered WITHOUT a retry
    # CTA (no amount of retrying reparses a blob) and, critically, instead of
    # fresh onboarding: the accounts are not gone, they are unread. Neither
    # message ever offers to rebuild the index -- a blob nothing here can parse
    # is not thereby known to name no accounts.
    index_newer_build: Your accounts were saved by a newer version of this app, so this version can't read them. Nothing has been lost — update the app and they'll be here.
    # The only case that may offer the documented floor, and only behind a
    # confirm that states the residual (long-term-store.md Cleanup contract):
    # starting over clears the two routing pointers but cannot reach per-actor
    # slots, because the store seam cannot scan a namespace.
    index_malformed: Your saved accounts can't be read, and updating the app won't help. Nothing has been changed or deleted. You can start over on this device, or move this device's data somewhere safe first.
    index_malformed_reset_residual: Starting over removes every account from this device and returns the app to a fresh install. Your accounts still exist on your nest, but you will need your secret key or recovery kit to sign back in — this device's copy is removed. Some saved data on this device cannot be reached to clear it.
    index_newer_build_title: Update needed
    index_malformed_title: Your saved accounts can't be read
    index_malformed_reset: Start over on this device
    index_malformed_reset_confirm: Remove everything and start over
    # account-scoping.md § Concurrent instances → "An erase refuses while a
    # sibling serves the account": the start-over runs the same all-accounts
    # erase a sign-out does, so it refuses under a live sibling window too.
    # Shown on the page's error-message; nothing was erased. Minted beside
    # the sign-out and remove-account refusals in
    # `fauna_client_accounts::erase_residue`.
    index_malformed_reset_blocked_other_window: 'Nothing was removed — another Fauna window is using an account on this device. Close it, then start over again.'
    # onboarding.md § App-launch routing → the previously-signed-in row
    # (designed 2026-09-24): the stored identity + nest_url say this app signed
    # in here before, and `fauna.auth.verify` now answers the opaque
    # `fauna.auth.not_registered`. The app cannot tell suspended from removed —
    # there is no oracle on the wire, by design (login.md § Errors) — so the
    # copy names both and asserts neither, and the remedy is the admin: restore
    # is a button on their app, after which Retry is the way back in. Never the
    # invite wizard (a suspended actor's submit is refused as already
    # registered) and never "couldn't reach your nest" (the nest answered).
    # Rendered from `LaunchSnapshot.sign_in_refused`; `_title` is the pane title.
    sign_in_refused: This nest no longer signs you in. Its admin may have suspended or removed your account — nothing on this device has changed. Contact the admin; if they restore your account, try again.
    sign_in_refused_title: Can't sign in here
    # `last_error` while the machine is parked on `fauna.auth.account_locked`
    # (devices.md § The locked state). Carries no time: the unlock time rides
    # `LaunchSnapshot.locked_until_secs` and the app formats it for its locale.
    account_locked: This account is locked and nobody can sign in until the lock ends.
    # The locked launch surface's standing notice (`launch-account-locked-notice`,
    # ui/sessions.md § Layout & flow → The locked surface): `account_locked`
    # above, then these two sentences. `{time}` is the unlock time through the
    # shared `format_unix_local`. The second is devices.md § The two panic
    # buttons, point 5 — a lock the owner did not set is itself the sign to use
    # the kit — and it is REQUIRED copy: without it the surface reads as "wait",
    # which is the wrong advice to somebody whose key was stolen.
    account_locked_until: 'The lock ends {time}.'
    account_locked_not_yours: If you did not lock it, somebody else holds your secret key, and they can lock it again. Your recovery kit moves the account to a new key they do not have — the lock does not stop that.
    account_locked_title: Account locked
  # The launch-collision chooser (account-scoping.md § Concurrent instances;
  # ui.yaml page `launch_instance_chooser`, platforms [windows, linux, tui]).
  # Shown when a plain interactive launch finds the account it would open is
  # already served by a live instance. Three ways forward: pick another
  # account this process can become, raise the running window, or hand an
  # add-account intent to the running instance (the wizard belongs to the
  # primary — a colliding process never runs it).
  instance_chooser:
    title: Fauna is already open
    # `{account}` is the already-served account's handle, or a short actor-id
    # prefix before the first cache refresh (shared `account_display_label`).
    subtitle: 'This window can''t open {account} — it''s already running. Choose another account, or switch to the open window.'
    choose_account: Open a different account
    # Shown instead of the account list when every registered account is
    # already served by some live instance.
    none_available: Every account you've added is already open in another window.
    focus_existing: Switch to the open window
    add_account: Log in as a new user
    # The pick lost the race: the account was free when the list rendered and
    # was taken before the click landed (arbitration stays at acquire).
    account_taken: That account was just opened in another window. Pick another.
    # The account is STILL served (re-checked against the instance lock after
    # the raise failed), but its window can't be reached: the app serving
    # it claims no activation endpoint, or the session bus is unavailable. The
    # other case — it exited between the collision and the click — is no
    # longer an error at all; that launch simply proceeds.
    no_running_instance: Couldn't switch to the window running this account. Close it and launch Fauna again.
  identity_choice:
    title: Set Up Your Identity
    subtitle: Your identity is an encryption key that belongs only to you.
    create_new: Create New Identity
    import_existing: Import from Another Device
    # box-recovery.md § Recovery UI (step 4): the fresh-app recovery entry.
    # Routes through identity_import (recovery intent) so the custody map opens,
    # then lands on nest_recovery.
    recover_lost_box: Recover a lost box
    # The OTHER recovery entry, sitting right beside the one above and meaning
    # something different: this restores a lost IDENTITY from its recovery
    # phrase, that one restores a lost NEST. onboarding.md § 1 Identity requires
    # the labels to differentiate sharply — hence "box" vs "account".
    restore_from_recovery_kit: Restore my account from a recovery phrase
  # Append-mode ("Add account") escape hatch on identity_choice — windows only
  # (frame-hosted onboarding has no window to close, unlike linux/apple's native
  # window/sheet dismissal; user-approved 2026-07-20). ID: onboarding-cancel-button.
  add_account:
    cancel: Cancel
  identity_created:
    title: Identity Created
    desc: Your new identity has been generated. Save this secret key — it's your only way to recover your account.
    secret_key_label: 'Your secret key:'
    warning: Write this down or save it in a password manager. If you lose it, your account cannot be recovered.
    continue: Continue
    not_generated: Identity not generated yet
  recovery_kit:
    title: Your Recovery Kit
    desc: This recovery phrase outranks your secret key — it is the only way to get your account back if your secret key is ever stolen or lost. Keep it offline; it is shown exactly once and never stored on any device.
    escrow_deferred: Your kit activates when your account comes online at the end of setup — until then, keep the phrase safe.
    confirm: I've saved it — continue
    skip: Skip for now
    not_minted: Recovery kit not minted yet
  recovery_entry:
    title: Restore from Recovery Kit
    # Prompts for the page's two inputs. Required, not decorative: an unlabelled
    # input paints its raw element id as the prompt on tui (apps/tui.md
    # § Rendering → Control vocabulary). The account field reuses the shared
    # `common.handle` label — it is the same field concept as handle_entry's.
    phrase_label: Recovery phrase
    desc: Paste your recovery phrase (the fauna://recovery link or the 64-character code). Your identity will be restored from your nest's sealed escrow.
    # The second sentence is the locator of last resort (onboarding.md § 1
    # Identity → recovery_entry): the case recovery exists for is a domain that
    # is gone, and a user whose domain is gone has no other way to learn the
    # field takes their nest's address in its place.
    account_hint: If your phrase doesn't name your account, enter your handle (user@domain) so your nest can be found. If that domain is gone, put your nest's own address after the @ instead — like alice@192.0.2.10 or alice@nest.local.
    submit: Restore
    # The phrase was not a recovery kit at all — the local parse refused it
    # before anything was sent. Names the identity-secret confusion explicitly:
    # the two codecs are deliberate twins on different hosts, and pasting the
    # wrong one is the mistake worth naming.
    invalid_kit: That isn't a recovery phrase. Paste the fauna://recovery link or the 64-character recovery code — not your secret key.
    # Nothing named the account: a bare 64-character code identifies no account,
    # and a nest can only be found through a handle's domain.
    account_needed: Enter the handle of the account you're restoring (user@domain) — this phrase doesn't say which account it belongs to.
    # The handle was typed but isn't `user@domain`, so there is no domain to
    # find a nest at.
    account_malformed: 'Enter the full handle including the domain, like alice@fauna.social — or, if that domain is gone, your handle followed by your nest''s address, like alice@192.0.2.10.'
    # `fauna.actor.not_found` from the resolved nest.
    account_unknown: 'No account named {account} exists on that nest.'
    # `fauna.recovery.no_escrow` — the ratified honest signal, not a fault.
    no_escrow: This account has no sealed backup to restore from. Create a new recovery kit from a device that's still signed in.
    # `fauna.auth.superseded` — routes to the identity import. Deliberately does
    # NOT name the successor: it arrives unverified.
    superseded: This identity was replaced after it was compromised. Import the new identity to continue.
    # A retired kit still signs valid bytes that authorize nothing.
    refused: 'That recovery phrase was refused — it may have been replaced by a newer kit, or belong to another account. ({reason})'
    # The one bucket worth offering a retry on — and the exact moment the
    # locator of last resort is worth naming: a lapsed or seized domain fails
    # here, with the escrow blob, the actor and the nest all still intact.
    unreachable: 'Could not reach that account''s nest. Check the handle and your connection, then try again. If the domain itself is gone, enter your handle with your nest''s address instead, like alice@192.0.2.10. ({reason})'
    # The restore SUCCEEDED — the account is back and the wizard advanced — but
    # the sealed backup also carried material from a previous identity (an
    # identity replacement still finishing its re-encryption), and that part did
    # not open. Leads with the success so it can never read as a failed
    # recovery, then names exactly what is at risk. No remedy is offered from
    # this screen because there is none here: another device that still holds
    # the older identity is the only thing that can finish the re-encryption.
    restored_predecessors_lost: 'Your account was restored. But part of the sealed backup — material from a previous identity of yours — could not be opened, so content still encrypted under that older identity may be unreadable. If another of your devices still has that identity, sign in there to finish moving your content over. ({reason})'
  identity_import:
    title: Import Identity
    scan_subtitle: Scan the QR code shown on your other device.
    paste_subtitle: Paste the secret key from your other device.
    paste_label: Secret key
    paste_placeholder: 64-character hex secret key
    import: Import
    scan_tab: Scan QR Code
    paste_tab: Paste Secret Key
    invalid_qr: Not a valid Fauna identity QR code.
    invalid_secret: Secret key must be 64 hex characters.
    # iOS-only (VisionKit DataScannerViewController unsupported on this device/
    # simulator) — no macOS peer (macOS has no camera scan tab) and no
    # cross-app peer (android's QR tab is an unrelated "not implemented yet"
    # placeholder, not a runtime-support check).
    camera_unavailable: Camera Not Available
    camera_unavailable_hint: Use the paste tab instead.
  # box-recovery.md § Recovery UI (step 4) — the step-4 total-box-loss recovery
  # wizard branch. Two pages: nest_recovery (box-selection hub) and
  # recover_selfhosted_instructions (self-hosted seed install).
  recovery:
    title: Recover a lost box
    subtitle: Choose the box you lost. Fauna re-provisions a fresh box with its saved identity, so your pinned devices reconnect automatically once it's back online.
    box_list_label: Your boxes
    box_item_hint: Recovery key custodied
    empty_message: No recovery keys are available yet. Connect to one of your other nests first — its synced configuration holds the recovery keys for every box you administer.
    method_cloud: Re-provision on a cloud host
    method_selfhosted: Install on my own server
    selfhosted_title: Install on your own server
    selfhosted_desc: Run the installer below on a fresh box. It carries your saved deployment identity, so the rebuilt box re-presents the same nest identity and your pinned devices reconnect automatically once its DNS is re-pointed.
    selfhosted_command_pending: The installer command with your recovery seed will appear here.
    selfhosted_continue: Done
    restore_cta: Restore your data
  # nest-retirement.md — the nest_retire page. Every sentence that names what
  # dies, what the DNS plan is, or what is left to remove by hand is composed by
  # the shared NestRetireMachine (`retire_view`) from these keys, so all seven
  # apps say the same thing.
  retire:
    title: Retire a server
    subtitle: Delete a server Fauna created in your cloud account and clean up the DNS records that pointed at it, or get your domain's transfer code. Your cloud token is used for this visit only and is never saved.
    list_label: Servers Fauna created in this account
    empty_message: No servers created by Fauna were found in this account. Servers set up some other way carry no Fauna marker and are not listed — retire those from your provider's dashboard.
    domain_label: Domain
    secondary_domains_label: Also serves
    address_label: Address
    current_badge: The server you're signed into
    unmarked_note: Not marked as created by Fauna — check the name carefully before deleting it
    transfer_code_button: Get the domain transfer code
    transfer_code_fetching: Asking the registrar…
    transfer_code_label: Transfer code
    transfer_code_copy: Copy code
    transfer_code_available_after: "The registry locks this domain against transfer until {when}. Ask again after that — the code is never refused, only delayed."
    transfer_code_from_registrar: Get this domain's transfer code from your registrar's own dashboard.
    delete_button: Delete this server…
    confirm_what: "You are about to permanently delete {name} at {provider} ({address})."
    confirm_domain: "Domain: {domain}"
    confirm_secondary_domains: "Also serves: {domains}"
    confirm_destroyed: Everything on this server — its disk and every account's data on it — is destroyed and cannot be recovered except from a backup.
    confirm_current: This is the server you're signed into. This session's nest will stop existing.
