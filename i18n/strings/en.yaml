      The keys this nest signs outside apps' sign-in passes with, and the secret
      behind their saved sign-ins. Replacing them is a response to an exposure,
      never routine upkeep.
    oauth_keys_loading: Checking which sign-in keys this nest uses…
    oauth_keys_error: >-
      Couldn't read this nest's sign-in keys: {cause}. Reload this page to try
      again.
    oauth_key_signing: '{kid} — signing now'
    oauth_key_retiring: '{kid} — replaced; still accepted for {minutes} min'
    oauth_key_retired: '{kid} — replaced; no longer accepted'
    oauth_rotate_button: Replace sign-in key
    oauth_rotate_desc: >-
      A precaution: the current key stays accepted for {minutes} min after it is
      replaced, so nobody is signed out. Use this for a suspected exposure.
    oauth_force_rotate_button: Replace sign-in key at once…
    oauth_secret_force_rotate_button: End all saved sign-ins…
    oauth_force_rotate_confirm_one: >-
      Replace the sign-in key at once? The key in use stops being accepted
      immediately, so every outside app signed in with it must sign in again. Use
      this when the key is known to have leaked.
    oauth_force_rotate_confirm_many: >-
      Replace the sign-in key at once? All {count} keys accepted now stop being
      accepted immediately, so every outside app signed in with them must sign in
      again. Use this when a key is known to have leaked.
    oauth_force_rotate_confirm_button: Replace at once
    oauth_secret_force_rotate_confirm: >-
      End every saved sign-in? Every connected outside app must be approved
      again. After a known leak, do this as well as replacing the sign-in key —
      replacing the key alone leaves saved sign-ins able to get new passes.
    oauth_secret_force_rotate_confirm_button: End saved sign-ins
    oauth_cancel_button: Cancel
    oauth_working: Working…
    oauth_rotate_done: >-
      Replaced. {kid} signs from now on; the previous key stays accepted until it
      times out.
    oauth_force_rotate_done: >-
      Replaced at once. {kid} is now the only key accepted. Stopped working:
      {dropped}.
    oauth_force_rotate_done_none: Replaced at once. {kid} is now the only key accepted.
    # Three arms on the count of outside apps actually signed out, the same
    # shape `tips.count` / `count_one` uses: the plural picks in Rust, so no
    # sentence has to read "1 apps". The bare key is the 2-or-more arm, matching
    # its `oauth_force_rotate_done` / `_none` sibling above.
    oauth_secret_force_rotate_done: >-
      Ended. Every saved sign-in issued since {minted} stopped working, and
      {apps} outside apps were signed out; each must be approved again the next
      time it is used.
    oauth_secret_force_rotate_done_one: >-
      Ended. Every saved sign-in issued since {minted} stopped working, and one
      outside app was signed out; it must be approved again the next time it is
      used.
    oauth_secret_force_rotate_done_none: >-
      Ended. Every saved sign-in issued since {minted} stopped working. No
      outside apps were connected here.
    oauth_secret_force_rotate_first: Done. There were no saved sign-ins to end.
    oauth_rotate_failed: >-
      The nest didn't confirm the change: {cause}. Check the keys listed here
      before trying again.
