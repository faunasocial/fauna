# Relative-time + byte-size + duration display formatting. Keys are selected by
# fauna_core::format::{relative_time,byte_size,duration_secs,grace_countdown}; see
# docs/goal/behavior/value-formatting.md. Abbreviated style needs no plurals.
time:
  just_now: just now
  minutes_ago: '{count}m ago'
  hours_ago: '{count}h ago'
  days_ago: '{count}d ago'
  # Conversation-list contextual timestamp (fauna_core::format::conversation_timestamp):
  # today renders a local clock, yesterday/this-week use these, older renders a date.
  yesterday: Yesterday
  weekday_mon: Mon
  weekday_tue: Tue
  weekday_wed: Wed
  weekday_thu: Thu
  weekday_fri: Fri
  weekday_sat: Sat
  weekday_sun: Sun
  # Calendar/events month + weekday name labels (docs/goal/ui/events.md § Where
  # logic lives — "the localized month/weekday name strings", client-side, not
  # fauna_core). Referenced directly by app code, not via a fauna_core
  # LocalizedText key.
  weekday_full_mon: Monday
  weekday_full_tue: Tuesday
  weekday_full_wed: Wednesday
  weekday_full_thu: Thursday
  weekday_full_fri: Friday
  weekday_full_sat: Saturday
  weekday_full_sun: Sunday
  month_jan: Jan
  month_feb: Feb
  month_mar: Mar
  month_apr: Apr
  month_may: May
  month_jun: Jun
  month_jul: Jul
  month_aug: Aug
  month_sep: Sep
  month_oct: Oct
  month_nov: Nov
  month_dec: Dec
  month_full_jan: January
  month_full_feb: February
  month_full_mar: March
  month_full_apr: April
  month_full_may: May
  month_full_jun: June
  month_full_jul: July
  month_full_aug: August
  month_full_sep: September
  month_full_oct: October
  month_full_nov: November
  month_full_dec: December
  # Coarse duration / uptime (largest non-zero unit down to minutes).
  uptime_dhm: '{days}d {hours}h {mins}m'
  uptime_hm: '{hours}h {mins}m'
  uptime_m: '{mins}m'
  # Countdown to a future deadline (fauna_core::format::grace_countdown) — coarse
