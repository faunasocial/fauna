  unverified_source: Unverified
  unverified_source_tooltip: This device could not verify the author's signature on this post.
  # "Delegated origin" badge (delegated-origin-badge), shown iff this app
  # verified the post's signed envelope AND it was signed by a delegated
  # authoring sub-key rather than the account's own identity key — i.e. an
