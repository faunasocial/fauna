  event_load_for_invite_failed: Could not load the event to invite
  http_error: 'HTTP error: {detail}'
  auth_error: 'Authentication error: {detail}'
  api_error: 'API error ({status}): {message}'
  decode_error: 'Decode error: {detail}'
  websocket_error: 'WebSocket error: {detail}'
  could_not_resolve_domain: 'Could not resolve domain: {domain}'
  # fauna_client::NestClientError::SubprotocolMismatch — the nest closed the WS
  # with code 4426, meaning this client's crate version predates what the nest
  # requires. Actionable: update the app (mirrors launch.needs_update_title,
  # the dedicated launch-time surface this Display text backs up as a fallback
  # for any RPC that hits the mismatch mid-session, not just at launch).
  subprotocol_mismatch: Your app is out of date and can't connect to this nest. Please update to continue.
  # fauna_client::NestClientError::NestIdentityChanged — the pinned deployment
  # identity check failed mid-session. The dedicated launch_identity_changed
  # surface (identity_changed_warning above) renders the rich warning; this is
  # the generic Display fallback for any other call site that only has the
  # error, not the launch phase.
  nest_identity_changed: The identity of {host} has changed and could no longer be verified. For your safety, the connection was stopped.
  # fauna_core::identity::ActorKeypair::from_secret_hex's Hex32Error, wrapped by
  # every recovery op (fauna-tui settings/mod.rs::recovery_identity) before a
  # held identity secret can be used for a ceremony — a real, if rare,
  # condition (a half-restored session), not a panic site.
  recovery_identity_unreadable: 'This session''s identity secret is unreadable: {detail}'
  # fauna_client_recovery::RecoveryError's Display, generic across all 7 apps'
  # recovery ceremonies (, the
  # same class of gap found and fixed for NestClientError/AnonClientError/
  # WsRpcError/ApiError). `Rejected` reuses `RpcError::localized()` directly,
  # like every other client error type — no dedicated key.
  recovery_superseded: This identity has already been succeeded by another one. Import your new identity to continue.
  recovery_no_escrow: No sealed copy of your identity secret is stored for this recovery kit, so it cannot recover this account right now.
  recovery_not_registered: No recovery key is registered for this identity, so there is nothing to recover from.
  recovery_already_succeeded: This identity has already been succeeded and cannot be recovered again.
  recovery_invalid_nonce: That recovery request has expired or was already used. Please try again.
  recovery_signature_failed: That recovery kit was refused — it may have already been replaced.
  recovery_kit_not_current: This is not your most recently created recovery kit. Enter your newest kit instead.
  recovery_successor_exists: That identity already has an account on this nest.
  recovery_transport: 'Connection error: {detail}'
  recovery_crypto: 'A cryptographic step failed: {detail}'
  recovery_malformed: 'The nest sent back something unexpected: {detail}'
  recovery_prior_kit_required: A recovery key is already registered. Enter your current kit to replace it, or use the seed-alone replacement option instead.
  recovery_prior_kit_mismatch: That kit does not match the one currently registered for this identity.
  recovery_prior_escrow_unreadable: 'Your existing recovery data could not be read ({reason}), so replacing it now would destroy it. Try again from a device and connection that can read it.'
  recovery_group_ceremony: 'Updating your groups failed: {detail}'
