  report_post: Report post
  # Collapse-to-placeholder treatment for a feed post whose text matches the
  # user's muted words (topic-factors.md § Scoring — a mute collapses
  # everywhere; wording mirrors the conversation bubble's collapse strings).
  post_muted_placeholder: Muted word
  post_muted_reveal: Show anyway
  # The muted-word list could not be read, so it is NOT being applied to this
  # feed. Surfaced rather than swallowed: silently dropping the filters would
  # show the user exactly the content they asked never to see, with no hint why.
  error_muted_keywords: 'Your muted words are not being applied: {message}'
  # Muted "unverified source" badge (unverified-source-badge), shown iff this
  # client's signature verification of a post's signed envelope FAILED
  # (security.md § App display of unverified content; VerificationStatus::Failed).
