conversations:
  errors:
    # Another same-account instance of this app hosts the conversations
    # engine — an honest standing refusal, not a failure; the rest of the
    # app works normally in this instance.
    served_elsewhere: Conversations are open in another instance of this app. Use them there — everything else works here.
    # The receive rail died on an internal error (a receive pass panicked, or
    # on web never finished) and is deliberately not restarted in place —
    # restarting the app is the safe recovery. Standing until then.
    receive_stopped: New messages stopped arriving because of an internal error. Restart the app (or reload the page) to receive them again.
    # Received mail records this device skipped because they would not open
    # under the account's current mail keys (a rotation past the grace window,
    # or a mailbox turned off and back on). Later mail keeps arriving; the
    # count is per app run. Ranked below every other page error.
    mail_unopenable: '{count} received messages could not be opened on this device. They were sealed to mail keys this account no longer holds, and were skipped.'
  list:
