    # backlog somebody explicitly postponed. Deliberately not congratulatory and
    # deliberately NOT a safety verdict: succession-aftermath.md § Implementation
    # status today leaves no combined "is the user safe" boolean for a surface to
    # round a count of zero up to, and an empty review list is not one either.
    empty: There is nobody waiting for you to review.
