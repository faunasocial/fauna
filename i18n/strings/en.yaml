  # shown ONCE per recovery, and whatever it left unanswered — deferred, or
  # never reached — is what this page inherits). The row / Keep / Remove copy is
  # NOT re-declared here: the two surfaces render the same four ids from the
  # same `recovery_kit.review_*` strings, one family on two pages, so a reworded
  # verdict cannot mean one thing in the ceremony and another a month later.
  #
  # ⚠ Same copy discipline as `recovery_kit.review_*`, and for the same reason:
  # after a healthy recovery almost EVERY honest correspondent is on this list,
