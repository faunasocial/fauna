tui_nav_hints:
  # tui's persistent key-hint footer — the `nav-key-hints` element (ui.yaml
  # `global.platform_elements`, `tui: [nav-key-hints]`; architecture/apps/tui.md
  # § Key-hint footer). tui-only: a keyboard-only app cannot advertise an
  # affordance by appearance the way the six pointer apps do, so it names its
  # live keys in a bottom row.
  #
  # `{keys}` is the literal key glyph the binding uses (←/→, ↑/↓, ⏎, q) — never
  # translated, but *placed* by the translator, since a language may want the
  # verb ahead of the key. Each hint names a binding that would fire on the
  # current focus RIGHT NOW; the footer never lists a key that would do
  # something else, which is why open/next are two strings rather than one.
  pane: '{keys} pane'
  move_focus: '{keys} move'
  # Enter over a control actuates it; over a text input it advances the ring.
  open: '{keys} open'
  next: '{keys} next'
  quit: '{keys} quit'
tui_settings:
  # The tui app's own settings page (apps/tui.md § External media handoff).
  # tui-only (`platforms: [tui]`): it configures terminal-specific behavior of the
  # tui app itself, so no other app renders it.
  title: Terminal
  external_media_label: Play audio & video externally
  external_media_subtitle: >-
    This terminal can't play audio or video inline, so it can hand a clip to your
    system's default player. Choose whether it asks first, always opens, or never
    opens.
  external_media_ask: Ask each time
  external_media_always: Always open
  external_media_never: Never open (show details only)
feed:
  # Page/composer error + status copy resolved from the shared FeedManager
  # snapshot's LocalizedText (feed.md § Errors & edge cases). Named {message}
  # placeholders carry the underlying transport error.
  compose_empty: Post cannot be empty
  # Gate-to-tier compose (monetization.md § Pillars 2+3; feed.md § Encryption at
  # rest). A gated post needs a plaintext public teaser, and the author can only
  # gate to a tier whose period key this device holds (Pillar-1 custody —
  # the account plane's `fauna.state.subscriptions` rows).
  compose_gate_preview_empty: Add a public teaser for a gated post
  compose_gate_no_key: 'This device does not hold the key for tier {tier}'
  # A room-restricted post seals under the room's own key, which lives in this
  # device's conversations — absent when the room's key has not reached it yet,
  # or when this device has no conversations at all (ui/feed.md § Encryption at
  # rest, Room-restricted).
  compose_room_no_key: This device does not hold the key for that room yet
  # A reply, or a quote with commentary, under a tier- or room-restricted post
  # would be an ordinary public post of the user's — so it is refused, and says
  # so, rather than sent to every follower (ui/feed.md § Encryption at rest, A
  # reply, quote or repost of a restricted post).
  reference_restricted: This post is for a smaller audience, and your reply would be public, so it was not sent
  # A restricted post's attachment is sealed under that post's own key, minted
  # when the file is sealed — so changing the audience afterwards leaves the
  # already-uploaded photo openable by a key this post will never derive
  # (ui/media.md § Encryption at rest). The app cannot re-seal it: it no longer
  # holds the plaintext. Attaching again is the whole of the fix, so the message
  # says that rather than describing the seal.
  compose_attachment_stale: Attach the file again — the audience changed after it was prepared
  # feed.md § Persistence: a draft's attached file rests by content address,
  # and on this rail the blob is uploaded only by the submit itself — so a
  # draft restored after a relaunch, or on another device, names a file this
  # device never held. The submit refuses rather than posting without it,
  # naming the file so the author attaches it again (the conversations rail's
  # error.send.attachment_missing is the same refusal).
  compose_attachment_missing: 'Attach {filename} again — the file is not on this device.'
  # The machine-comparable asking price is entered in sats and stored in
  # millisats (monetization.md § The asking price). An amount too large to
  # convert is refused rather than clamped: a clamped price would be silently
  # unbuyable, and the author would never be told.
  compose_sell_price_invalid: Enter a smaller price
  # The pay-per-view sell arm derives its rank from a fresh read of the
  # author's tiers and refuses when that read fails (fail closed —
  # monetization.md § Implementation status (2d)): a guessed rank could land
  # the sold post inside every paid subscription.
  compose_sell_rank_unavailable: Could not check your tiers to price this post — try again

  error_load: 'Failed to load posts: {message}'
  error_feeds: 'Failed to load feeds: {message}'
  error_submit: 'Failed to post: {message}'
  error_subscribe: 'Failed to subscribe: {message}'
  # Opening a gated post's detail could not swap the public teaser for the full
  # body (feed.md § Encryption at rest — detail-open unlock). Every link in the
  # chain reports here: resolving the sealed blob's hash, fetching it, decrypting
  # it under a held period key (author custody / subscriber KeyBlob), and folding
  # the result into the snapshot. Surfacing it is load-bearing — a silent failure
  # is indistinguishable from a post that simply has no full body, on the app
  # AND in e2e (the reader is left staring at the teaser with no explanation).
  error_gated_unlock: 'Could not unseal this post: {message}'
  # A trained topic factor in this feed's composition could not be opened (the
  # sealed model failed to unseal, or the nest could not be reached for it). The
  # feed still lists its posts — only the personalized re-ranking is missing — so
  # this is a non-fatal notice, not a load failure (topic-factors.md § Scoring).
  error_trained_factor: 'This feed''s trained topic could not be applied: {message}'
  # A subscribed community model (a `text-model` labeler) could not be fetched or
  # read, so this feed is composing without it. Same non-fatal posture as the
  # trained-topic notice above: the posts are all here, one ranking factor is
  # missing. Deliberately NOT used for a model this app is too old to score — that
  # one is inert on purpose and says so on the labeler's catalog row instead
  # (content-moderation-and-ranking.md § Tier-3 artifact kinds).
  error_subscribed_model: 'A subscribed community model could not be applied: {message}'
  # A "more like this" / "less like this" training gesture failed. The model is
  # unchanged (the write is seal-then-put; a failure leaves the prior sealed blob
  # in place), so the user can simply retry.
  error_train: 'Could not train on this post: {message}'
  # `gated-post-buy-button` (the self-serve teaser purchase, gap (2c)) failed —
  # the existing subscribe call errored. monetization.md § Per-post
  # pay-to-unlock.
  error_buy_unlock: 'Could not buy this post: {message}'
  # The per-post-card ⋯ overflow trigger itself (feed-post-actions-button,
  # topic-factors.md § Authoring surface) — mirrors conversations.detail.
  # message_actions's wording (the dm-message-actions-button precedent applied
  # to posts). Windows was the only leg with a tooltip here at all (a hardcoded
  # literal); the others render an icon-only button with none.
  post_actions_tooltip: More actions
  # The per-post-card ⋯ overflow menu's training verbs (feed-post-more-like-this
  # / feed-post-less-like-this, topic-factors.md § Training signals): explicit
  # examples into a trained topic factor. Toggle-shaped — the rendered check
  # state is the post's current example marker.
  more_like_this: More like this
  less_like_this: Less like this
  # The factor-target sheet (feed-post-train-target-sheet), shown when the
