# Wire RPC error codes — rendered client-side from the `RpcError.message` i18n
# key the nest emits (`error.*`), keyed to the stable code constant. See
# docs/goal/architecture/version-compatibility.md Dimension 4. Distinct from the
# `errors:` (plural) block below, which holds client-local UI strings.
error:
  # Generic fallback rendered for any wire code without a more specific string.
  unexpected: Something went wrong talking to the nest. Please try again.
  # The NAMESPACED authorization families — `fauna.{ns}.permission_denied`,
  # `fauna.{ns}.forbidden` and `fauna.{ns}.not_owner`, minted per namespace by
  # the nest's `rpc_errors::{permission_denied_ns,forbidden_ns,bare_forbidden_ns}`
  # seams (15 namespaces, 35 call sites) plus the central
  # `fauna.bridges.permission_denied`. Rendered by `RpcError::localized()`'s
  # family fallback, which keys on the code's LAST segment so a namespace added
  # later is covered on arrival instead of silently falling through to
  # `unexpected` (the defect this string closes: every authorization refusal in
  # all 7 apps read "Please try again" for a permanent "you may not").
  # Deliberately ONE sentence for every refusing namespace and cause, so a
  # caller cannot probe WHICH check refused — the same reasoning that makes
  # `conversations.forbidden` below a single string. A namespace wanting to say
  # more adds its own exact-code arm, which wins over this fallback.
  authorization: You do not have permission to do this.
  # The NAMESPACED rate-limit family — `fauna.{ns}.rate_limited`, minted per
  # namespace by the nest's `rpc_errors::rate_limited_ns` seam (the anonymous
  # per-source throttle, the folder-channel commit cap, the bridge and
  # moderation rails). Every one of them is a ROLLING WINDOW: the same call
  # succeeds once the window rolls, so `RpcError::action()` classifies the
  # whole family `Transient` and this string is what a `Transient` should say.
  # Rendered by the family fallback, which keys on the code's LAST segment so a
  # namespace added later is covered on arrival — the same shape, and the same
  # rationale, as `authorization` above.
  #
  # ⚠ `fauna.email.rate_limited` is deliberately NOT this string: it also
  # carries the per-actor recipients-per-day submission quota, which "wait a
  # moment" would misdescribe, so it keeps `Rejected` and its own arm below.
  rate_limited: This is happening too quickly. Please wait a moment and try again.
  conversations:
    # fauna.conversations.forbidden — the recipient's reach policy turned a new
    # conversation away (their inbox mode, or a guardian policy — deliberately
    # ONE string for every refusing cause, so a sender cannot probe which:
    # direct-messages.md § Reach policy). The contact request is the remedy for
    # each of them, so the string points there.
    forbidden: This person isn't accepting new conversations right now. You can send them a contact request instead.
    # fauna.conversations.rate_limited — a non-claimant rostered member's
    # takeover-commit stream tripped the per-actor cap on a claimed folder
    # channel (federation.md § residual (a), row 428). Retryable — the
    # client's transient-error handling backs off and resends on its own; no
    # user action is actually needed beyond a short wait.
    rate_limited: This is happening too quickly. Please wait a moment and try again.
  profile:
    # fauna.profile.handle_taken (and the registration twin
    # fauna.account.handle_taken) — the handle belongs to another account on this
    # nest. Permanent for this handle; the remedy is a different one. Checked by
    # the nest before any pending action is created, so nothing was scheduled.
    handle_taken: That handle already belongs to someone else on your nest. Choose a different one.
    # fauna.profile.handle_cooldown — a handle its previous owner released
    # recently is held back for a while so nobody can impersonate them.
    handle_cooldown: That handle was released recently and can't be taken yet. Choose a different one, or try again later.
  bridges:
    # fauna.bridges.recipient_on_local_domain — a mailing-list member address on
    # a domain this nest hosts (mail-mass-mailing.md § Don't do these: the
    # refusal "points the user at the alias surface"). Permanent for that
    # address; the remedy is an alias, so the sentence names it.
    recipient_on_local_domain: That address is on your own server, so it can't be a list member. Add it as an alias instead.
    # fauna.bridges.forward_target_on_local_domain — a "forward all incoming
    # mail to" address on a domain this nest hosts (mail-forwarding.md § Don't
    # do these: that should be an alias, not a forward). Same remedy, so the
    # sentence names it.
    forward_target_on_local_domain: That address is on your own server, so mail can't be forwarded to it. Add it as an alias instead.
    # fauna.bridges.over_quota — a write that would take the account past its
    # one storage allowance, shared by mail, calendar and contacts
    # (caldav-server.md § QUOTA → § Enforcement points). Nothing was saved; the
    # remedy is freeing space or a bigger allowance, so the sentence names both.
    over_quota: Your storage is full, so this wasn't saved. Delete something to make room, or ask your nest admin for more space.
    # fauna.bridges.address_refused — conversation.rooms.open found no single
    # connected bridge whose declared address grammar accepts the typed
    # address (apps/bridges.md § Bridge-kind catalogue → Phase G).
    address_refused: None of your connected bridges can reach that address. Check how it is written.
    # fauna.bridges.conversation_store_full — a bridged conversation's store
    # cap (rooms, inbound rows or undelivered outbound items) is reached;
    # nothing was saved.
    conversation_store_full: This bridge has too many messages waiting, so this wasn't sent. Try again once it catches up.
    # fauna.bridges.guardian_approval_required — the family bridge-DM gate:
    # a send to (or a deposit from) a peer the guardian blocked
    # (family-safety.md § The bridge-DM gate).
    guardian_approval_required: This account can only message approved contacts.
  # ── The bridged reply/quote doors (feed.md § Interaction bar → *Reply and
  # quote on a bridged post*). A refusal is the affordance's inline failure,
  # and the reason only the nest knows — which account is missing, which
  # toggle is off — must reach the user with its remedy. ONE code per remedy,
  # a remedy being what to change AND on which page: the three bridges link
  # from three different pages (ActivityPub on Bridges, Bluesky on AT
  # Protocol, Nostr on its own page), so each sentence names its page. ──
  activitypub:
    # fauna.activitypub.not_linked — a reply to or quote of a fediverse post
    # when the account has no ActivityPub record at all (activitypub.md
    # § Reply and quote → *The door*). The remedy is the ActivityPub card on
    # the Bridges page.
    not_linked: This post came from the fediverse, and ActivityPub isn't enabled for your account yet. Enable it on the Bridges page first.
    # fauna.activitypub.switched_off — the record exists but federation is
    # switched off (the same door). Nothing was composed; the remedy is that
    # card's toggle.
    switched_off: Your ActivityPub federation is switched off, so this can't be sent to the fediverse. Turn it back on from the Bridges page.
  bluesky:
    # fauna.bluesky.not_linked — a reply to or quote of a Bluesky post with no
    # consume-side link this nest may write through (bridges.md
    # § Cross-posting → *Reply and quote — the unified shape*: no linked
    # account, or a hosted identity D7 withholds). ONE string for both,
    # because the fix is the same: the linked-account level on the AT
    # Protocol page.
    not_linked: This post came from Bluesky, and no Bluesky account is linked for you. Link one on the AT Protocol page first.
  nostr:
    # The door's four refusals (nostr.md § Replying to and quoting a nostr
    # note → *The door*), each naming what to change on the Nostr page.
    # fauna.nostr.not_linked — no Nostr key is linked at all.
    not_linked: This post came from Nostr, and no Nostr key is linked for you. Link one on the Nostr page first.
    # fauna.nostr.no_custodial_key — the key is linked in a signing mode the
    # nest cannot sign with (remote / nip07); the remedy is a generated or
    # imported key.
    no_custodial_key: Your nest doesn't hold your Nostr key, so it can't sign this for you. Switch to a generated or imported key on the Nostr page.
    # fauna.nostr.no_relays_configured — the publish relay list was emptied on
    # purpose (nostr.md § Errors & edge cases: never silently defaulted).
    # Minted by the reply door, by `nostr.events.publish_signed` and by a
    # Nostr conversation leg's send alike — one string for every caller.
    no_relays_configured: You've removed every Nostr relay, so there is nowhere to publish this. Add a relay on the Nostr page first.
    # fauna.nostr.replies_off — a reply (a quote still acks) while the
    # *Publish replies* toggle is off.
    replies_off: Replies to Nostr are switched off, so this wasn't sent. Turn on Publish replies on the Nostr page.
  nest:
    # fauna.nest.outdated — the nest booted a degraded "needs-update" mode (it
    # cannot safely operate its newer at-rest DB). Actionable: update the nest.
    outdated: This nest is running an outdated version and must be updated before you can connect.
    # fauna.nest.schema_mismatch — a query-time schema/version mismatch (the
    # nest's database shape does not match its software; a `no such column` the
    # boot-time gate cannot catch). Actionable: update the nest — never retry.
    schema_mismatch: This nest's database does not match its software version and must be updated.
  federation:
    # fauna.federation.peer_nest_outdated — a cross-nest relay reached a peer
    # nest that predates the required federation kind (S5 old-peer mapping,
    # federation.md § Cross-nest shared folders + channel append; shared by
    # the send_remote / changes.list / content_key.get / leave relays).
    # Actionable for the OTHER side's admin: their nest needs an update — never
    # an auth problem on this side, never an auto-retry.
    peer_nest_outdated: The other side's nest is running an outdated version and does not support this yet.
  protocol:
    unknown_kind: This nest does not support that request. It may need to be updated.
    malformed: The request could not be processed.
    timeout: The nest took too long to respond. Please try again.
    cancelled: The request was cancelled.
    internal: The nest ran into an unexpected error. Please try again.
    encode: The nest sent a response that could not be read.
    replay_too_large: There is too much to catch up on at once. Please try again.
    disconnected: The connection to the nest was lost.
  email:
    # fauna.email.too_large (fauna_protocol::email::MESSAGE_TOO_LARGE_CODE) —
    # rendered both when the nest rejects an over-ceiling fauna.email.send /
    # import_message and when an app's own inline-ceiling pre-check refuses
    # a compose before it ever reaches the wire (smtp-server.md § Message size
    # limits) — same identifier, same text, either way.
    too_large: This message is too large to send. Remove attachments or shorten it and try again.
    # The client's own pre-check, refused before the wire: this account has no
    # handle on its nest, so there is no address it may legitimately send from
    # (mail-app-surface.md § First-party client send — the nest does sender-handle
    # verification, and public-mode.md § User Registration makes the handle the
    # thing a registration chooses). Reached by an actor an admin admitted
    # directly (`fauna.admin.users.create`), which writes no handle.
    no_handle: You need to set a handle for your account before you can send email.
    # fauna.email.permission_denied — the nest names this identifier as the
    # error's message (`email_handlers.rs::permission_denied`) for both of its
    # From-handle refusals: no handle at all, and a From whose local part is not
    # this actor's handle. The human reason rides `details`, which no app
    # renders, so without this key the identifier reached users verbatim.
    permission_denied: You can only send email from your own address. Check the account you are sending from.
    # fauna.email.rate_limited — the ONE member of the `rate_limited` family
    # that is not a plain rolling window: `email_handlers` mints this code for
    # BOTH the hourly outbound send-rate window AND the per-actor
    # recipients-per-day submission quota. "Wait a moment" is wrong for the
    # second, so this code keeps `RpcErrorAction::Rejected` and this exact-code
    # arm, which outranks the `error.rate_limited` family string above. Says
    # "later" without promising a moment, since one code covers both causes.
    rate_limited: You have reached your sending limit for now. Try again later.
  sync:
    # fauna.sync.device_limit_exceeded — `fauna.sync.register` refused a NEW
    # device because the account already holds as many as its tier allows
    # (devices.md § Step 4; the tier IS the quota, admin.md § 2 Users). Nothing
    # was written, and no retry clears it: only a freed slot does — the user
    # removes a device on Settings → Devices (the page that renders this), or
    # the admin moves the account to a bigger tier — so the sentence names
    # both remedies and never says "try again". Rendered by
    # `RpcError::localized`'s exact arm AND by the Devices page's standing
    # enrollment notice (`fauna_sync_engine::account_runtime::EnrollmentRefusal`),
    # one string for both so the two cannot drift.
    device_limit_exceeded: This account already has as many devices as its plan allows, so this device could not be added. Remove a device you no longer use under Settings → Devices, or ask your admin for a bigger tier.
  send:
    # The conversations send-failure slot (`conversations.unified.error_send`'s
    # {message}) renders ONLY product statements — conversations.md § Errors &
    # edge cases, send-slot taxonomy ratified 2026-08-02. These are the
    # sentences `BackendError::user_detail` maps conditions and diagnostics
    # onto; a raw diagnostic payload never reaches the slot (it goes to the
    # log instead).
    # Deliberately says nothing about *which* gesture failed: `user_detail()`
    # is interpolated as {message} into four templates that each already name
    # the action (error_send / error_add_participant / error_remove_participant
    # / error_rename_thread), so a sentence restating one of them read
    # redundantly on sends ("Could not send this message: This message could not
    # be sent…") and wrong-domain on the three membership ops once they stopped
    # rendering `Display` (2026-08-06). Reworded, not re-keyed — the key is what
    # conversations.md and the pins reference.
    generic: Something went wrong. Please try again.
    auth_required: Sign in again to send this message.
    not_supported: This action is not available for this conversation.
    no_recipients: There are no recipients to send this message to.
    # The room policy's refusals (conversation-rooms.md § Roles and
    # authorization): the shared Rust refuses the gesture BEFORE any commit is
    # authored, so an honest app never posts a commit every other member would
    # refuse. Product statements — they ride {message} of the membership
    # templates above.
    room_invite_not_permitted: Only the room's owner and admins can invite people to this room.
    room_remove_not_permitted: Only the room's owner and admins can remove people from this room.
    room_owner_not_removable: The room's owner cannot be removed. Ownership has to be handed over first.
    room_policy_not_permitted: Only the room's owner and admins can change this room's settings.
    room_admins_owner_only: Only the room's owner can appoint or demote admins.
    room_transfer_owner_only: Only the room's owner can hand the room over.
    room_transfer_not_a_member: The room can only be handed over to one of its other members.
    room_transfer_superseded: The room's settings changed while the hand-over was waiting, so it did not go through. Hand the room over again.
    room_policy_unavailable: This room has no room settings, so there is nothing to change here.
    room_owner_cannot_leave: Hand the room over to someone else before you leave — a room always has an owner.
    room_leave_failed: Leaving this room did not go through. Try again.
    # conversations.md § Errors & edge cases: an attachment upload to a room
    # homed on ANOTHER nest failed, and that nest said why in its own words.
    # Its words are never shown — the room's home nest is chosen by whoever
    # created the room, so its response body is text a stranger wrote. The
    # detail rides the log; this sentence is all the user reads.
    attachment_upload_foreign_failed: The attachment couldn't be uploaded to this conversation's home server. Try sending it again.
    # conversations.md § Persistence: a draft's attachments rest by content
    # address, but the file itself stays in memory on the device that attached
    # it — so a draft restored after a relaunch, or synced to another device,
    # can list a file this device does not hold. The send refuses rather than
    # going out without it, naming the file so the user attaches it again
    # (the posts rail's feed.compose_attachment_missing is the same refusal).
    attachment_missing: 'Attach {filename} again — the file is not on this device.'
errors:
  auth_failed: Sign-in failed
  secret_key_invalid: Secret key must be exactly 64 hexadecimal characters
  nest_unreachable: Cannot connect to nest at the specified URL
  nest_timeout: Nest did not come online within the expected time
  snapshot_device_unknown: This snapshot's owning device is unknown, so its files cannot be downloaded.
