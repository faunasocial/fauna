    connection_group_description: Network information for P2P connectivity
    lan_addresses: LAN Addresses
    lan_none: (no active interfaces detected)
  sign_out_confirm: 'Are you sure you want to sign out? You will need your secret key to sign back in.'
  # A sign-out completes even when the erase cannot remove everything
  # (account-scoping.md § Erasure follows scope) — so the user has to be TOLD,
  # or "signed out" reads as "your data is gone from this device" when it is
  # not. Selected by the shared `EraseResidueView::copy`, never assembled by an
  # app. Each names the Remove Again control every app paints beside it.
  sign_out_residue: 'Signed out, but {count} item(s) of your data could not be removed from this device — another program may still be using them. Press Remove Again to try once more.'
  sign_out_residue_credentials: 'Signed out, but your sign-in credentials could not be removed from this device — its secure storage may be locked or unavailable. Press Remove Again to try once more.'
  sign_out_residue_with_credentials: 'Signed out, but your sign-in credentials and {count} item(s) of your data could not be removed from this device. Press Remove Again to try once more.'
  # `sign-out-residue-retry-button` (account-scoping.md § Erasure follows scope):
  # re-runs the erase over exactly what the sign-out left behind. The owing
  # lines above name it by this label, so the two change together.
  sign_out_residue_retry: Remove Again
  # The retry refused because another Fauna window (of any app on this device)
  # is serving an account one of the leftover items belongs to — the sign-out's
  # own refusal, phrased for the button pressed.
  sign_out_residue_retry_blocked_other_window: 'Not removed — another Fauna window is using some of this data. Close it, then press Remove Again.'
  sign_out_blocked_other_window: 'Still signed in — another Fauna window is using this account on this device. Close it, then sign out again.'
  # The same refusal for removing ONE account (account-scoping.md § Concurrent
  # instances): its own line because the remedy names the gesture pressed.
  remove_account_blocked_other_window: 'Not removed — another Fauna window is using that account on this device. Close it, then remove the account again.'
  # …and for the account THIS window is using (a window opened for one account
  # can list another as the device's active one): its own remedy.
  remove_account_blocked_this_window: 'Not removed — this window is using that account. Close this window, then remove the account from another one.'
  # A switch refused at the point of no return (long-term-store.md § Multi-account
  # evolution, "Activating refuses an account it cannot launch as"). Selected by the
  # shared `fauna_client_accounts::switch_refused_copy`, never assembled by an app;
  # both lines say the user is still where they were, because the refusal left the
  # live session running.
  switch_refused_no_secret: 'Not switched — this device can no longer sign in as {account}: its secret key is missing here. You are still on the identity you were using. To use {account} here again, add it back with its secret key or recovery kit.'
  switch_refused: 'Not switched to {account} — you are still on the identity you were using.'
  # An account add refused because this device's account list is full
  # (long-term-store.md § Multi-account evolution → "The index is bounded").
  # Selected by the shared `fauna_client_accounts::add_refused_copy`; nothing was
  # added and the user is still on the account they were using.
  account_list_full: 'Not added — this device''s account list is full. Remove an account this device no longer uses, then try again.'
