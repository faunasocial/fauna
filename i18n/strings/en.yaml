# Settings → Sessions (ui/sessions.md). The note and the warning are REQUIRED
# copy, part of the page's contract: without them the page promises a remote
# sign-out the mechanism cannot deliver (behavior/devices.md § What a session
# is, and what revoking one does; § The two panic buttons — the warning must
# say all five things listed there, in that order). Reword only against those
# sections. LOCK in the prompt is the literal confirm word — never translate it.
sessions:
  title: Sessions
  kind_app: App sign-in
  kind_device: 'Device: {name}'
  kind_unknown_device: A device key not in your device list
  mark_this_app: This app
  mark_this_device: This device
  detail: 'Signed in {created} · last active {last_used} · expires {expires} · {address}'
  address_not_recorded: address not recorded
  empty: No sessions to show.
  revoke: Revoke
  revoke_others: Sign Out Everywhere Else
  revoke_others_confirm: Yes, Sign Out Everywhere Else
  revoke_others_cancel: Cancel
  revoke_note: Revoking ends a sign-in and makes whoever held it prove themselves again. It does not sign a device out — a device that holds your secret key or a device grant signs itself straight back in. To end a device for good, remove it under Settings → Devices. If someone else holds your secret key, only your recovery kit ends them (Settings → Account → Recovery Kit → My Identity Was Stolen).
  lockout_warning: 'Lock this account for 24 hours. Every device is signed out, this one too. Nobody can sign in for 24 hours, you included, and there is no unlock. It does not remove somebody who holds your secret key — they come back when the lock ends. They can do the same to you: anyone with your secret key can sign you out and lock the account, again every 24 hours. Your recovery kit still works while the account is locked and moves it to a new key the thief cannot use (Settings → Account → Recovery Kit → My Identity Was Stolen) — a lock you did not set is itself the sign to use it.'
  lockout_confirm_placeholder: Type LOCK to confirm
  lockout_button: Lock for 24 Hours
  lockout_wrong_word: 'Type {word} exactly to lock the account.'
  load_failed: 'Could not load your sessions: {error}'
  act_failed: 'That did not go through: {error}'
  no_own_session: This app does not know its own sign-in yet, so it cannot tell which one to keep. Try again in a moment.
settings:
  title: Settings
  # Identity export — the Settings/Account section that shows the identity QR a
  # second device scans to import (settings.md § Identity export). Keyed under
  # `settings` because that is the surface that consumes it; the wizard's import
  # counterpart keys under `onboarding.identity_import`.
  identity_export:
    title: Export Identity
    desc: Show a QR code that another device can scan to import your identity.
    warning: Anyone who scans this QR code gets full access to your identity. Only show it in a trusted environment.
    show_qr: Show QR Code
    hide_qr: Hide QR Code
  # Recovery kit — the RecoveryKey's Settings home, a section on the Account
  # sub-page right after Identity export (settings.md § Recovery kit, ratified
  # 2026-08-01). The status line renders exactly one of the four `status_*`
  # strings, projected from the registration chain by shared Rust
  # (fauna_client_recovery::status) so all seven apps say the same thing.
  recovery_kit:
    title: Recovery Kit
    desc: An offline key that can recover your account if you lose your identity secret — or take it back if someone steals it. It is shown once and never stored on this device.
    # The four states of recovery-kit-status.
    status_never_created: 'No recovery kit. If you lose your identity secret, your account cannot be recovered, and if someone steals it, you cannot take it back.'
    status_registered: Your recovery kit is active, and a sealed copy of your identity secret is stored for it.
    # ⚠ The no-escrow arm must say BOTH halves plainly (identity-succession.md
    # § Seed escrow → Lifecycle on the nest, the landed-re-put ruling,
    # 2026-08-10): the phrase does not currently recover the account, and the
    # repair is entering the kit already in hand — never "replace", which mints
    # a new kit and retires the one the user may have just spent 30 days
    # landing.
    status_registered_no_escrow: 'Your recovery kit is active, but no sealed copy of your identity secret is stored — your recovery phrase cannot recover this account right now. Enter your kit below and press Restore Phrase Recovery to fix this.'
    status_replacement_pending: 'A replacement of your recovery kit was requested with your identity secret alone, and takes effect in {days} days. Cancel it below if it was not you.'
    # The fifth: before the status resolves, every one of the four actions below
    # is dead (each gates on the status the page has not read yet), so the line
    # must still say something — rule 5 applies to that window too.
    status_loading: Checking your recovery kit…
    # The four actions.
    create: Create Recovery Kit
    replace: Replace Using My Kit
    lost: I Lost My Kit
    # The RegisteredNoEscrow repair: re-puts the sealed copy under the kit the
    # user holds, without retiring it. Renders only in that state.
    escrow_reseal: Restore Phrase Recovery
    # The group-sweep retry (identity-succession.md § Propagation → MLS groups;
    # the mechanism is fauna_client_recovery::retry_group_sweep). Renders only
    # while the sweep report shows unfinished work — the escrow_reseal shape: an
    # affordance for a state, not a standing button. Labelled for the OUTCOME
    # the user wants, not the mechanism: "retry the sweep" names an internal
    # pass nobody outside this codebase has a word for.
    sweep_retry: Finish Moving Your Groups
    # The retry's three non-sweeping answers. Each says what happened AND what
    # is left to do -- a gesture that reports nothing reads as a dropped
    # command (testing.md point 11).
    #
    # ⚠ no_old_state is the one that is NOT a fault: this device simply holds no
    # conversation state for the retired identity, so there is nothing here to
    # rebuild the sweep from and the member-side remedy is all that is left ON
    # THIS DEVICE. It still names the OTHER device first, because that is the
    # cheap fix -- but CONDITIONALLY (2026-08-27, settings.md § Recovery kit ->
    # *Finishing an unfinished group sweep*): it used to read "Sign in on the
    # device you used to take your account back and press Finish Moving Your
    # Groups there", which sends the user in a circle whenever THIS device is
    # that device -- always so on web (the retired identity's replica rests
    # behind bearers the succession revoked, so no web device can ever hold it)
    # and natively whenever conversations were down at the ceremony (the
    # `NoEngine` arm, which is the commonest reason the retry is owed at all).
    # The condition, not the platform, is what the sentence turns on, so every
    # app says the same words.
    sweep_retry_no_old_state: 'This device does not have the conversation history from your previous identity, so it cannot finish the move. If another of your devices still has those conversations, press Finish Moving Your Groups there; otherwise ask another member of each group to remove the old identity and add your new one.'
    sweep_retry_not_landed: 'No move of this account has been recorded, so there is nothing to finish. If you have just taken your account back, wait a moment and try once more.'
    sweep_retry_landed_for_another: 'This account was moved to a different identity than the one signed in here. Sign in as your current identity to finish moving your groups.'
    sweep_retry_failed: 'Your groups could not be updated: {reason}. Nothing was lost — press Finish Moving Your Groups to try once more.'
    stolen: My Identity Was Stolen
    veto: Cancel The Pending Replacement
    # The type-to-confirm gate on succession, mirroring account deletion.
    stolen_confirm_placeholder: Type SUCCEED to confirm
    stolen_warning: This mints a new identity and re-points your account to it. It cannot be undone, your old identity stops working, and you will need to re-add your devices. Your handle stays yours. Afterwards, create a new recovery kit — this one retires with the old identity.
    # The let-go of a dead generation (account-data-taxonomy.md § The generation
    # machinery → Fleet-scope reclamation, clause (3)(j); placement settings.md
    # § Recovery kit). Rendered ONLY while some of the account's data is sealed
    # under a key no signed-in device holds and no holder keeps a copy of. The
    # line must say the ONE thing the app cannot know: a device not signed in
    # since then may still read this data, so sign in there first. Selected by
    # fauna_account_plane::generation_let_go::unreadable_status.
    unreadable_status: '{rows} items of your account data, saved since {since}, cannot be read by any device signed in to your account, and no copy of their key is stored. If one of your devices has not been signed in since {since}, it may still be able to read them — sign in there first. Otherwise you can let them go to free the space they take.'
    unreadable_status_undated: '{rows} items of your account data cannot be read by any device signed in to your account, and no copy of their key is stored. If one of your devices has not been signed in for a while, it may still be able to read them — sign in there first. Otherwise you can let them go to free the space they take.'
    let_go: Let Go Of Unreadable Data
    # The type-to-confirm gate on the let-go, the stolen-identity idiom: the
    # data cannot be brought back afterwards. The word is
    # generation_let_go::LET_GO_CONFIRM_WORD.
    let_go_confirm_placeholder: Type LET GO to confirm
    # The act ran. `{retired}` items left the server; anything the server was
    # still serving to another device stays listed and goes on the next press.
    let_go_done: '{retired} unreadable items were let go.'
    # A device or a stored copy can read some of it again since the line was
    # shown: those are kept, never let go.
    let_go_kept: 'Some of this data became readable again and was kept.'
    let_go_failed: "Couldn't let the data go: {message}"
    # The ceremony landed but this device could not SAVE the new identity — the
    # one arm where the secret must go on screen, because it is the only way
    # back into an account that has already moved. Never phrased as "nothing
    # happened": the succession is done whatever this device managed to store.
    # The app that shows this must NOT tear its session down afterwards, or it
    # takes the secret with it (`identity-succession.md` § Implementation status
    # today — the read-back finding is what makes this arm reachable and
    # distinguishable at all).
    stolen_persist_failed: 'Your account was re-pointed to a new identity, but saving it on this device failed. Write this secret key down NOW and import it — it is the only way back into your account: {secret}'
    # The ceremony's nothing-moved arm alone (`StolenOutcome::NotLanded` —
    # wrong phrase, a pre-submit refusal, or a lost reply the nest confirmed
    # never committed): the only arm where "couldn't recover" is true. Distinct
    # from `stolen_persist_failed` above, where the ceremony landed and only
    # this device's own save failed, and from the three keys below, which carry
    # their own headlines and are never wrapped in this one (`settings.md`
    # § Recovery kit → *The ceremony's outcome is headlined by its arm*).
    stolen_ceremony_failed: "Couldn't recover your account: {message}"
    # The undecided arm — the submit reply was lost and this device could not
    # ask the nest whether the account moved. Split by the way back: the
    # successor identity was verified saved here (`_saved`), or it was not and
    # the secret goes on screen as the only copy (`_unsaved`, parked like
    # `stolen_persist_failed`). Never phrased as "nothing happened" — the
    # account may already be the new identity's. `{cause}` is the diagnostic
    # clause, `{reported}` the ceremony's own error.
    stolen_outcome_unknown_saved: "Couldn't confirm whether your account was recovered ({cause}). Your new identity is saved on this device — reopen the app to sign in with it. Details: {reported}"
    stolen_outcome_unknown_unsaved: "Couldn't confirm whether your account was recovered ({cause}), and this device couldn't save your new identity. Write down this secret key now and import it — it is the only way back into your account: {secret}. Details: {reported}"
    # The landed-for-another arm: another device's ceremony with the same kit
    # won the race. Final — never "try again". `{actor}` is that identity's id.
    stolen_landed_for_another: "Your account has already been moved to a different identity ({actor}) — another device with the same recovery kit got there first. Import that identity to get back into your account."
    # The status re-read (create/replace/lost-kit's status half, and the
    # standing status line's own read) failed — the kit action itself may
    # still have landed; only the re-read is what's reporting stale.
    # `{message}` was a hardcoded `format!("recovery kit status: {msg}")`
    # before this key existed.
    status_failed: 'Could not check your recovery kit: {message}'
    # Create/Replace/Lost-kit and the escrow re-put's own failure — distinct
    # from `status_failed` above (this is the ceremony/re-put call itself,
    # not the status re-read after one). `{message}` was a hardcoded
    # `format!("recovery kit: {msg}")` before this key
    # existed.
    action_failed: 'Could not update your recovery kit: {message}'
    # The pending-replacement cancel. `{message}` was a hardcoded
    # `format!("cancel replacement: {msg}")` before this key
    # existed.
    veto_failed: 'Could not cancel the pending replacement: {message}'
    # Kit-in-hand entry (settings.md § Recovery kit → Kit-in-hand entry,
    # user-approved 2026-08-01): the onboarding recovery_entry screen's OWN
    # input, reused inline here because a pasted phrase is the same artifact.
    kit_phrase_placeholder: Paste your recovery phrase (fauna://recovery link or 64-character code)
    # The phrase field is empty when a kit-in-hand ceremony is clicked. An
    # honest refusal on error-message, never a silently dropped gesture.
    kit_phrase_required: Paste the recovery phrase for this account first.
    # The post-succession group sweep's outcome — the ceremony's own result,
    # shown in the flow that ran it (identity-succession.md § Propagation →
    # MLS groups). Deliberately TWO facts, never one "you are safe" verdict:
    # the ceremony evicts the stolen identity, and separately there may be
    # members it cannot vouch for. Rounding those together is the bug the
    # 2026-08-02 narrowing exists to prevent.
    # ⚠ The two DEGRADED arms (sweep_none, sweep_partial) name only remedies
    # that a user can actually reach (2026-08-05 — the rule, not the
    # remedy list, which has since grown). They once said "run this again" /
    # "try again" when nothing could: `sweep_groups` had one caller, the
    # ceremony fold, reachable only between the ceremony and the account
    # switch. The only control the sentence could be read against was *My
    # Identity Was Stolen*, and pressing it as the successor runs a SECOND
    # irreversible succession that evicts nothing — so the user churns their
    # account and the thief keeps reading.
    #
    # 2026-08-16: a real re-run affordance now exists — `sweep_retry` below,
    # over `fauna_client_recovery::retry_group_sweep`, which rebuilds the old
    # engine from the surviving scoped store and re-acquires the landed
    # statement through the chain-verified walk. So both arms now name the
    # BUTTON first and keep the member-side remedy as the fallback it still is
    # (a device that never held the old conversation state cannot retry, and
    # `sweep_retry_no_old_state` says exactly that). The pin
    # `the_degraded_sweep_arms_name_only_remedies_that_exist` (fauna-tui
    # settings/mod.rs) enforces both halves: the button's own label must appear,
    # and the bare "again" advice must not come back in its place.
    sweep_none: 'Your conversations were not running, so your groups still include your old identity, and your new one is not in them. Press Finish Moving Your Groups below to complete it now, or ask another member of each group to remove the old identity and add your new one.'
    sweep_failed: 'Your account moved to your new identity, but your groups could not be updated: {reason}. Your old identity may still be able to read them.'
    sweep_all_removed: 'Your old identity was removed from all {groups} of your group conversations.'
    sweep_partial: 'Your old identity was removed from {removed} of your {groups} group conversations. It can still read the rest — press Finish Moving Your Groups below to finish, or ask another member of those to remove it.'
    # The same two degraded arms on an app that has NOT built
    # `recovery-kit-sweep-retry-button` yet (settings.md § Recovery kit → *The
    # sweep's own lines*): the same FACT, with the member-side remedy alone —
    # naming a button that is not on screen is the exact dishonesty the arms
    # above were narrowed to remove. Selected by the shared projection
    # (`SweepView::copy`, `SweepRetryAffordance::Absent`), never by an app.
    # ⚠ A parity gap, not a product choice: these two retire when the seventh
    # app builds the button. Same ban as above — no bare "again".
    sweep_none_no_retry: 'Your conversations were not running, so your groups still include your old identity, and your new one is not in them. Ask another member of each group to remove the old identity and add your new one.'
    sweep_partial_no_retry: 'Your old identity was removed from {removed} of your {groups} group conversations. It can still read the rest — ask another member of those to remove it.'
    # The residual the app genuinely cannot classify. Never phrased as an
    # alarm: a healthy group has members the ceremony did not add, so this is
    # adjudication material for the user, not a verdict about them.
    # ⚠ This line states the fact and STOPS. It used to close with "Review your
    # group members." — a redirect that was the only affordance there was. The
    # ephemeral review pass now renders directly beneath it, so the redirect
    # would point past the buttons it is standing on; and once the user defers,
    # it would point at a page this line does not name. State the fact, let the
    # affordance below be the affordance (the same discipline the two degraded
    # arms above already follow).
    sweep_unattested: 'There are {count} other members across your groups that this cannot confirm you added yourself. If your identity was stolen, one of them could be the thief under another name.'
    # ── The ephemeral kit-side review pass (identity-succession.md § Propagation
    #    → MLS groups, ruling 1: shown ONCE per recovery, in the ceremony flow
    #    that produced it; whatever is left when it is closed or deferred is what
    #    the permanent view inherits). ──
    #
    # ⚠ The copy discipline here is the sharpest in the feature, for the reason
    # § Propagation gives: after a healthy recovery almost EVERY honest
    # correspondent lands on this list, because the ceremony can vouch for nobody
    # it did not itself add. This must read as a review list the user works
    # through, never as a list of suspects — copy that accuses would accuse the
    # user's own friends after every SUCCESSFUL recovery.
    review_intro: Keep the people you recognise. Anyone you don't, you can remove from your groups. You do not have to finish now.
    # One row per person, never one per item: two rows for one human reads as
    # being asked the same question twice, when the decision is singular.
    review_row: '{who} — {reason}'
    review_reason_compromise: was in your groups before you recovered your account
    # A reason this build does not name (a newer build's, or the witness's
    # unverifiable arm). Rendered rather than hidden — an unnamed reason is still
    # a person the owner must decide about.
    review_reason_other: this could not confirm their identity
    # They carry an open item but sit in none of our groups today — the ordinary
    # case on a deferred backlog. The row still renders: an item nobody can name
    # is an item nobody can close.
    review_unknown_person: Someone no longer in any of your groups
    review_keep: Keep
    review_remove: Remove From My Groups
    review_defer: Review The Rest Later
    # A partial eviction records NO verdict and the row STAYS — so the user must
    # be told why the row they just acted on is still there. Same grammar as
    # sweep_partial above, deliberately: it is the same fact about the same kind
    # of operation, and a second phrasing of it would be drift.
    review_remove_partial: 'Removed {who} from {removed} of {groups} of your group conversations. The rest still include them — try again, or ask another member of those groups to remove them.'
    # Rule (5)'s blocking classes (identity-succession.md § Propagation →
    # Removing a flagged member, (5)): seats Remove cannot clear from this
    # screen, each sentence naming the room its remedy lives in. Appended after
    # one of the three lead lines, because the row STAYS until those seats
    # clear — a blocked verdict with no named remedy reads as a button that
    # silently stopped working. The two leads below cover the no-failure
    # cases, where review_remove_partial's "the rest still include them" would
    # describe groups that do not exist.
    review_remove_done_here: 'Removed {who} from {removed} of your group conversations.'
    review_remove_none_here: '{who} is not in any of your group conversations on this device.'
    review_remove_folder_seats: 'They are also in {seats} shared folder(s). Remove them in each folder''s sharing settings — or leave the set, if it is not yours — then choose Remove again.'
    review_remove_unsynced_seats: 'They are also in {seats} group chat(s) not yet synced to this device. Choose Remove again after syncing completes, or from a device that has those chats.'
    # The eviction completed but the verdict could not be written, so the row
    # stays even though the removal worked. Naming that is the honest rendering:
    # the alternative is a row that silently refuses to clear.
    review_verdict_failed: 'Removed {who} from your group conversations, but your review list could not be updated yet: {reason}. They may still be listed here until it succeeds.'
    # The aftermath's NestBackupKey leg (identity-succession.md § Re-key scope,
    # the NestBackupKey row). The succession transaction deletes the old grant,
    # and the nest's backup sweep enumerates owners BY that grant — so until
    # this runs the successor is skipped entirely and nothing is backed up.
    # User-facing wording therefore talks about backups resuming, never about
    # keys: the key is the mechanism, the stopped backup is what they'd notice.
    backup_regrant_running: Restarting your backups under your new identity…
    backup_regrant_done: Your backups are running again under your new identity.
    backup_regrant_failed: 'Your backups could not be restarted under your new identity yet: {reason}. This will be retried the next time you sign in.'
    # The aftermath's __mls leg (identity-succession.md § Re-key scope, the
    # BackupKey corpus row). The openMLS state replica — the crypto state every
    # conversation's decryption depends on — is still sealed to the retired
    # identity, so until this runs the successor's messages will not open at
    # all. User-facing wording therefore talks about conversations, never about
    # replicas or MLS: the replica is the mechanism, unreadable messages are
    # what they would notice.
    mls_reseal_running: Unlocking your conversations under your new identity…
    mls_reseal_done: Your conversations are now held under your new identity.
    # Partially applied: this device unlocked what it could, but some
    # conversations were sealed by an identity whose key it does not hold (a
    # twice-succeeded chain). Progress was real AND the pass is unfinished —
    # both are true, so the line names the remaining step rather than claiming
    # completion.
    mls_reseal_partly_owed_elsewhere: 'Some of your conversations are still held under a previous identity that this device cannot unlock. Sign in on the device you used to take back your account, and it will finish there.'
    # ⚠ The ordinary state on a device that never held the old identity's
    # secret — NOT damage. Naming the fix is the whole point of the line;
    # phrasing it as corruption would alarm a user whose data is fine.
    mls_reseal_owed_elsewhere: 'Your conversations are still held under your previous identity, and this device does not have the key to unlock them. Sign in on the device you used to take back your account, and it will finish there.'
    mls_reseal_failed: 'Your conversations could not be moved to your new identity yet: {reason}. This will be retried the next time you sign in.'
    # The aftermath's capability-grant re-mint (identity-succession.md § Re-key
    # scope, the capability-grants row). The succession transaction revokes
    # every grant the old identity minted — mail filtering, search and similar
    # box services stop being able to do their job — and this leg re-mints each
    # one from the owner's own grant record, under the new identity. User-facing
    # wording therefore talks about services losing and regaining access, never
    # about grants or keys. The done line points at review deliberately: every
    # re-minted grant is marked for the owner to keep or remove, because a
    # thief who held the old identity could have added one
    # (§ Adjudicating what the aftermath carries across).
    grant_remint_running: Restoring the access you had granted to services, under your new identity…
    grant_remint_done: 'The access you had granted to services (mail filtering, search and similar) is restored under your new identity. Review each one on the Nests page — if your identity was stolen, the thief could have granted access you never did.'
    # Partially applied: progress was real AND the pass is unfinished — some
    # holder was not found on the nest, or a mint did not land. Never phrased
    # as damage; the pass retries at every sign-in.
    grant_remint_partial: 'Some of the access you had granted to services could not be restored yet. This will be retried the next time you sign in — anything already restored is listed on the Nests page for review.'
    grant_remint_failed: 'The access you had granted to services could not be restored under your new identity yet: {reason}. This will be retried the next time you sign in.'
    # The aftermath's file corpus (identity-succession.md § Re-key scope, the
    # BackupKey corpus row) — the user's own files, photos and folders. Unlike
    # the four legs above, this one is NOT about something that stopped working:
    # a successor can already open all of it (the read fallback landed first), so
    # the copy must never say "unlocking" or imply the files are unreachable.
    # What is actually happening is that the last dependency on the retired
    # identity is being cut, which matters because until it is, losing every
    # device loses the corpus. User-facing wording therefore talks about files
    # moving across to the new identity.
    corpus_reseal_running: Moving your files across to your new identity…
    corpus_reseal_done: Your files are now held under your new identity.
    # The only aftermath line carrying numbers, deliberately: § Re-key scope asks
    # for progress, and this is the one leg whose corpus can be large enough that
    # an unqualified "still working" tells the user nothing. Progress is real AND
    # the pass is unfinished — both are true, so the line names the remaining
    # step rather than claiming completion.
    corpus_reseal_partly_owed: 'Moving your files across to your new identity: {done} done, {remaining} still to go. This continues on its own, and picks up where it left off each time you sign in.'
    # ⚠ Same rule as mls_reseal_owed_elsewhere: the ordinary state on a device that
    # never held the old identity's secret, NOT damage — and here the files are
    # demonstrably fine, since this very device can open them. Name the fix.
    corpus_reseal_owed_elsewhere: 'Your files are still held under your previous identity, and this device does not have the key to move them. Sign in on the device you used to take back your account, and it will finish there.'
    corpus_reseal_failed: 'Your files could not be moved to your new identity yet: {reason}. This will be retried the next time you sign in.'
    # The aftermath's mail leg (identity-succession.md § Re-key scope, the MSEK
    # row; mail-credentials.md § Rotation and recovery → Succession). The one
    # leg whose completion COSTS the user something, so the copy's whole job is
    # to name that cost before their mail apps do: every app password is dead
    # and each mail app has to be set up again. Deliberately says why in one
    # clause — whoever had the old identity also had those passwords — because
    # a user who reads this as a malfunction will go looking for the old
    # password to "fix" it. Receiving mail never stops, and the line says so:
    # the failure the user will otherwise infer is much larger than the real one.
    mail_burn_running: Replacing your mail keys, because your previous identity's passwords could open your mailbox…
    mail_burn_done: 'Your mail encryption key was replaced and your {count} mail app password(s) were revoked — whoever held your previous identity could have used them to read your mail. Your mailbox keeps receiving as normal, but each mail app needs setting up again with a new password from this page.'
    # The route to the filter list — the remedy the per-action succession ruling
    # named but nothing pointed at. It says WHAT survived, WHY that is worth a
    # look (a filter can quietly bin or divert mail, which is the harm a reader
    # would otherwise not connect to "filters"), and WHERE to go. Deliberately
    # not alarmist: these rules are usually the owner's own, and the page it
    # sends them to is where they keep or delete each one.
    inherited_filters: '{count} of your email filter rule(s) were set up before your account recovery and are still unchecked. A filter can silently bin or redirect incoming mail, so it is worth confirming you recognise each one — Settings ▸ Privacy ▸ Email Filters.'
    # ⚠ Name the retry — and name the exposure plainly, because unlike the
    # sibling legs an unfinished burn is the difference between a thief reading
    # the mailbox and not.
    mail_burn_failed: 'Your mail keys could not be replaced yet: {reason}. Until this finishes, anyone who had your previous identity can still read new mail. This will be retried the next time you sign in.'
    # The subscriber-tier half of the same exposure the mail lines describe.
    # The done line names the CONSEQUENCE that is not obvious — what the old
    # identity can and cannot still read — because the split is counter-
    # intuitive: posts published before the recovery stay readable to anyone who
    # had the old key (they must, or the author would lose their own back
    # catalogue), and only what is published afterwards is out of reach. A user
    # told merely that "keys were replaced" would reasonably assume the older
    # posts were protected too.
    tier_period_rotation_running: Replacing the keys your subscriber-only posts are locked with, because your previous identity could open them…
    tier_period_rotation_done: 'New posts to your {count} subscriber tier(s) are now locked with keys your previous identity never had. Your subscribers keep their access, and posts you published before taking your account back stay readable to them — and to anyone who had the old keys, which is why only new posts are covered.'
    # ⚠ Nothing failed here, which is exactly why it has to be said: the
    # aftermath otherwise reports a clean pass while the old key still opens
    # every new subscriber-only post. Names the remedy, since the user has no
    # way to discover one exists.
    tier_period_rotation_nest_too_old: 'The keys for your subscriber-only posts could not be replaced: this nest is too old to accept them. Until it is updated, anyone who had your previous identity can read the subscriber-only posts you publish from now on.'
    tier_period_rotation_partial: 'Keys were replaced for {count} of your subscriber tier(s), but {failed} could not be finished. Until they are, anyone who had your previous identity can read new posts to those tiers. This will be retried the next time you sign in.'
    tier_period_rotation_failed: 'The keys for your subscriber-only posts could not be replaced yet: {reason}. Until this finishes, anyone who had your previous identity can read the subscriber-only posts you publish from now on. This will be retried the next time you sign in.'
    # The aftermath's __drafts leg (succession-aftermath.md § Re-key scope, the
    # BackupKey corpus row, which names __drafts explicitly). Every compose
    # surface — posts, conversations, events — saves half-written text to its
    # own rail, still sealed to the retired identity, so until this runs the
    # successor's composers come up empty and their unsent text is unreadable.
    # ⚠ User-facing wording says "drafts" and "unsent", never "rails" or
    # "__drafts": the rail is the mechanism, an empty composer is what they
    # would notice. The lines deliberately avoid alarm — nothing is lost here,
    # it is locked, and every arm that is still owed names the one action that
    # unlocks it.
    drafts_reseal_running: Recovering your unsent drafts under your new identity…
    drafts_reseal_done: Your unsent drafts are available again under your new identity.
    # Partially applied: this device recovered the rails it could, but at least
    # one was sealed by an identity whose key it does not hold (a
    # twice-succeeded chain). Progress was real AND the pass is unfinished —
    # both are true, so the line names the remaining step rather than claiming
    # completion. Same rule as mls_reseal_partly_owed_elsewhere.
    drafts_reseal_partly_owed_elsewhere: 'Some of your unsent drafts are still held under a previous identity that this device cannot unlock. Sign in on the device you used to take back your account, and it will finish there.'
    # ⚠ Same rule as mls_reseal_owed_elsewhere: the ordinary state on a device that
    # never held the old identity's secret, NOT damage. Name the fix, and say
    # the drafts are safe — an empty composer reads as data loss otherwise.
    drafts_reseal_owed_elsewhere: 'Your unsent drafts are still held under your previous identity, and this device does not have the key to unlock them. They are safe. Sign in on the device you used to take back your account, and it will finish there.'
    drafts_reseal_failed: 'Your unsent drafts could not be recovered yet: {reason}. They are safe, and this will be retried the next time you sign in.'
