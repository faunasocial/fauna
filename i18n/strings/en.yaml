# Nests page (renamed from `linked_nests` when the v1 nest-trust facet lands —
# docs/goal/ui/nests.md). The trust-facet strings are net-new; the `linked_nests`
# block below is kept until the per-app rename moves the linking strings here
# and switches S.linked_nests.* references to S.nests.*. Vocabulary: "trust" /
# "trusted to read …" — NEVER "capability"/"grant" (participants.md § Naming).
nests:
  title: Nests
  # Per-nest Now/History lens toggle (nest-trust-view-now / -view-history)
  view_now: Now
  view_history: History
  # Empty state for a nest holding no grants (nest-trust-empty)
  not_trusted: This nest is not trusted to read any of your content.
  # participant-escrow-holder-badge (T16; participants.md § Roles) — trust
  # vocabulary, derived from recorded escrow receipts.
  escrow_holder_badge: Holds your recovery escrow
  # ── T16 custody rows (nests.md § Trust facet — custody rows): one row per
  # custodian NEST holding sealed copies under a keyless custody grant (the
  # nest-custodian identity fact, ruled 2026-08-17). The shared custody copy
  # (receipt states, held-bytes, revoke + honest bound, scope line) reuses the
  # devices.custody_* strings — stated once, rendered on both pages.
  custody_nest_label: "{host}'s nest — trusted to hold sealed copies"
  # A current grant (nest-trust-grant-*)
  trusted_to_read: 'Trusted to read:'          # nest-trust-grant-scope prefix
  # Content-kind labels for a grant's scope line — the per-app shell maps the
  # (class, kind) scope tuple to one of these (priority #2: one scope shape,
  # shell-side localized labels). content.read{mail|calendar|post}.
  # The mail-scope copy MUST name the derived-artifact reach (mail-spam.md
  # § Training-sample retention → Grant-reach + consent interaction, ratified
  # 2026-07-13): the same key also opens the spam-filter model + training
  # history — a crypto fact, so the grant-log consent copy says so.
  scope_mail: Mail — and the spam-filter model and training history derived from it
  scope_calendar: Calendar
  scope_posts: Posts
  # content.label-write (bundled into the Mail mint option) — never render the
  # raw scope-class string in a grant row.
  scope_spam_labels: Write spam labels
  # The PER-LABELER mail grant a community-labeler subscription over mail
  # mints (content-moderation-and-ranking.md § Tier-3 → Subscribing = minting
  # a capability; nests.md § Trust facet — grants → the per-labeler grant):
  # the same mail key, confined to running ONE labeler — so the row must name
  # that labeler and never read as a second anonymous mail grant. {labeler} is
  # the labeler's short id (value-formatting.md § Short id). Vocabulary:
  # trust, never capability/grant.
  scope_mail_labeler: 'Mail — only to run community labeler {labeler} over it'
  scope_labeler_labels: 'Write labels for community labeler {labeler}'
  # content.read{spam-model} — the keyless grant the spam page's "Contribute to
  # deployment spam baseline" switch mints: it lets the nest fold your filter's
  # training into the shared starting point, and opens no mail.
  scope_spam_model: Your spam-filter training, for the shared spam baseline
  # A tier-scoped post grant names WHICH tier's posts the nest may read — two
  # tiers must stay distinguishable in the audit view.
  scope_posts_tier: 'Posts — {tier}'
  # content.read{folder} on a connected app's grant (webdav-server.md § Key
  # model → A principal's read): the folder it may read, by the owner's own
  # name — or that the folder has since been deleted.
  scope_folder: 'Your folder "{folder}"'
  scope_folder_deleted: A folder you have since deleted
  lasts_until: 'Trusted until:'                 # nest-trust-grant-lasts-until prefix
  # Liveness status (nest-trust-grant-status)
  status_active: Active
  status_expiring: Expiring soon
  status_expired: Paused — renew to resume
  status_auto_renewing: Auto-renewing
  renew: Renew                                 # nest-trust-grant-renew
  revoke: Revoke                               # nest-trust-grant-revoke
  # The post-succession review pair (nest-trust-grant-unattested-mark +
  # nest-trust-grant-keep-button), rendered only on a row the aftermath carried
  # across from a retired identity and the owner has not adjudicated
  # (identity-succession.md § Adjudicating what the aftermath carries across).
  # Must read as REVIEW, never accusation: after a recovery almost every row
  # here is the owner's own. Trust vocabulary only — never "capability"/"grant"
  # in visible copy (participants.md § Naming), which is why this says "this
  # access" rather than naming the grant.
  grant_unattested_mark: >-
    Given before you recovered this account — still active. Keep it, or revoke it
    if you don't recognise it.
  grant_keep_button: Keep                      # nest-trust-grant-keep-button
  # REQUIRED honest-bound copy, standing-keyed regime = every content kind today
  # (nest-trust-grant-bound-note). Must not over-promise past the honest bound.
  bound_note_standing: >-
    On an honest nest, revoking stops future access and re-acquisition. It cannot
    un-see what was already read, and does not yet block content arriving after
    revocation.
  # REQUIRED honest-bound copy for a BOUNDED mail grant (content-sealing epochs,
  # nest-trust-grant-bound-note) — the stronger, crypto-bounded wording nests.md
  # § Honest bound reserves for an epoch-sealed kind, WITH the honest INFO-A
  # caveat: the window is real but not exhaustive (a bounded grant reads its
  # window's epoch set, not necessarily everything sealed in [t1,t2]) and the
  # window's end is epoch-granular, not to-the-second. Rendered only when
  # `is_bounded_mail_grant` — every other kind/regime keeps bound_note_standing.
  bound_note_bounded_mail: >-
    This trust is cryptographically time-boxed: once its window ends (accurate
    to within about a week), this nest can no longer read new mail at all — not
    even by re-acquiring a key. Within the window it can only open mail sealed
    under that period's rotating keys, so content sealed before the schedule
    caught up may still be unreadable to it.
  # Grant-event history rows (nest-trust-history-item), most-recent-first
  history_minted: 'Trusted to read {scope} · {when}'
  history_renewed: 'Trust renewed: {scope} · {when}'
  history_revoked: 'Trust revoked: {scope} · {when}'
  # ── Backup trust rows (nest-trust-backup-item, ratified 2026-07-24;
  # nests.md § Trust facet — backup rows). Two row kinds, both on the HOME
  # nest's row: the seal grant (this nest may seal and upload your backups)
  # and one row per destination (this nest may write your backups there).
  # Vocabulary: trust, never capability/grant.
  backup_scope_seal: Backs up your messages for you
  backup_scope_writer: 'Writes your backups to {destination}'
  backup_since: 'Trusted since:'               # nest-trust-backup-since prefix
  # Row state (nest-trust-backup-status). "Unreachable" means we could not ask
  # the destination — deliberately NOT the same as the trust being gone.
  backup_status_active: Active
  backup_status_unreachable: Could not reach this destination
  backup_status_missing: Not set up to accept your backups
  backup_revoke: Stop backing up                # nest-trust-backup-revoke
  # REQUIRED honest-bound copy (nest-trust-backup-bound-note). Both rows freeze
  # only FUTURE writes — backups already stored stay where they are until the
  # destination reclaims them, and this copy must never imply otherwise.
  backup_bound_note_seal: >-
    Stopping this means your nest can no longer make new backups of your
    messages. Backups it already made stay where they are until the box holding
    them clears them out.
  backup_bound_note_writer: >-
    Stopping this means your nest can no longer send new backups to this
    destination. Backups already stored there stay until that box clears them
    out. You can stop it here even if your own nest is misbehaving.
  # ── Retained backup generations (nest-trust-generation-item, ratified
  # 2026-07-29; nests.md § Trust facet — generation recovery). Rendered on the
  # HOME nest's row after the backup rows: what the owner can roll back to once
  # they have revoked a rogue source. Vocabulary: version/restore, never
  # "generation" (an internal word) and never capability/grant.
  generation_path: 'Backup of {path}'
  # A sealed or rogue-source custody row has no plaintext path, so
  # the shell renders the hash — the row is NEVER hidden (nests.md:123).
  generation_path_unknown: 'Backup {hash}'
  generation_superseded: 'Replaced:'            # nest-trust-generation-superseded
  # REQUIRED quota-bound copy (nests.md § Required copy — the quota bound):
  # retained versions are charged against the owner's storage for the WHOLE
  # window, so a user near their cap can see usage a supersede storm inflated
  # until T elapses. This is the surface where that is explicable rather than
  # mysterious, so the bound rides the deadline leaf.
  generation_expires: >-
    Can be restored until {when}, and counts against your storage until then
  # Row state (nest-trust-generation-status). "Could not reach" is deliberately
  # NOT the same as "nothing to restore" — collapsing them is the false
  # reassurance this whole surface exists to prevent (nests.md:122).
  generation_status_listed: Can be restored
  generation_status_unreachable: Could not reach this destination
  generation_restore: Restore this version      # nest-trust-generation-restore
  # Outcome copy. "Past the recovery window" is a PRODUCT STATE, not a failure —
  # the version aged out or never existed, and saying "restore failed" would
  # send the user hunting a bug that is not there (nests.md:124).
  generation_restored: That version has been restored.
  generation_past_window: >-
    That version is past the recovery window, so it can no longer be restored.
  # ── Mint flow (scope-first picker, ratified 2026-07-13; nests.md § Mint).
  # nest-trust-grant-mint-button / -mint-scope-select / -mint-holder-select /
  # -mint-confirm-button. Option labels are use cases, one per
  # LinkedNestRow.mint_options entry; the paywalled option carries the tier via
  # a named placeholder. Vocabulary: trust, never capability/grant.
  mint_button: Add trust…
  mint_scope_placeholder: Choose what to trust it with…
  # Mint-time consent copy for the mail scope MUST name the derived reach
  # (same ruling as scope_mail above).
  mint_option_mail: Read and filter my mail — and the spam-filter model and training history derived from it
  mint_option_calendar: Read my calendar
  mint_option_paywalled: 'Serve paywalled posts — {tier}'
  # Conditional holder pick — only when >1 holder could take the chosen scope.
  mint_holder_placeholder: Which service on this nest?
  # How long the new trust lasts (nest-trust-mint-duration-select; nests.md
  # § Expiry / renewal → Duration and blessing). Two hard-coded windows.
  mint_duration_one_off: For a few hours
  mint_duration_standard: For 90 days
  mint_confirm: Trust
  # The per-nest blessing (nest-trust-blessed-toggle): a blessed box's 90-day
  # trust renews itself while you use Fauna.
  blessed_toggle: Keep this box's trust renewed
  # ── Linking half (add / list / unlink) — unchanged behavior, owned by
  # linked-nests.md. Migrated here from `linked_nests:` so an app on the
  # renamed Nests page uses `S.nests.*` for both halves. `linked_nests:` below
  # stays until all seven apps migrate (then it is deleted). `title` is NOT
  # duplicated — `nests.title` ("Nests") above is the renamed rail label.
  description: Nests you have linked to sync your account's content.
  empty: No linked nests yet.
  add_button: Link a nest
  authorize_subtitle: Authorize one of your nests to sync this account
  add_input_placeholder: Nest address (https://…) — links both ends — or a 64-hex identity
  nest_to_link: Nest to link
  add_submit: Link
  add_cancel: Cancel
  list_title: Your linked nests
  unlink: Unlink
  capabilities_label: 'Syncs:'
  # What the capabilities line shows for the `account_replica` capability
  # (linked-nests.md § The surface): the linked nest keeps a sealed copy of
  # the account plane, which is what lets it serve recovery of a lost box.
  # One item of a comma-joined list, so lower-case. The other capabilities
  # still show their wire names.
  capability_account_replica: sealed copy of your account settings
  expiry_label: 'Expires:'
  expiry_never: Never expires
  # Linking by address is refused because the two nests hold recovery-key
  # histories of which neither continues the other (identity-succession.md
  # § Enforcement on the home nest → Every nest the identity is linked to).
  # Shown in the page's error-message; nothing was written at either nest.
  link_recovery_keys_differ: These two nests hold different recovery keys for this account, so they can't be linked.
  # ── Forward queue (nests-forward-*, ruled 2026-09-23; private-mode.md § Post
  # Forwarding → the queue is the user's to see; ui/nests.md § Forward queue).
  # Page-level, rendered only while this nest holds posts of yours it could
  # not yet hand to its relay. "Relay" is the user word for the linked
  # internet nest a home nest forwards through (nest-relay-setup.md).
  forward_queue_summary: '{count} of your posts are waiting to reach your relay.'
  # The stuck half: refused past the whole retry backoff. Says what to check
  # — the relay-side permission is the one thing the home nest cannot see.
  forward_queue_stuck: >-
    {count} of them have been refused for more than eight hours. Check that
    this nest is allowed to forward your posts on the relay — linking the relay
    again from here grants that — or stop forwarding them below.
  # The nest's own record of the latest failed attempt, verbatim.
  forward_queue_last_error: 'Last attempt failed: {error}'
  forward_retry: Retry now                     # nests-forward-retry-button
  forward_discard: Stop forwarding these       # nests-forward-discard-button
linked_nests:
  title: Linked nests
  unlink: Unlink
logs:
  title: Logs
  description: >-
    Recent activity recorded on this device, newest first. No message contents
    or secrets are ever logged — only what happened, when, and where.
  filter_label: Severity
  filter_all: All
  level_error: Error
  level_warn: Warn
  level_info: Info
  level_debug: Debug
  level_trace: Trace
  copy_button: Copy
  clear_button: Clear
  empty: No log entries yet.
mail_settings:
  title: Mail & Calendar
  keys_info: >-
    Your mail is protected by an encryption key held on your Fauna devices.
    Each app password or token you add unlocks that same key for one email
    app (Thunderbird, Apple Mail, …). Rotate your keys if a password or token
    may have leaked, or if a device that had your mail set up was lost or
    stolen — rotating replaces the key so the exposed credential can no longer
    read your mail (messages you've already received stay readable). If you're
    just retiring an app you no longer use, revoke that one credential
    instead — you don't need to rotate.
  # Shown where the credential rows used to be, on an app whose Connected
  # apps page lists them (connected-apps.md § Layout & flow).
  credentials_on_connected_apps: 'Your app passwords are listed under Settings → Connected apps — copy, reveal or disconnect each one there.'
  serve_here_label: Serve my mail & calendar over IMAP/CalDAV on this nest
  serve_here_subtitle: >-
    When on, this nest answers IMAP and CalDAV for your mailbox so email and
    calendar apps can connect here. Turn it off if you read your mail on a
    different nest — your own Fauna apps are unaffected either way.
  # The Forwarding section (mail-forwarding.md § Per-account "forward all",
  # § Per-account forward rate-limit). The draft-check sentences are rendered
  # by the shared `fauna_client_bridges::forward_settings` parsers, so every
  # app shows the same words before the round trip.
  forwarding_title: Forwarding
  forward_all_to_label: Forward all incoming mail to
  forward_all_to_subtitle: >-
    Every message you receive is also sent on to this address, and you keep
    your own copy. Clear the field to stop forwarding.
  forward_per_hour_label: Hourly forwarding limit
  forward_per_hour_subtitle: 'The most messages forwarded for you in one hour, up to {ceiling}. Past the limit, forwards wait for the next hour.'
  forward_all_to_invalid: That doesn't look like an email address.
  forward_per_hour_not_a_number: Enter the hourly forwarding limit as a whole number.
  forward_per_hour_zero: The hourly forwarding limit must be at least 1.
  forward_per_hour_above_ceiling: 'The hourly forwarding limit can''t be more than {ceiling}.'
web_settings:
  title: Web
  subdomain_toggle_label: Publish my website
  subdomain_toggle_subtitle: >-
    When on, this nest serves your Web files and web-published posts at your
    personal address. Off by default.
  subdomain_url_label: "Your site"
  subdomain_no_handle: Set a handle first to get a personal web address.
  subdomain_reserved: Your handle is a reserved name and can't host a website.
  subdomain_no_serving_domain: >-
    This nest has no web address yet, so it can't serve websites. An admin needs
    to give it a domain first.
  # Painted only while the nest has taken the rendered pages down after a
  # failed render (web-content-hosting.md § Routing, render, serving → A blanked
  # site tells its author). Information only — there is no action to offer.
  render_status_down: >-
    Your published pages are temporarily unavailable. This nest is restoring
    them by itself — there is nothing you need to do. Synced files are not
    affected.
  content_info: >-
    Add content by turning on a folder's website toggle under Settings →
    Folders, or by publishing individual posts to the web.
  # The Published-posts management section (web-content-hosting.md
  # § Published-post management). `paywall_link_note` carries the ratified
  # ~10-minute validity statement (monetization.md § Pillar 2 → Creator comp-link
  # surface) — the surface states the TTL rather than offering a knob, and points
  # at the claim code as the durable alternative.
  published_posts_title: Published posts
  published_posts_empty: No published posts yet
  published_post_gated_badge: 'Paid: {tier}'
  # The three reasons published content has no public address, shown in place of
  # the copy affordances rather than handing out a link that cannot load
  # (web-content-hosting.md: "legal but unreachable — the UI must say so").
  link_disabled_subdomain_off: >-
    Turn on "Publish my website" above to get links you can share.
  link_disabled_no_handle: >-
    Set a handle first — your published posts need a web address before they can
    be linked to.
  link_disabled_reserved: >-
    Your handle is a reserved name, so your published posts have no public
    address to link to.
# The web-publishing verb family (web-content-hosting.md § Published-post
# management). ONE home for the labels, because the family renders on TWO
# surfaces — the feed's per-post ⋯ overflow and the web-settings Published-posts
# section — and a second copy under `feed:` is how the two would drift apart as
# the six trickle-down apps adopt them.
#
# Only the surface-INDEPENDENT strings live here. The "why is there no link"
# reasons stay per-surface (`web_settings.link_disabled_*`), because that copy is
# deictic: the settings section can say "the toggle above", a feed menu cannot.
web_publish:
  publish_to_web: Publish to web
  # One tap, no confirm step: a takedown is idempotent and reversible, unlike
