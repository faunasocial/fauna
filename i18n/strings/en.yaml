    # The OAuth issuer's two signers (admin-nest-oauth-*; authorization-server.md
    # § The issuer → Two rotation arms). User-facing words are "sign-in key" and
    # "saved sign-in", never "issuer", "JWKS" or "refresh token". Every sentence
    # below is picked by the shared fauna_client_admin folds, so all 7 apps say
    # the same thing — the forced arms' confirms state their cost BEFORE
    # dispatch, and a failure never claims nothing changed (a reply lost to a
