    # (identity-succession.md § Propagation → MLS groups).
    #
    # ⚠ Must read as REVIEW, never accusation, and the reason is sharper here
    # than on the backups or trust planes: after a recovery almost EVERY honest
    # correspondent lands on this list, because the ceremony can vouch for
    # nobody it did not itself add. Copy that framed these people as suspects
    # would accuse the user's own friends after every successful recovery.
    # It also must not say what happened to the account in the third person —
    # the reader here is the owner, and "recovered" is their own act.
    member_unattested_mark: >-
      Was in this group before you recovered your account. Keep them, or remove
      them if you don't recognise them.
