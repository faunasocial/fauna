# The AT Protocol settings page (ui.yaml page `atproto`, ui/atproto.md): the
# integration-depth selector, the hosted-identity panel, the recovery-fork
# contest, the delete ceremony, and the login-plane surface (app credentials,
# connected apps, the external-apps kill-switch, the authoring delegation,
# OAuth consent — atproto-pds-full.md § App surface). The `error_*` strings
# are the page-level error-message strings the shared AtprotoSettingsMachine
# emits (libs/fauna-atproto-settings-machine), localized client-side from the
# snapshot's `error` LocalizedText. Mint collects no label/dm_allowed input —
# auto-labeled via default_credential_label.
atproto_settings:
  title: AT Protocol
  app_credentials_heading: App credentials
  app_credentials_empty: No app credentials yet.
  mint_button: New app credential
  default_credential_label: 'App credential {count}'
  reveal_button: Reveal
  revoke_button: Revoke
  credential_created_prefix: 'Created {date}'
  credential_last_used_prefix: 'Last used {date}'
  credential_never_used: Never used
  connected_apps_heading: Connected apps
  connected_apps_empty: No connected apps yet.
  session_created_prefix: 'Connected {date}'
  session_expires_prefix: 'Expires {date}'
  # The OAuth half of a connected-apps row (the grant joined onto the session).
  # `session_last_used_prefix` is deliberately worded as an observation rather
  # than a guarantee: the nest stamps it only on a refresh rotation, so a recent
  # value proves use and an old one proves nothing (atproto-pds-full.md
  # D10 § Audit — advisory, not forensics).
  session_scopes_prefix: 'Approved for {scopes}'
  # Provenance for a grant made from a PERMISSION SET — a named bundle the app
  # asked for instead of listing permissions, defined by whoever published it.
  # `session_scopes_prefix` above already lists every permission the grant
  # actually carries (a set contributes ordinary permissions and they are all
  # in it), so this line answers the question that list cannot: which bundle,
  # and whose. The NSID rides beside the publisher's title for the same reason
  # the client_id rides beside the client's name — the title is written by the
  # party being vouched for.
  session_sets_prefix: 'Granted via {sets}'
  session_set_named: '“{title}” ({nsid})'
  session_last_used_prefix: 'Last seen {date}'
  session_never_used: Not seen since connecting
  # Liveness of one connected app (`atproto-connected-app-status`). Worded like
  # the delegation row's `delegation_status_*` family above: the state, then what
  # it means for the user, so a suspended app reads as recoverable rather than
  # as silent feature loss. The suspended wording deliberately says the approval
  # SURVIVES — the matrix keeps the grant listed and revocable, and turning
  # Bluesky back on restores it with nothing more to do.
  session_status_live: Working
  session_status_suspended: Paused — turn Bluesky back on to let this app work again
  external_apps_toggle: Allow external apps
  # ── Integration-depth selector (ui/atproto.md § Layout & flow). Shared
  #    across all apps. The per-effect transition-card lines + the greyed
  #    hosted reason are machine-composed under atproto_settings.* (card_* /
  #    gate_reason) — these are the static selector chrome only.
  depth_heading: Integration depth
  depth_off_title: 'Off'
  depth_off_desc: No Bluesky presence.
  depth_linked_title: Linked account
  depth_linked_desc: Read, interact, and cross-post through an existing Bluesky account.
  depth_hosted_visible_title: 'Hosted here — visible'
  depth_hosted_visible_desc: This nest holds your identity and publishes your public posts to the Bluesky network.
  depth_hosted_full_title: 'Hosted here — full access'
  depth_hosted_full_desc: Additionally, other Bluesky apps can log in as you through this nest.
  # The transition card (atproto-depth-confirm-card): the per-effect lines come
  # from the machine; these are the card's own chrome.
  depth_card_heading: Confirm this change
  depth_confirm_button: Confirm
  depth_cancel_button: Cancel
  # The recovery-fork contest ceremony's own chrome (atproto-contest-*, IDs
  # user-approved 2026-08-02). The card's BODY is machine-composed under
  # atproto_settings.contest_* — these are the static labels only. The card
  # renders above the depth selector: an identity under attack outranks every
  # settings row below it (ui/atproto.md § Element IDs).
  contest_card_heading: Your AT Protocol identity may have been taken over
  contest_button: 'Undo this change…'
  contest_confirm_button: Undo it now
  contest_cancel_button: Not now
  # The hosted panel — DID-method radio (pre-mint) + identity summary (post-mint).
  did_method_heading: Identity method
  did_method_plc_title: 'did:plc — recommended'
  did_method_plc_desc: A portable identity you can move to another server later.
  did_method_web_title: 'did:web'
  did_method_web_desc: Ties your identity to this nest's domain.
  handle_either_way: 'Your Bluesky handle will be @{handle} either way.'
  history_backfill_label: Also publish my existing public posts.
  hosted_handle_prefix: 'Your Bluesky handle: @{handle}'
  hosted_method_prefix: 'Method: {method}'
  identity_status_active: Active
  identity_status_pending: Setting up…
  identity_status_deactivated: Deactivated
  # The two terminal statuses. `deleted` became reachable in-product when the
  # delete ceremony landed (before that no app could destroy a presence);
  # `tombstoned` is slice 5b's terminal identity retirement.
  identity_status_deleted: Deleted
  identity_status_tombstoned: Permanently retired
  delete_presence_button: Delete my Bluesky presence
  # The delete ceremony's own two controls (atproto-delete-confirm /
  # atproto-delete-cancel). The confirm names the act rather than saying "OK",
  # so a user who skimmed the card still reads what the button does.
  delete_confirm_button: Delete my presence
  delete_cancel_button: Keep my presence
  # The ceremony's terminal opt-in (atproto-delete-tombstone). Never pre-ticked;
  # the label itself carries "cannot be undone" so a user who ticks it without
  # reading the card still reads what it does.
  delete_retire_identity_label: Also permanently retire my AT Protocol identity — this cannot be undone
  # ── The D10 authoring-delegation row (atproto-pds-full.md § App surface;
  #    IDs user-approved 2026-07-29). USER VOICE RULE, same as atproto_settings.
  #    error_authorize above: say "post as you", never "delegation", "cert" or
  #    "sub-key" — the mechanism is not the user's concept. The window is
  #    hard-coded (~90 days) and there is deliberately NO duration chooser, so
  #    no string here offers one.
  delegation_heading: Posting from other apps
  # The empty state: no delegation provisioned. External apps can log in and
  # read, but any write is refused — say the consequence, not the mechanism.
  delegation_empty: Other Bluesky apps can sign in, but cannot post as you yet.
  # capabilities, in user voice — DelegationRow.capabilities carries the wire
  # spellings ("Post", "UpdateProfile"), which are never rendered raw.
  delegation_scope_prefix: 'Allowed: {capabilities}'
  delegation_capability_post: post
  delegation_capability_update_profile: update your profile
  # An unrecognized capability spelling from a newer nest degrades to its wire
  # form rather than vanishing — the row stays honest about what was granted.
  delegation_lasts_until: 'Authorized {authorized} · until {expires}'
  delegation_lasts_until_no_expiry: 'Authorized {authorized} · no expiry'
  delegation_status_active: Active
  delegation_status_expiring_soon: Expiring soon — re-authorize to keep other apps posting
  delegation_status_expired: Expired — other apps can no longer post as you
  delegation_status_never_expires: No expiry
  # ADVISORY last-use hint on the delegation row (atproto-delegation-last-used;
  # atproto-pds-full.md § D10 → Audit). Deliberately hedged wording: unlike every
  # other value on this row it is NOT derived from the signed cert — the nest
  # simply asserts it — so it must never read as proof. In particular
  # "not used yet" must not read as "no app has ever posted as you": a nest that
  # under-reports is exactly what this value cannot detect. The real audit
  # surface is the delegated-origin badge on the feed, which IS verified from
  # signed bytes; the second line points there so a user who cares is not left
  # trusting this one.
  delegation_last_used: 'Last reported use: {when}'
  delegation_last_used_never: No use reported yet
  delegation_last_used_hint: Reported by your nest, so treat it as a hint — check your feed for posts marked "Via connected app" to see what was actually written.
  # ONE control for both first grant and renewal: provisioning overwrites the
  # stored authorization, so re-authorizing IS the renewal gesture and never
  # requires a revoke first.
  delegation_authorize_button: Let other apps post as me
  delegation_reauthorize_button: Re-authorize
  delegation_revoke_button: Stop other apps posting as me
  # ── The OAuth consent approval card (atproto-consent-*; atproto-pds-full.md
  #    § F4 detail — Consent ceremony wire flow). An app somewhere is waiting
  #    on this answer, so the card leads the full-PDS panel.
  #
  #    The user's whole job is the code comparison, and the wording says so
  #    plainly: that comparison is what binds THIS browser tab to THIS
  #    approval, so a consent push the user did not start shows a code their
  #    browser is not showing, and is visibly wrong.
  consent_heading: An app wants to sign in as you
  # `name` is the client's name from its own resolved metadata document, and
  # `client_id` is the URL that document was served at — rendered verbatim,
  # because that URL is the client's identity and nothing else here can vouch
  # for the name.
  consent_client: '{name} — {client_id}'
  consent_client_unnamed: '{client_id}'
  consent_code: 'Confirmation code: {code}'
  consent_code_hint: Approve only if your browser is showing this same code.
  consent_scopes_heading: 'It is asking to:'
  # A permission set is a named bundle of permissions the client asked for by
  # NAME instead of listing them: the client says `include:com.example.appPerms`
  # and the set's publisher decides what that covers. So the card must show two
  # things a plain scope line never needs — WHO defined the bundle (the NSID,
  # verbatim, because the set's own title is written by that same publisher and
  # vouches for nothing), and what it actually expands to. The set's
  # description never stands in for the expansion.
  #
  # `title` is the publisher's own label; the unnamed form is used when the
  # published set declared none, and shows the identity alone rather than an
  # invented name.
  consent_set_heading: 'Some of that comes from “{title}” ({nsid}):'
  consent_set_heading_unnamed: 'Some of that comes from {nsid}:'
  consent_approve_button: Approve
  consent_deny_button: Deny
  error_refresh: 'Failed to load app credentials: {message}'
  error_mint: 'Failed to create the app credential: {message}'
  error_revoke: 'Failed to revoke the app credential: {message}'
  error_revoke_session: 'Failed to disconnect the app: {message}'
  error_toggle: 'Failed to change external app access: {message}'
  # The D10 authoring delegation (atproto-pds-full.md § D10): what lets an
  # external Bluesky app post as this account. User-facing wording is
  # "authorize", never "delegation cert" or "sub-key" — the mechanism is not
  # the user's concept.
  error_authorize: 'Failed to let external apps post as you: {message}'
  error_deauthorize: 'Failed to stop external apps posting as you: {message}'
  # This app build has no identity key wired, so it cannot sign the
  # authorization. Reading and revoking still work — only granting does not.
  error_no_identity: 'This app cannot authorize posting from external apps. Use another of your devices to turn it on.'
  # The stored authorization does not verify under this account's identity key
  # — it is not something this account signed. Deliberately alarming wording:
  # the row is hidden rather than shown, so nothing on screen implies a grant
  # the user cannot be shown to have made.
  error_delegation_untrusted: 'The stored authorization for external apps was not created by this account, so it is not being shown. ({message})'
  # The partial-success case: the credential IS live and the secret was just
  # shown, but this device could not store its own copy — so it will not be
  # revealable again later. Recovery is to revoke it and create another.
  error_save_local: 'Created, but this device could not save a copy — copy the password now, it cannot be shown again later. ({message})'
  # The depth selector (ui/atproto.md § Layout & flow). A transition failure
  # keeps the card open; retry is safe (§ Errors & edge cases).
  error_transition: 'Failed to change the Bluesky integration level: {message}'
  # The greyed hosted options' reason line — shown, never hidden (§ Reveal/
  # greying rules): says why and what would change it.
  gate_reason: 'Hosting an AT Protocol identity needs a public domain — this nest is reachable at "{domain}", which the Bluesky network cannot resolve. Claim a real domain to enable these options.'
  # The same line for the pre-fetch window, where the gate is closed (the safe
  # default) but the nest has not been asked yet, so there is no domain to name.
  # Without this the two hosted rungs paint greyed with no reason at all — the
  # one state `gate_reason` could not cover.
  gate_reason_pending: Checking whether this nest has a public domain — hosting an AT Protocol identity needs one.
  # The transition card's copy — one line per effect, composed by the shared
  # machine from the same TransitionPlan the nest executes (single-source:
  # the card can only ever promise what the nest actually does).
  card_unlink: 'The link to {account} is removed. The external account itself is untouched — it keeps existing on its own server and is not migrated.'
  card_mint: 'A new public identity {handle} is created on the Bluesky network.'
  card_reactivate: 'Your identity {handle} is restored — the same identity you had before, nothing new is created.'
  card_publish_consent: 'Your public posts become visible to everyone on the Bluesky network.'
  card_deactivate: 'Publishing stops and the network no longer serves your profile or posts. Your identity is kept — re-enabling restores it exactly.'
  card_no_recall: 'Copies of already-published posts held by other servers cannot be recalled.'
  card_delete_pointer: '"Delete my Bluesky presence" below is the separate, stronger action.'
  card_open_plane: 'Third-party Bluesky apps will be able to log in as this identity once you create an app credential.'
  card_dm_honesty: 'Bluesky direct messages are not end-to-end encrypted and pass through this nest in transit.'
  card_suspend_plane: 'Connected apps stop working immediately. Nothing is deleted — your app credentials stay listed, and stepping back up restores them.'
  # The "Delete my Bluesky presence" confirm card (ui/atproto.md § User actions
  # row 4). USER VOICE + an honesty rule that outranks brevity: the sweep is
  # reversible in IDENTITY terms (atproto-pds-bridge.md § Disable & revocation
  # layer 2), so delete_confirm_identity_kept must keep saying the identity
  # survives and naming it — without that line the ceremony reads as "delete my
  # account" and collects consent for something stronger than what runs. The
  # honest caveat is card_no_recall above, reused rather than re-worded.
  delete_confirm_sweep: 'Every post published to Bluesky is deleted, and the network is told to remove them.'
  delete_confirm_identity_kept: 'Your AT Protocol identity @{handle} is kept. This removes what you published, not who you are — turning AT Protocol hosting back on later restores the same identity.'
  delete_confirm_apps_disconnected: 'Bluesky apps you are signed in to are disconnected, and other apps can no longer post as you.'
  delete_confirm_level_off: 'Your Bluesky setting returns to Off.'
  # REPLACES delete_confirm_identity_kept while the atproto-delete-tombstone
  # opt-in is ticked (S5 slice 5b) — never shown beside it. It must say, in
  # those words, that the act is permanent and cannot be undone: every other
  # destructive control on the page is reversible, this one is not.
  delete_confirm_identity_retired: 'Your AT Protocol identity @{handle} is also permanently retired once the deletion finishes. This cannot be undone: the identity stops existing on the Bluesky network, and no one — not you, not this nest — can ever restore it. Turning AT Protocol hosting back on later creates a new, different identity.'
  # The opt-in greyed, with why (never a control that errors on press).
  delete_retire_unavailable_web: 'This identity is tied to your domain, so there is no separate record to retire — it ends when your domain stops serving it.'
  delete_retire_unavailable_unpublished: 'This identity has not been published yet, so there is nothing to retire.'
  # The sweep call itself failed to reach the nest — nothing was deleted, the
  # card stays open and trying again is safe (the kind is idempotent).
  error_delete_presence: 'Could not delete your Bluesky presence: {message}'
  # There is nothing left to delete — the presence is already gone. A page can
  # only reach this by rendering the button off a stale snapshot; refusing
  # loudly beats a confirm that could only do nothing.
  error_nothing_to_delete: There is no Bluesky presence left to delete.
  # The OAuth consent ceremony (atproto-pds-full.md § F4 detail). The answer
  # itself failed to reach the nest — the request is untouched, retry is safe.
  error_consent: 'Could not send your answer: {message}'
  # There was no live request to answer. ONE string for all three causes
  # (answered on another device / expired / not this account's), deliberately:
  # the nest decides them inside a single UPDATE's WHERE clause and reports one
  # `resolved: false`, so naming a cause here would be this app inventing a
  # distinction the wire refuses to draw.
  error_consent_gone: 'That request is no longer waiting for an answer — it may have expired, or you may have already answered it on another device. Start the sign-in again from the app that asked.'
  # The 72 h recovery-fork contest (atproto-pds-bridge.md § State & data shape).
  # Composed by the machine from the plan it re-derives off the public
  # directory's own log — never from anything the nest says, so the card stays
  # truthful when the box denies the identity.
  #
  # The three detail lines are the three honest states of ui/atproto.md's
  # `atproto-contest-card` `state` attribute, in the same order.
  # ⚠ The wording is deliberately precise about what undoing does NOT do. The
  # fork keeps the nest's publishing key on purpose (atproto-pds-bridge.md
  # § State & data shape, decision 3 — "identity authority is severed,
  # availability is not"), so a user who read "you take control" and stopped
  # there would believe a compromised nest had been fully evicted. It has not:
  # it can still author posts. Never shorten this line past that sentence.
  contest_detail_contestable: 'A change to your AT Protocol identity {handle} was made with a key this device does not hold. You can undo it: the change and everything built on it are reversed, and afterwards only your own keys can change who controls this identity. Your posts and profile keep working through this nest — which also means it keeps the key it uses to publish them, so it could still post as you. Undoing the change does not take that key away; replacing it is a separate step.'
  contest_detail_window_closed: 'A change to your AT Protocol identity {handle} was made with a key this device does not hold, and the time limit for undoing it has passed. The change now stands permanently. Contact whoever runs your nest.'
  contest_detail_genesis: 'Your AT Protocol identity {handle} was created with a key this device does not hold, so there is no earlier state to return it to. This identity cannot be recovered — create a new one, and contact whoever runs your nest.'
  # The public record itself does not check out — someone is serving a
  # fabricated history (a tampered directory, or something intercepting the
  # connection), rather than a key having been misused. Undoing is refused
  # BECAUSE acting on it would be the attack: a fork signed here would nullify
  # the user's own real history with their own key. Says what is wrong, that
  # nothing was signed, and the one action that can help — never a dead button,
  # and never silence (the alarm has already fired by the time this shows).
  contest_detail_unauthenticated: 'The public record of your AT Protocol identity {handle} does not check out: the changes it lists are not signed by keys this identity''s own history allows. That points at the record being tampered with, or your connection to it being intercepted — so nothing has been signed or changed from here, and undoing is not offered, because acting on a false record would destroy your real history. Try again from another network, and contact whoever runs your nest.'
  # The advisory countdown. The directory rules on lateness when the undo is
  # submitted, so this is what we SHOW, never a promise about acceptance.
  contest_deadline: 'About {hours} hours left to undo this.'
  contest_deadline_soon: 'Less than an hour left to undo this.'
  error_request_contest: 'Could not start undoing the change: {message}'
  # A refusal no UI should be able to provoke — `atproto-contest` renders only
  # where `show_contest` is set — so it is worded for the user who somehow got
  # here, not for a developer. Loud, never a silent no-op (testing.md rule 11).
  error_contest_not_contestable: 'This change cannot be undone from here.'
  # The ceremony's confirm card (`atproto-contest-confirm-card`, IDs
  # user-approved 2026-08-02) — the last surface before this device signs.
  # ui/atproto.md § User actions requires it to name three things: the op being
  # contested, what the fork will sign, and the deadline. The deadline line is
  # the same machine-composed `contest_deadline*` the card above shows, so only
  # the first two are new here.
  #
  # ⚠ The honesty rule of `contest_detail_contestable` binds here TOO, and
  # harder: this is the screen a frightened user reads with their finger over
  # the button, so it is the likeliest place for a future edit to compress
  # "your keys control the identity again" into "you take control" — the exact
  # misreading item 3 caught. `contest_confirm_signs` must keep naming
  # the key the nest retains. Never shorten it past that sentence.
  contest_confirm_undo: 'You are about to undo the change to {handle}, and everything published on top of it, by signing an earlier state of your identity back into place.'
  contest_confirm_signs: 'This device signs with the recovery key it holds, which puts your own keys back in charge of who can change this identity. Your nest keeps the separate key it publishes your posts with, so this does not stop it posting as you; replacing that key is a separate step.'
  contest_confirm_directory_rules: 'The public directory decides whether to accept the undo. If it refuses, nothing about your identity changes and trying again is safe.'

# The cross-page critical-alerts banner (critical-alerts.md): reserved for
# possible-compromise / data-loss-imminent conditions — never ordinary errors.
critical_alerts:
  # S4-C genesis-seniority mismatch: the public PLC directory's record of the
  # user's identity carries a senior recovery key this app does not hold.
  #
  # ⚠ This line must NAME THE REMEDY AND WHERE IT IS (user directive,
  # 2026-08-02). Until the recovery-fork ceremony shipped there was no remedy to
  # name, so the line said only "contact whoever runs your nest" — which, on the
  # one alarm that fires when an identity is under attack, pointed the victim at
  # the party most likely to be the attacker and left the undo undiscoverable.
  # The operator sentence stays (an honest nest is the fastest fix, and the
  # window-closed / genesis states have no other recourse), but it can no longer
  # be the ONLY thing offered. The banner is not the ceremony — it is where the
  # user learns the ceremony exists — so it points at the page rather than
  # repeating what undoing does and does not do (that copy lives once, in
  # atproto_settings.contest_detail_contestable).
  atproto_custody_mismatch: 'Security alert: the published record of your AT Protocol identity {handle} names a recovery key this device does not hold. Your identity may not be under your control — do not trust it for anything sensitive. You may be able to undo this yourself from Settings → AT Protocol, and there is a time limit; you can also contact whoever runs your nest.'
  # Feeder #3: the public record of the user's identity claims no handle at
  # their own deployment — so the world finds their posts under a name that is
  # not theirs, or cannot find them by handle at all. Two keys rather than one
  # with an empty argument: "claims nothing" and "claims someone else's name"
  # are different findings, and an English fallback composed in Rust would not
  # translate.
  atproto_handle_unbound: 'Security alert: the published record of your AT Protocol identity does not name a handle at {domain}. It is published as {published} instead — people looking for you may be finding someone else. Do not trust this identity for anything sensitive, and contact whoever runs your nest.'
  atproto_handle_unbound_none: 'Security alert: the published record of your AT Protocol identity names no handle at all, so nobody can find you at {domain}. Do not trust this identity for anything sensitive, and contact whoever runs your nest.'
  # A seed-alone RecoveryKey replacement is in its 30-day window
  # (identity-succession.md § The RecoveryKey → Replacement). Only the identity
  # secret is needed to request one, so a window the user did not open means
  # someone else holds that secret. Two lines: the headline stands alone, the
  # detail carries the comparison aid.
  recovery_replacement_pending: 'Security alert: someone used your identity secret to request a replacement of your account recovery key. If that was not you, someone else has your identity secret. Cancel it in Settings, under Recovery kit.'
  recovery_replacement_pending_detail: 'The replacement takes effect in {days} days unless cancelled. The pending recovery key begins {fingerprint} — if you hold a recovery kit and it does not begin with those characters, the request was not made with your kit.'
  # The domain-expiry watch (domains-and-tls-bootstrap.md § Domain loss →
  # Detection). Six keys, not two: the audience is EVERY authenticated user with
  # role-differentiated lines (only an admin can renew; a resident's stake — their
  # addresses and their recovery locator — is real and their remedy different), and
  # each role needs all three findings.
  #
  # ⚠ The lines must say what is at stake, not just that a date is near. A domain
  # expiry sounds administrative, and the two things it actually destroys — the
  # deployment's mail, and phrase-only account recovery — are the reason this
  # clears the severity bar at all. A line reading "your domain expires soon"
  # would be filed next to a renewal reminder and ignored, which is the failure
  # this banner exists to prevent.
  #
  # Each pair is {admin, resident} for one finding: expiring, expired, lapse status.
  domain_expiring_admin: 'Urgent: {domain} — the name this deployment runs on — expires in {days} days. If it lapses, whoever registers it next receives your mail (including password resets for accounts tied to those addresses), and anyone recovering an account from their recovery phrase alone will no longer be able to find this nest. Renew it at your registrar now.'
  domain_expiring_resident: 'Urgent: {domain} — the name this deployment runs on — expires in {days} days. If it lapses, mail sent to your address there will go to whoever registers the name next, and recovering your account from your recovery phrase alone will stop working. Contact whoever runs this nest, and make sure you know its direct address.'
  domain_expired_admin: 'Urgent: {domain} — the name this deployment runs on — has expired. Whoever registers it next receives your mail, including password resets for accounts tied to those addresses. Renew or redeem it at your registrar immediately; if it is gone, move the deployment to a new domain.'
  domain_expired_resident: 'Urgent: {domain} — the name this deployment runs on — has expired. Mail sent to your address there may now reach someone else, and recovering your account from your recovery phrase alone will not work. Contact whoever runs this nest, and make sure you know its direct address.'
  domain_lapsing_admin: 'Urgent: the registration for {domain} — the name this deployment runs on — is in a hold or deletion state ({status}) and is being withdrawn from DNS. Whoever registers it next receives your mail. Contact your registrar now; renewal is usually still possible at this stage.'
  domain_lapsing_resident: 'Urgent: the registration for {domain} — the name this deployment runs on — is being withdrawn ({status}). Mail to your address there will stop arriving, and recovering your account from your recovery phrase alone will stop working. Contact whoever runs this nest, and make sure you know its direct address.'

