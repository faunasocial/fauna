    # Deployment-seed rotation (admin-nest-seed-rotate-*; box-recovery.md §
    # Deployment-seed rotation). The user-facing word is "identity", never
    # "seed": the seed is the thing the admin's own devices custody, and what an
    # admin decides here is that this box gets a NEW identity. The wording says
    # what rotation does AND what it does not — it evicts the old identity's
    # authority, it does not untell anything the ex-holder already saw (the
    # doc's own honest statement) — because an admin reaching for this in a
    # compromise is exactly the person who must not over-read it.
    rotate_seed_label: Deployment identity
    rotate_seed_desc: >-
      Give this nest a brand-new identity. Apps that already trust it re-trust it
      automatically, and anyone still holding the old identity — a removed admin,
      a lost device — stops being able to use it. It does not undo anything they
      already saw. Remove the admin first: everyone on the roster inherits the
      new identity.
    rotate_seed_button: Rotate deployment identity
    # Shown above the roster listing in the armed confirm. The list itself is the
    # decision surface, so this sentence's whole job is to say what the list
    # means in both directions.
    rotate_seed_confirm_body: >-
      These admins inherit the new identity and can still recover this nest.
      Anyone not listed loses that ability. This cannot be undone.
    rotate_seed_confirm_button: Rotate now
    rotate_seed_cancel_button: Cancel
    rotate_seed_roster_loading: Checking who currently administers this nest…
    rotate_seed_roster_error: >-
      Couldn't check who currently administers this nest: {cause}. Nothing was
      rotated — try again.
    # The self-refuting reading: the admin looking at this screen IS an admin, so
    # a roster of nobody is a wrong answer, not an empty one.
    rotate_seed_roster_empty: >-
      This nest reported no administrators, which can't be right. Nothing was
      rotated — reload this page and try again.
    rotate_seed_working: Rotating the deployment identity…
    rotate_seed_done: Deployment identity rotated. Apps re-trust this nest automatically.
    # The rotation committed but the bookkeeping write didn't. Cosmetic and
    # self-healing, and deliberately still phrased as success — telling the admin
    # a completed rotation failed would be the more harmful error.
    rotate_seed_done_unmarked: >-
      Deployment identity rotated. Your recovery list still shows the old
      identity — reconnect from this device to clear it.
    rotate_seed_mismatch: >-
      This nest reported a different identity than the one that was sent. Nothing
      further was changed; check the nest before trying again.
    rotate_seed_failed: 'Couldn''t rotate the deployment identity: {cause}'
    # Legal takedown console (moderation.md § Legal takedown → Invocation
    # surface). The wording is deliberately compulsion-framed: this is never a
    # policy lever, and the strings say so.
    takedown_label: Legal takedown
    takedown_desc: >-
      The one nest-wide content removal, for legal compulsion only (a court
      order, a statutory demand). Every takedown serves a visible tombstone in
      place of the content, can be appealed by the author, and writes a
      permanent audit record. It is never a policy or opinion lever.
    takedown_content_id_label: Content id
    takedown_type_post: Post
    takedown_type_conversation: Conversation message
    takedown_reference_label: Legal reference
    takedown_restore_label: Overturn an existing takedown (restore)
    takedown_arm_takedown: Take down…
    takedown_arm_restore: Restore…
    takedown_blocked_no_content: Enter the content id of the item named by the legal obligation.
    takedown_blocked_no_reference: A legal reference is required — a takedown without one is refused.
    takedown_confirm_takedown: >-
      Take down {content_type} {content_id}, citing "{reference}"? A visible
      tombstone will be served in its place, the author can appeal, and a
      permanent audit row records this action.
    takedown_confirm_restore: >-
      Overturn the takedown of {content_type} {content_id}? The content serves
