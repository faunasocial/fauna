  # item 1). Resolved by fauna_core::obligation::legal_takedown_tombstone; the
  # {reference} placeholder carries the legal-obligation reference. Never a
  # silent removal — this text is always shown where the body would be.
  legal_takedown:
    tombstone: Removed under legal obligation ({reference})
# The tier-1 muted-keywords Settings sub-page (content-moderation-and-ranking.md
# § Resolved design decisions Q3; moderation.md § Muted keywords). The
# user-global word-list is sealed client-side (the account plane's moderation record)
# and never leaves the user's devices — the copy says so.
muted_words:
  title: Muted words
  description: Conversation messages containing one of these words are collapsed behind a “Show anyway” button. This list stays on your devices — the server never sees it.
  input_placeholder: Add a word to mute
  add: Mute word
  empty: You haven’t muted any words yet.
  remove: Un-mute
# The personalization home (content-moderation-and-ranking.md § Composition,
# ratified 2026-07-06) — a hub linking the Feeds facet, the ALREADY-SHIPPED
# muted-words sub-page (reused, not rebuilt here), and the user's subscribed
# community labelers.
personalization:
  title: Personalization
  feeds_link: Feeds
  muted_words_link: Muted words
  labelers_empty: You haven’t subscribed to any community labelers yet.
  browse_catalog: Browse labeler catalog
  # Trained topics facet (topic-factors.md § Authoring surface): the user's
  # trainable tier-1 topic factors — create/rename/delete here; the models
  # train from the per-post "more/less like this" gestures on the feed and
  # compose into feeds via the create-feed factor picker.
  trained_topics_title: Trained topics
  trained_topics_empty: You haven’t created any trained topics yet.
  trained_factor_placeholder: Topic name
  trained_factor_create: New trained topic
  trained_factor_rename: Rename
  # The create-button's label while a rename is in progress (the single
  # name-input serves both flows; clicking a row's Rename retargets it).
  trained_factor_save: Save name
  trained_factor_examples: '{count} examples'
  trained_factor_cap: 'You already have {max} trained topics — delete one to create another.'
  # The boundary's `BlankName` refusal (a create/rename guard should already
  # keep this from firing — client-side, a blank name is a no-op, never a
  # submit) — kept as real copy rather than the generated error's debug shape,
  # for the rare case the guard is bypassed.
  trained_factor_blank_name: A trained topic needs a name.
  # The per-factor Layer-A opt-in (engagement-cues.md § Layer A): when on, the
  # feed's watch/skip engagement cues weak-train this factor. Off by default.
  trained_factor_engagement_toggle: Learn from my activity
  # Deletes the sealed engagement-cue rollup (cues:v1) from the user's own nest
  # and resets the live engine — the user-revocable affordance for captured
  # activity data (engagement-cues.md § At rest).
  clear_engagement_data: Clear activity data
  # Publishing a trained topic as a community list (topic-factors.md §
  # Publishing a trained factor; frame D8). The user shares what the topic
  # FOUND (the posts it scored, pruned by hand) — never what it LEARNED (the
  # model itself is v2, gated on a privacy-scrub design pass). The sheet owes
  # the user two disclosures the doc ratified as accepted limitations: the list
  # only covers posts this device has actually seen, and publishing carries no
  # author attribution.
  trained_factor_publish: Publish…
  publish_sheet_title: Publish this topic
  publish_name_label: Public name for this list
  publish_name_placeholder: e.g. Small orange cats
  publish_limitation_note: >-
    You’re sharing the posts below — not the topic itself or anything it learned
    about you. Only posts this device has already loaded and seen can be
    included, so the list won’t cover posts you never saw. It’s published
    anonymously: nothing links the list back to you or your account.
  publish_exemplars_title: Posts to include
  publish_exemplars_empty: >-
    This topic hasn’t scored any of the posts loaded so far. Open a feed it
    ranks, then try again.
  # The include checkbox's own label, shared by BOTH review-row kinds (the
  # List's exemplar rows and the Model's n-gram rows). Checked by default — the
  # user PRUNES the topic's proposal rather than assembling one — so the label
  # names what staying ticked means, not an action to take.
  publish_exemplar_include: Include
  publish_score: 'Score {score}'
  publish_submit: Publish
  # The publish sheet's own submit-time refusals — the name field is trimmed
  # client-side before submit, so `BlankName`/`NameTooLong` are a defensive
  # backstop (the boundary re-validates), shared by both the List and Model
  # kind (same name field, same `MAX_LABELER_LIST_NAME_LEN` bound).
  publish_name_blank: A published name can’t be blank.
  publish_name_too_long: 'A published name is at most {max} characters.'
  # ── The Model kind (topic-factors.md § Publishing a trained factor, v2) ─────
  # The kind picker swaps the whole review body: a List shares the POSTS the
  # topic found, a Model shares the WORD PATTERNS it learned from them. List is
  # first and default — it is the weaker disclosure, so it is what an
  # unattended return key picks.
  publish_kind_label: Share as
  publish_kind_list: List of posts
  publish_kind_model: Word-pattern model
  # A kind this build does not offer — a newer app published it. Name it rather
  # than collapsing it into a generic word: what the user needs to see is
  # exactly WHICH kind is beyond this build.
  publish_kind_unknown: '{kind}'
  publish_name_label_model: Public name for this model
  # The three disclosures § Publishing ratifies as mandated copy for the Model
  # kind — absence of any one of them is a bug, not a wording choice. In order:
  # it generalizes (the thing a List cannot do); it discloses word patterns
  # shared by at least three of your marked public posts, INCLUDING the ones you
  # marked "less like this" (the dislike half is part of the disclosure, which
  # is why the direction column exists); and it is anonymous and built only from
  # examples you marked by hand, never from what you read or watched.
  publish_limitation_note_model: >-
    You’re sharing the word patterns this topic learned — not the topic itself,
    and none of the posts. Unlike a list, a model also matches posts nobody here
    has seen yet. Only patterns that appear in at least 3 of your marked public
    posts are included, and that covers both what you marked as more like this
    and what you marked as less like this — the direction column below shows
    which is which. It’s published anonymously, and it’s built only from posts
    you marked by hand: nothing you merely read or watched goes into it.
  # The corpus-size line § Publishing mandates beside the note. Both numbers
  # show, because M - N is what the rebuild DROPPED as private, deleted, or
  # unreachable — and a publisher only learns that happened if both are visible.
  publish_corpus_size: >-
    Built from {included} public examples of your {marked} marked posts.
  publish_ngrams_title: Word patterns to include
  # The refusal state: fewer than 3 public examples, or nothing survived the
  # 3-post floor. Says what to do about it — the floor is a privacy rule, so
  # the only way through is genuinely more public examples.
  publish_ngrams_empty: >-
    No word pattern appears in at least 3 of this topic’s public examples yet,
    so there’s nothing that can be shared without quoting a single post. Mark a
    few more public posts for this topic, then try again.
  # The boundary's own re-check at submit time (the sheet's own emptiness
  # guard above is the review-time twin) — a race between opening the sheet
  # and pressing Publish can clear the vocabulary in between.
  publish_vocabulary_empty: This topic needs more public examples before it can be shared as a model.
  # The class-direction column — part of the disclosure, not decoration.
  publish_ngram_direction_more: More like this
  publish_ngram_direction_less: Less like this
  publish_ngram_direction_both: Both
  # The CLASS-BLIND distinct-post count (more + less): that sum is the quantity
  # the 3-post floor bounds, so showing one class alone could print a number
  # below the floor for a pattern that legitimately passed it.
  publish_ngram_count: 'In {count} posts'
  # Layer-B opt-in (engagement-cues.md § Layer B): the sibling of mail-spam's
  # report-sharing toggle, on the Personalization home. When on, this device's
  # derived cue verdicts on PUBLIC posts join a k-anonymized network aggregate;
  # off by default. The transparency pane below shows exactly what this nest
  # exports to peers (byte-identical to the federation export).
  share_signals_title: Anonymous signal sharing
  share_signals_label: Share anonymous engagement signals
  share_signals_subtitle: >-
    Off by default. When on, whether you watched or skipped a public post joins an
    anonymized count your nest shares — but only once at least 3 people here have
    the same verdict on the same post, and never your identity or your activity.
  signal_published_title: What this nest publishes
  signal_published_description: >-
    The anonymized signal and report counts your nest shares with peers, shown
    exactly as a peer nest sees them. Nothing appears here below 3 contributors.
  signal_published_empty: This nest publishes no signal aggregates yet
  signal_published_contributors: contributors
# The community-labeler catalog (content-moderation-and-ranking.md § Tier-3
# community models) — browse + inspect-before-subscribe. Subscribing to a
# restricted-kind labeler mints a scoped, revocable content-read capability
# inline as part of the subscribe action.
labeler_catalog:
  title: Community labelers
  empty: No community labelers published yet.
  inspect: Inspect
  subscribe: Subscribe
  unsubscribe: Unsubscribe
  close_inspect: Close
  # The list-kind inspect section (content-moderation-and-ranking.md § Tier-3
  # artifact kinds: inspect renders the exact id→score map; the publisher-chosen
  # name rides inside the artifact — topic-factors.md § Publishing).
  list_name: 'List name: {name}'
  list_entry_count: '{count} entries'
  unnamed_list: Unnamed list
  # The text-model-kind inspect section (same § — inspect renders the FULL
  # vocabulary, the model's whole matching surface, before subscribing). The
  # count says "word patterns" rather than "entries" because that is what the
  # reader is about to scroll through, and it is the thing being disclosed.
  model_name: 'Model name: {name}'
  model_ngram_count: '{count} word patterns'
  unnamed_model: Unnamed model
  # The kind badge's override for a text-model this build cannot score
  # (content-moderation-and-ranking.md § Tier-3 artifact kinds -- the "and says
  # so" half of the unknown-version rule; the compose seam leaves the factor
  # inert, and this row is where the user learns why). It replaces the raw kind
  # discriminator ONLY in that case, so the badge stays a stable value
  # otherwise. Worded as the user's remedy rather than the artifact's fault:
  # nothing is wrong with the model, this build is simply older than it.
  kind_needs_newer_app: needs a newer app
  # Page-level error-message strings the shared LabelerCatalogMachine emits
  # (libs/fauna-labeler-catalog-machine). Backfilled 2026-07-22 — the machine
  # referenced these keys with no en.yaml entry, so a failure rendered as a raw
  # key instead of a sentence.
  error_refresh: 'Failed to load community labelers: {message}'
  error_inspect: 'Failed to inspect this labeler: {message}'
  error_subscribe: 'Failed to subscribe: {message}'
  error_unsubscribe: 'Failed to unsubscribe: {message}'
  # The honest degrade after subscribing a labeler that reads mail when the
  # machine could not trust anything with it (content-moderation-and-ranking.md
  # § Tier-3 → Subscribing = minting a capability): the subscription is
  # registered but the labeler will not run until the missing piece exists.
  # Rendered on the page's error-message slot — the one text every app paints —
  # because an un-granted subscription never runs, exactly like a revoked one,
  # and silence would read as a working labeler. Vocabulary: trust, never
  # capability/grant.
  subscribed_without_mail_holder: >-
    Subscribed, but this labeler cannot run over your mail yet: this nest has
    no mail service to trust with it.
  subscribed_without_mail: >-
    Subscribed, but this labeler cannot run over your mail until mail is set up
    for your account.
# The task-delegation home (participants.md § Task delegation, Q-B/Q-C) — the
# cross-participant surface listing each heavy background task kind, its current
# runner, and its assignment (automatic / pinned-to-a-participant). Naming (Q-E,
# binding): "delegated tasks" / "Task delegation" — never "capability" / "grant"
# / "jobs".
task_delegation:
  title: Task delegation
  description: Heavy background tasks run on one capable, always-on device — a nest or a plugged-in computer — and stay off battery phones. Each task picks its device automatically; pin one if you prefer.
  # Display name per heavy task kind (participants.md § Task delegation → Concepts).
  kind_backup_upload: Backup uploads
  kind_content_rescore: Content re-scoring
  kind_index: Search indexing
  # Assignment picker options.
  assignment_automatic: Automatic
  assignment_this_device: This device
  # A pin to another participant: the picker shows the resolved display name
  # verbatim (no wrapping copy) — the key exists so every app renders it
  # through the same LocalizedText shape as the other two options.
  assignment_other_name: '{name}'
  # Current-runner status line.
  runner_this_device: Running on this device
  runner_other_device: 'Running on {device}'
  runner_waiting: Waiting for an eligible device
  # Fires when this device cannot resolve its own device id — the local store
  # that holds it could not be opened (tui: `sync/device.db`; android: the
  # encrypted prefs). Names the consequence and a next step per ui/README.md
  # § Copy comprehensibility Q1/Q4, rather than the internal absence: the id
  # itself is not a term the user has any way of knowing (Q3).
  error_device_id: This device could not load its own identity, so task assignments cannot be shown or changed here. Restart the app; if that does not help, its local data directory may not be writable.
# The controversial-class feature plane's transparency read
# (docs/goal/architecture/dynamic-features.md § Transparency & auditability).
# Boundary 4 of § What this is NOT is why these strings exist: "No silent
# gates. Every active restriction is visible to the person it binds — which
# feature, what limit, which tier set it." Rendered from the shared
# `fauna-client-features` derivations, so every app says the same thing.
features:
  # Registry members, in the user's words rather than the stable key. The key
  # ("p2p-share") is a wire/cargo identifier and never reaches a screen.
  name_payments: Payments
  name_zaps: Zaps
  name_p2p_share: File sharing
  # A feature a newer nest lists that this app does not know yet. Never shown
  # (such a feature has no row); present so the name map stays total.
  name_other: A feature this app does not know yet
  # Who set a restriction — boundary 4's attribution half. Tier 1 is nobody's
  # choice (Rust constants shipped in every build), so it is named as the app's
  # own built-in limit rather than as a person.
  tier_structural: Fauna's built-in limits
  tier_region: Your region's rules
  tier_admin: Your nest admin
  tier_guardian: Your guardian
  tier_self: Your own setting
  # A rule-setter a newer nest names that this app does not know yet. The
  # limit it set is shown and enforced like any other.
  tier_other: Another rule-setter
  # Turned off outright. One key per tier rather than a '{tier}' argument: the
  # tier name is itself a translated term, and most languages need agreement
  # between it and the surrounding sentence.
  denied_by_structural: Turned off by Fauna's built-in limits.
  denied_by_region: Turned off by your region's rules.
  denied_by_admin: Turned off by your nest admin.
  denied_by_guardian: Turned off by your guardian.
  denied_by_self: You turned this off.
  denied_by_other: Turned off by another rule-setter.
  # A quota with no headroom left. '{window}' is the window that ran out, a
  # bare noun from the window_* keys below.
  exhausted_structural: "You've used up Fauna's built-in limit for this {window}."
  exhausted_region: "You've used up the limit your region's rules set for this {window}."
  exhausted_admin: "You've used up the limit your nest admin set for this {window}."
  exhausted_guardian: "You've used up the limit your guardian set for this {window}."
  exhausted_self: "You've used up the limit you set for this {window}."
  exhausted_other: "You've used up the limit another rule-setter set for this {window}."
  # Trailing windows, not calendar ones (§ The quota grammar) — "this week"
  # means the last 7 days, which is what the summed day buckets measure.
  window_day: day
  window_week: week
  window_month: month
  # ── The feature-limits surface itself (ui.yaml `feature-limits-*`, approved
  # 2026-08-11). The section is the transparency read boundary 4 requires: "no
  # silent gates — every active restriction is visible to the person it binds". ──
  section_title: Feature limits
  # Shown when the nest reports no gated features at all — an excised build, or
  # a nest too old to answer. NOT shown for "nothing is restricting you": an
  # unrestricted member is still a row, because "unrestricted" is an answer.
  empty: No feature limits apply on this nest.
  # The row's state word. Two words, not three: a hidden row is never rendered.
  status_available: Available
  status_restricted: Restricted
  # What a quota cell counts. Deliberately plain nouns — the row already names
  # the feature, so these say the shape of the bound, not the feature again.
  dimension_operations: Uses
  dimension_counterparties: People
  dimension_volume: Amount
  # '{dimension}' and '{window}' are both keys above, resolved before
  # substitution (LocalizedText::resolve_nested).
  quota_label: '{dimension} per {window}'
  quota_value: '{remaining} left of {limit}'
  quota_value_exhausted: 'none left of {limit}'
  # A millisat amount in the unit people read. The byte scale has its own
  # shared strings (size.*); sats do not, and this is their only surface today.
  magnitude_sats: '{value} sats'
  # ── Authoring a limit (dynamic-features.md § Authoring surfaces; ui.yaml
  # `admin-nest-feature-limits-*`, `feature-limits-own-*` and the shared
  # `feature-policy-editor-*`, approved 2026-09-25). ONE editor, two hosts: the
  # admin's nest-wide document on the admin Nest page, and a person's own limit
  # inside the Feature limits section above. ──
  admin_section_title: Feature limits for everyone
  admin_section_desc: Limits set here apply to every account on this nest. They can only tighten what Fauna and your region already allow.
  # A tier's AUTHORED document in words — not what binds overall (that is the
  # transparency row's job). "No limit set" is the tier having no opinion, which
  # is not the same as an authored "On, no limits".
  authored_none: No limit set
  authored_off: Turned off
  authored_on: On, no limits
  authored_limited_one: On, 1 limit
  authored_limited: 'On, {count} limits'
  # A stored document the nest cannot decode is ENFORCED as off — so the row must
  # never read "No limit set" over it.
  authored_unreadable: "This limit can't be read, so the feature is off until it's set again or removed."
  own_label: Your own limit
  own_edit: Set your own limit
  admin_edit: Edit
  # '{feature}' is a name_* key, resolved before substitution.
  editor_title_admin: '{feature}: limits for everyone on this nest'
  editor_title_self: '{feature}: limits only for you'
  # '{ward}' is the child's handle, substituted verbatim.
  editor_title_guardian: '{feature}: limits only for {ward}'
  editor_on: 'On'
  editor_off: 'Off'
  editor_hint: Leave a box empty for no limit. Zero is a limit.
  # The magnitude cells name the unit they are typed in. '{window}' is a
  # window_* key, resolved before substitution.
  editor_volume_label_bytes: 'Amount per {window} (for example 50 GB)'
  editor_volume_label_sats: 'Amount per {window}, in sats'
  editor_per_operation_bytes: 'Largest single item (for example 2 GB)'
  editor_per_operation_sats: 'Largest single payment, in sats'
  editor_save: Save
  editor_remove: Remove limit
  editor_cancel: Cancel
  editor_saved: Saved.
  editor_removed: Limit removed.
  editor_invalid_count: "\"{value}\" isn't a whole number. Type one, or leave the box empty."
  editor_invalid_size: "\"{value}\" isn't a size. Try something like 50 GB, or leave the box empty."
  editor_invalid_sats: "\"{value}\" isn't a whole number of sats. Type one, or leave the box empty."
  editor_save_failed: 'Could not save the limit: {error}'
  editor_load_failed: 'Could not load the limits: {error}'
  # A guardian's save for an account they no longer guard: nothing was sent.
  editor_ward_missing: This account is no longer in your family, so the limit was not saved.
  # The guardian host, on the family policy screen (one child's limits).
  guardian_section_title: Feature limits
  guardian_section_desc: Limits set here apply only to this child. They can only tighten what already applies.
  # The no-effect note: a looser value is never refused (only the tighter of
  # the tiers ever applies), but the editor is honest that it changes nothing.
  # One key per tier for the same agreement reason as denied_by_*. '{limit}' is
  # a finished number or magnitude.
  no_effect_structural: "No effect: Fauna's built-in limit is already {limit}."
  no_effect_region: "No effect: your region's rules already limit this to {limit}."
  no_effect_admin: "No effect: your nest admin already limits this to {limit}."
  no_effect_guardian: "No effect: your guardian already limits this to {limit}."
  no_effect_self: "No effect: your own setting already limits this to {limit}."
  no_effect_other: "No effect: another rule-setter already limits this to {limit}."
# Family safety — supervised accounts (docs/goal/behavior/family-safety.md
# § App surface; IDs user-approved 2026-07-09). Policy-editor labels below
# landed with the windows app slice (first app to build the family
# page) — shared by all apps per the goal doc's "add to en.yaml + regen,
# shared by all" note.
family:
  title: Family
  supervised_indicator: 'This account is supervised by {guardian}'
  supervised_notice_onboarding: 'This account will be supervised by {guardian}'
  # Guardian section — wards list.
  wards_heading: Accounts you supervise
  no_wards: You are not supervising any accounts.
  # Reach-policy editor (§ Guardian policy pillar 1).
  policy_contact_approval_label: Require my approval for new contacts
  policy_unknown_sender_label: Unknown email senders
  policy_federation_label: Allow contact from other nests
  policy_feed_sources_label: New feed sources
  # The scope statement family-safety.md § Guardian policy pillar 1 requires be
  # stated on ANY surface exposing the feed_sources knob: this gate stops new
  # connections and follows, and says nothing about messages arriving over an
  # account that is already connected. It no longer states an ABSENCE ("are not
  # filtered") — that closure is the unknown_peer_dm knob (§ The bridge-DM
  # gate), which a guardian can set from 2026-08-14, so the old wording became
  # FALSE for any ward whose guardian set it. Names the governing control rather
  # than its position: the six apps still lifting the select render this same
  # caption. Reworded in the commit that shipped tui's select.
  policy_feed_sources_caveat: 'Blocks new external accounts and follows. Messages arriving through an already-connected account are governed by "Unknown message senders".'
  # The bridge-DM gate (§ The bridge-DM gate) — what happens to direct messages
  # arriving over a connected external account from someone the child has never
  # messaged. Closes the bound policy_feed_sources_caveat states.
  policy_unknown_peer_dm_label: Unknown message senders
  # Content policy — the per-category render floor (§ Content policy, Slice C).
  # Each is a select over inherit/collapse/block; also doubles as the ward's
  # read-only summary label for that category.
  policy_content_nsfw_label: Adult content
  policy_content_spam_label: Spam
  policy_content_phishing_label: Phishing and scams
  policy_content_commercial_label: Ads and promotions
  # Guardian Notify (§ Guardian Notify, Slice D) — a boolean, category+count only.
  policy_content_notify_label: Notify me about flagged content
  # Screen time (§ Screen time, Slice E) — the usage window is the hours the
  # child MAY use the account (so "no device after 21:00" is the window
  # 07:00-21:00), and it may wrap midnight. Both bounds are typed as HH:MM and
  # stored as minutes from local midnight; the daily budget is whole minutes,
  # counted across every device. Clearing a field removes that control.
  policy_screen_heading: Screen time
  policy_screen_window_start_label: 'Usable from (HH:MM)'
  policy_screen_window_end_label: 'Usable until (HH:MM)'
  policy_screen_daily_minutes_label: 'Daily limit (minutes, all devices)'
  # The conforming-app bound, which family-safety.md § Screen time requires
  # be stated on this surface the same way policy_feed_sources_caveat states
  # pillar 1's: screen time is enforced by the child's own apps, not the nest.
  policy_screen_caveat: 'Enforced by the apps on your child''s devices. Leave a field empty to remove that limit.'
  policy_save_button: Save policy
  # Shared value labels for the unknown-sender-mail / feed-sources /
  # unknown-peer-dm selects (§ Wire & data shape: unknown_sender_mail =
  # allow/hold/reject, feed_sources = allow/block, unknown_peer_dm = allow/hold).
  value_allow: Allow
  value_hold: Hold for review
  value_reject: Reject
  value_block: Block
  # Content-floor select values (§ Content policy) — value_block is reused.
  value_inherit: Use my settings
  value_collapse: Collapse
  # Render placeholders the feed / conversations surfaces paint in place of a
  # flagged item's body (§ Content policy). A `block` verdict is always a guardian
  # floor (a user's own threshold only collapses), so the block notice names the
  # family policy; a `collapse` can come from either source, so it stays neutral.
  content_blocked_notice: Hidden by your family policy
  content_collapsed_notice: Flagged content
  content_reveal_button: Show anyway
  # Guardian Notify readout on the guardian's ward row (family-ward-content-notices,
  # § Guardian Notify, Slice D) — one line per category the ward's apps acted on
  # today, category + count only (never content, never an id). The category name is
  # the matching policy_content_*_label above; this is the count half.
  ward_content_notice_count: '{count} flagged today'
  # Screen-time usage readout (family-ward-usage-today, § Screen time, Slice E).
  # ONE wording for two surfaces: the guardian's per-ward row and the ward's own
  # read-only summary show the same number — the goal doc's transparency rule —
  # so both resolve these keys through fauna_core::format::usage_today_line.
  # Coarse minutes only; the nest never learns WHAT was used.
  ward_usage_today_label: Screen time today
  ward_usage_today_of_budget: '{used} of {budget} minutes'
  ward_usage_today: '{minutes} minutes'
  # The guardian's per-ward device-mark surface (family-device-mark-item /
  # family-device-mark-toggle, § Full visibility for young children, Slice F) —
  # one row per ward device, the toggle setting/clearing `guardian_marked`.
  # "Guardian device" deliberately matches devices.guardian_marked_badge: the
  # guardian flips exactly the label the child then sees on their own device
  # list, so the two ends of the transparency promise read identically.
  ward_devices_heading: Devices
  ward_devices_hint: 'Mark the device you enrolled into this account. {handle} cannot remove a marked device, and graduating un-enrolls it automatically.'
  no_ward_devices: No devices registered yet.
  device_mark_label: Guardian device
  # The un-deny surface (family-safety.md § The bridge-DM gate → The un-deny
  # surface): the guardian's denied bridge-DM peers, and the button that flips
  # a denial back. Deliberately reversible in one click — a deny was otherwise
  # a one-way door in the UI.
  blocked_peers_heading: Denied message senders
  blocked_peers_hint: 'People you denied for {handle}. Their new messages are refused; anything already delivered stays readable. Allowing lets them message again.'
  no_blocked_peers: Nobody denied.
  blocked_peer_allow: Allow again
  # The ward's full-screen screen-time lock (screen-time-lock /
  # screen-time-lock-message, § Screen time, Slice E). The message names the
  # policy and the guardian, and nothing about what the child was doing. The
  # Family page stays reachable behind the lock, so the child can always read
  # who supervises them and what the policy says — screen_lock_family_hint
  # points at it, and is why the lock is never a dead end.
  screen_lock_title: Screen time is off
