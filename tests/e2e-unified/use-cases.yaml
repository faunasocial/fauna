# The main use cases — what most people do with Fauna, as data.
#
# Owner of the schema, the rules a use case obeys and the score:
# docs/goal/behavior/main-use-cases.md. This file holds the rows only.
#
#   just ui-score                 # destinations and pages by score
#   just ui-score <page>          # one page's elements by score and band
#   just ui-score --unscored      # interactive elements no use case touches
#   just ui-score --check         # the refusals (the UI lint runs them)
#
# A step is a gesture on an element, `{page, element}`: `page` is a ui.yaml page
# key, an onboarding stage key, or `navigation` for the primary-nav tabs and the
# shell rail rows (`settings-nav-row[<page>]`, `admin-nav-row[<page>]`,
# `account-settings-link`). An indexed element is written `base[<what>]` and
# scored as its base id. A `user` or `admin` use case starts on the feed after
# sign-in; a `new-user` use case starts at the first onboarding stage.
#
# `journey` is the test that walks the use case, relative to this directory. It
# carries `@pytest.mark.use_case("<id>")` and ends with
# `assert_use_case_walked(<driver>, "<id>")` (helpers/use_case_walk.py), which
# compares the gestures the driver recorded with `steps`.
# `pending_journeys` lists the use cases no test walks by gestures yet: their
# journey file does not exist, or exists but reaches a step by a shortcut and so
# carries no marker. `--check` tolerates a missing file or a missing marker only
# for those, and refuses an entry whose journey now carries its marker. The list
# empties as the journey rows land, and the tolerance goes with it.
#
# Weights are frequency (5 daily … 1 once per account) × earliness (3 first
# session, 2 first week, 1 later): a judgement, reviewed like any other line.

pending_journeys:

