# Real-Mastodon interop-harness compose stack (pinned v4.3.15).
#
# The subject under test is a mainstream server's acceptance of our AP output,
# so Mastodon runs as its official pinned image (pulled, never built — arm64
# images exist for all of these). Bumping the tag is a deliberate commit, like
# the Rust toolchain pin. The `peer` fixture brings this up, waits
# on the web `/health` healthcheck, then tears it down with `-v` (self-terminating
# per the e2e conventions). See the interop-harness design plan.
#
# STAGE 1 (this file, today): the Mastodon core — db, redis, prepare, web,
# sidekiq, streaming — smoke-validated to boot healthy on an arm64 Linux dev host.
# STAGE 2 (next): the nginx TLS front (vhosts mastodon.test + nest.test →
# host-gateway) + the per-run test-CA trust, wiring nest<->Mastodon.

name: fauna-mastodon-interop

x-mastodon-common: &mastodon-common
  image: ghcr.io/mastodon/mastodon:v4.3.15
  env_file: mastodon-test.env
  restart: "no"
  networks:
    default:
      aliases: []

services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: mastodon
      POSTGRES_PASSWORD: mastodon
      POSTGRES_DB: mastodon_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastodon -d mastodon_production"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: create + load schema (fresh DB) or migrate (existing). Idempotent.
  prepare:
    <<: *mastodon-common
    command: ["bundle", "exec", "rake", "db:prepare"]
    depends_on:
      db:
        condition: service_healthy

  # One-shot (root): merge the container's system CA bundle with the per-run
  # test CA into the `ca_certs` volume, so Ruby (web/sidekiq, via SSL_CERT_FILE,
  # which REPLACES the bundle) and Node (streaming, via NODE_EXTRA_CA_CERTS,
  # which ADDS) both trust `https://nest.test`. Runs as root to write the volume.
  mastodon-certs:
    image: ghcr.io/mastodon/mastodon:v4.3.15
    user: root
    restart: "no"
    volumes:
      - ${FAUNA_TEST_CERT_DIR:-./certs}:/fauna-ca:ro
      - ca_certs:/certs
    command:
      - "sh"
      - "-c"
      - "cat /etc/ssl/certs/ca-certificates.crt /fauna-ca/ca.crt > /certs/ca-bundle.crt && cp /fauna-ca/ca.crt /certs/fauna-ca.crt && chmod 0644 /certs/ca-bundle.crt /certs/fauna-ca.crt"

  web:
    <<: *mastodon-common
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    environment:
      SSL_CERT_FILE: /certs/ca-bundle.crt
      # Secure mode (phase 2): when true, Mastodon refuses UNSIGNED inbound
      # fetches of its own objects and signs its own outbound ones. Our actor
      # GET is currently unsigned, so a strict run is the red test for that
      # gap. Defaults false — the permissive matrix is what most of the
      # fediverse runs, and it must keep passing either way.
      AUTHORIZED_FETCH: "${FAUNA_TEST_AUTHORIZED_FETCH:-false}"
    volumes:
      - ca_certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      prepare:
        condition: service_completed_successfully
      mastodon-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --noproxy localhost localhost:3000/health | grep -q OK || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s

  sidekiq:
    <<: *mastodon-common
    command: ["bundle", "exec", "sidekiq"]
    environment:
      SSL_CERT_FILE: /certs/ca-bundle.crt
      # Must match `web` — Sidekiq performs the outbound deliveries, so a split
      # setting would make signing behaviour depend on which process acted.
      AUTHORIZED_FETCH: "${FAUNA_TEST_AUTHORIZED_FETCH:-false}"
    volumes:
      - ca_certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      prepare:
        condition: service_completed_successfully
      mastodon-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[s]idekiq' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.3.15
    env_file: mastodon-test.env
    restart: "no"
    environment:
      NODE_EXTRA_CA_CERTS: /certs/fauna-ca.crt
    volumes:
      - ca_certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      prepare:
        condition: service_completed_successfully
      mastodon-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q OK || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # TLS front: SNI-selected vhosts mastodon.test + nest.test, published on a
  # per-run loopback port the nest's resolve-override targets. The port is a
  # free port the fixture picks (FAUNA_TEST_NGINX_PORT) so two opt-in sessions on
  # one machine never collide; it defaults to 8443 for a manual `compose up`.
  nginx:
    image: nginx:1.27-alpine
    restart: "no"
    ports:
      - "127.0.0.1:${FAUNA_TEST_NGINX_PORT:-8443}:443"
    volumes:
      - ${FAUNA_TEST_CERT_DIR:-./certs}:/certs:ro
      - ${FAUNA_TEST_NGINX_CONF:-./nginx.conf.template}:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          - mastodon.test
          - nest.test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy

# Pin the default network to a fixed subnet so Mastodon's SSRF guard can allow it
# (`ALLOWED_PRIVATE_ADDRESSES` in mastodon-test.env): Mastodon dials
# `https://nest.test`, which the compose alias resolves to nginx's IP *in this
# subnet* (a private 172.x address the guard blocks by default). The subnet sits
# inside 172.16.0.0/12 so a docker-bridge→host firewall allowance covers it.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.71.0/24

volumes:
  ca_certs:
