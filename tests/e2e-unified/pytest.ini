[pytest]
testpaths = tests
# Self-terminating harness (e2e-conventions.md point 9): every test phase
# (setup/call/teardown) is bounded instead of holding the machine. HOW the wedge is
# reported is platform-split: POSIX gets the `signal` method, so the hung test dies as
# a normal failure and the run carries on; windows has no SIGALRM, so the `thread`
# method dumps stacks and os._exit()s — no summary, no counts, and no traceback for any
# test that had already failed. Convention 7's live-reason line is what carries the
# diagnosis there. Suites with a documented longer budget override via
# @pytest.mark.timeout (live/, platform/docker/, version_skew) — nothing is unbounded.
timeout = 900
markers =
    web: web client tests
    android: android client tests
    ios: ios client tests
    macos: macos client tests
    windows: windows client tests
    linux: linux client tests
    tui: tui (terminal UI) client tests
    tier0: smoke / diagnostic journeys (element discovery, tags, agent-health, state-diag)
    tier1: core journeys (onboarding, feed, messaging, contacts)
    tier2: extended journeys (media, groups, events, admin)
    honesty: state-vs-UI honesty checks (can crash fragile bridges — runs last)
    destructive: tests that may crash the bridge or corrupt app state (run last)
    feature: this test witnesses the named feature page(s) — `@pytest.mark.feature("<slug>")`, one slug per page in docs/features/, repeatable. It is the test -> feature direction of the catalog's two-way discoverability (feature-catalog.md § The marker); the page's coverage contract is the feature -> test direction, and `just features-lint` keeps the two consistent. An unknown slug is a COLLECTION ERROR, exactly like the strict tier_N check, so a typo cannot silently mint a feature nobody has a page for. The marker never says which app: attribution is decided by the run from the drivers the test actually launched, and a test that launches none is a `nest` witness. Select with `--feature <slug>` (repeatable), which combines with `--app` and `--nest` to re-witness one feature on one app in one mode.
    tier_1: in-process unit tests — no nest binary, no driver, no external process (mocking-depth axis; distinct from feature-breadth `tier1`)
    tier_2: real driver + mocked backend (fakes/, wiremock, set_*_snapshot state injection, fake DNS, etc.)
    tier_3: full stack — every binary real, real wire end-to-end (uses nest_instance / logged_in_app / admin_app / nest_binary)
    tier_4: full Docker deployment stack — the real nest image + sidecars (mail-bridge, clamd, rspamd), exercising image packaging + s6 supervision that the locally-built binaries (tier_3) bypass. Slowest tier; deepest level of the mocking-depth axis.
    self_contained_docker: tier_4 docker test whose ONLY out-of-process dependency is the nest Docker IMAGE itself (built once per module via `docker_build`) — no local `nest_instance` (cargo/just), no cargo-built seal helper (`run_seal_helper`), no client driver/browser, and no locally-stood-up sidecars (fake DNS, clamd/rspamd, scanner). This is exactly the subset a docker-only self-hosted CI runner (no rust/just/uv toolchain) can run: `-m self_contained_docker` collects only these, so the session-autouse `_session_primary_mail_domain` never drags `nest_instance` into the closure and can't poison the whole session. The tier4-deploy-e2e.yml workflow runs `-m self_contained_docker` by default (CI subset details tracked internally).
    live_nest: EVERY nest interaction in this test targets a LIVE remote nest (UI sign-in via DoH discovery, e.g. example.com) — it never reads the session `nest_instance`. When ALL selected tests carry this marker, the session skips building/starting the local fauna-nest entirely: `_driver_cache` launches clients pointed at the live URL (helpers/multiseat_config.nest_url) and `_session_primary_mail_domain` skips its pin. A mixed selection keeps the normal local-nest path. Native apps only (the web SPA proxy targets the local nest). Usually combined with live_box (which serializes the shared box) — live_box alone does NOT imply this: a live_box test may still use a local nest.
    live_box: drives a SHARED LIVE nest (FAUNA_LIVE_NEST_URL, e.g. example.com) — destructively by default (factory-reset + re-claim), or as a NON-DESTRUCTIVE carve-out (testing.md § shared-box rule, ratified 2026-07-22: no reset, no credential/storage-mode mutation, no pre-existing data touched, teardown removes only what the run itself created, blast-radius argument required in the module docstring). The autouse `_serialize_live_box` fixture holds a machine-wide flock on the box for the test's duration so concurrent sessions serialize instead of colliding (helpers/live_box_lock.py). OPT-IN, enforced on the marker itself: the autouse `_live_box_opt_in_gate` skips every live_box test unless FAUNA_E2E_LIVE=1 (the opt-in the three `just e2e-live-*` recipes export) or `--nest live` is passed, so no default sweep can reach the shared box. Keying the gate on the marker rather than per-module is deliberate — the two tri-machine multiseat modules had hand-rolled a gate on "does this machine have an account seed" (`~/.fauna-id`, true on every dev machine), so a plain `--app tui` sweep ran their live steps unattended and filed the results twice as phantom regressions. Pinned by tests/test_live_box_opt_in_gate.py.
    cd_suite: the CURATED journey subset the promote-after-verify release pipeline's future e2e gate runs against the disposable CD box (dev.example.com — build-system.md § Image tags & channels), once that box exists. All `live_box`-gated, so a run needs the same FAUNA_LIVE_* env vars pointed at the CD box; nothing here is auto-selected by `--tier 4` alone. Deliberately excludes the CalDAV live tests (test_caldav_live_nest.py, test_caldav_autoschedule_live_nest.py) — their current pass/fail status against a live box was not re-verified when this marker was curated; fold them in only after a fresh live confirmation. Invoke with `just e2e-cd-gate https://<box>` — the recipe owns the invocation, and all four of its parts are load-bearing (corrected 2026-08-13 after the first flow-trace of the real invocation; the fourth added 2026-10-04): `--nest live:URL` is what keeps the selection from triggering a collection-time local `fauna-nest` cargo build (the session-autouse mail-domain fixture drags `nest_instance` into `_prebuild_binaries`' closure — the same trap `tier4-deploy-e2e.yml` documents for `self_contained_docker`; it also satisfies the `live_box` opt-in on its own), `--live-box disposable` is what lets the gate SELECT its two destructive mail residents at all (on a bare `--nest live` the shared-box policy, exclusion class (3), deselects them at collection — a deselect is not a skip, so `--fail-on-skip` never sees it; the declaration is accepted only for a staging box the tree names, never example.com — testing.md § The shared-box rule → The disposable-box declaration), and `--fail-on-skip` is what stops a gate from passing green when every one of these tests skipped on a missing credential, an unbuilt app binary, or an unreachable port. Which of them need a real app binary — and so cannot run on the toolchain-light self-hosted runner — is machine-checked by tests/test_cd_gate_completeness.py.
    standalone_only: nest-mode axis — this test runs ONLY under `--nest standalone` (the locally-built binary). Declared exclusion from docker and live, honoured by helpers/nest_surface.py::classify. Reach for it when a NestCapabilityError names it: the test depends on something only a nest this harness started can give (a `config_path` the harness wrote, a re-spawnable `node_binary`, a fresh unclaimed box). See testing.md § Default app and nest mode.
    docker_only: nest-mode axis — this test runs ONLY under `--nest docker[:IMAGE]`. For tests whose SUBJECT is the deployment artifact (packaging, s6 supervision, boot gates) rather than behaviour that happens to run on a nest.
    live_only: nest-mode axis — this test runs ONLY under `--nest live[:URL]`. For the irreducibly-live surfaces: real DNS, a real CA-issued cert, real accumulated state.
    global_admin: nest-mode axis, exclusion class (3) — this test's OWN BODY mutates nest state outside the run's own account (mail domains, spam policy, federation peers, bridge service users). Excluded from `--nest live`, where the box is shared with humans (testing.md § The shared-box rule); free on the throwaway nests of standalone/docker. The fixture-closure inference (nest_surface.GLOBAL_ADMIN_FIXTURES) catches the same class arriving via a fixture — this marker is for the half an AST walk cannot see.
    live_ok: nest-mode axis — individual re-admission to `--nest live` for a test class (3) would otherwise exclude (a kind it reaches, a fixture, or the admin shell it drives through the app UI), under testing.md § The shared-box rule's non-destructive carve-out. Carry it only when the test meets that standard — a teardown that PROVABLY restores what it changed in the ordinary case; an additive-only act the box's admin opts into by env in the two live-only residents (the harness-tier definer, the box bootstrap) — and put the carve-out's blast-radius argument in the test's docstring. It overrides class (3) alone; it cannot re-admit a test that needs a local binary.
    harness_box: nest-mode axis — the test asserts a premise only a nest THIS HARNESS started holds (a loopback address, no public domain, a feed nobody else posts to), so `--nest live` deselects it at collection (testing.md § Default app and nest mode → Live mode). Docker keeps it: a docker nest is a fresh nest on this machine's loopback too. A fixture with such a premise is listed in `nest_surface.HARNESS_BOX_FIXTURES` instead. State the premise in the test's docstring.
    live_provisioning: opt-in, PROVISIONS A REAL PAID VPS at Hetzner through the client onboarding path, verifies the deploy-verify gates, and tears it down (tests/live/test_hetzner_provision.py). tier_4-classified (real nest image + sidecars) but goes one level beyond — a real EXTERNAL cloud — so it is doubly gated: it skips unless HETZNER_API_TOKEN is set AND FAUNA_E2E_LIVE=1 (the autouse `_live_provisioning_gate`), so a default `--tier 4` run never provisions. Run with `just e2e-live-provision`. See tests/live/conftest.py.
    staging_box: opt-in, PROVISIONS A REAL PAID VPS at Hetzner through the app's onboarding path AND KEEPS IT — the kept staging box that follows the `:dev` image (tests/live/test_staging_box_provision.py). Deliberately NOT `live_provisioning`: the throwaway run selects that marker across tests/live/, and a kept box must never be created as a side effect of it. Triple-gated: it skips unless FAUNA_E2E_STAGING_BOX names the box, FAUNA_E2E_LIVE=1, and a Hetzner token is present.
    reclaim_cycle: re-claim-sensitive suite whose provisioning is verified to survive a factory-reset -> re-claim cycle. Under the `--reclaim-cycle` flag the shared `nest_instance` is reset-cycled once before any test runs, so `-m reclaim_cycle --reclaim-cycle` is the curated "everything, post-reclaim" gate (the broad sibling of the bespoke test_factory_reset_calendar_reclaim.py). Orthogonal to the flag: the marker SELECTS, the flag ACTIVATES the reset. See `just e2e-reclaim-cycle-test`.
    caldav_matrix: the opt-in 12-cell CalDAV onboarding-variant DISCOVERY matrix (test_caldav_onboarding_variants.py) — onboards a fresh zero-config nest through the client UI for each (address-type x storage-mode x enablement) and runs a 3-client CalDAV round-trip. Costly (12 full UI onboardings + bridge spawns), so gated out of the inner loop; the always-on `test_guard_*` cell is the fast regression smoke. Run with `-m caldav_matrix --client linux` on Linux (Go MDA needed).
    real_conversations: needs the REAL shared-Rust ConversationsSession receive loop (real-decrypted mail / channel messages), NOT the mock inject backend. linux/web run the real session under e2e for every login by construction; the windows app defaults to the mock ConversationsManagerHost (so conversations_inject_inbound DM tests stay deterministic) unless a test in the run carries this marker, in which case `_build_app_config` launches it with `FAUNA_E2E_REAL_CONVERSATIONS=1` (App.xaml.cs set_state login path builds the real session, the state snapshot reflects it). The windows app is session-scoped (`_driver_cache`), so run windows `real_conversations` tests in their own invocation — otherwise the flag also reaches the mock-inject DM tests in that session.
    real_photos_library: runs on macOS against the box's REAL System Photo Library — the real-session photo-backup venue (`tests/real_session/`, reachable only with `--real-session`; e2e-conventions.md convention 12's macOS arm). `_build_app_config` then launches every macOS app of the run as the stably signed test bundle `drivers.macos.PHOTO_LIBRARY_BUNDLE_ID` through Launch Services (`launch_mode="photo-library"`), the only launch whose driver will seed or read that library. Session-wide (the macOS driver is session-scoped, `_driver_cache`), so co-selecting any other macOS test is a UsageError.
    real_sync_agent: needs the REAL per-user fauna-sync agent ON THE MACHINE-GLOBAL PER-SID PIPE — the INSTALLED product, which since 2026-09-21 is the narrow case rather than the opt-in. `_build_app_config` launches the windows app with `FAUNA_E2E_REAL_SYNC_AGENT=1` and, when this marker is carried WITHOUT `isolated_sync_agent`, suppresses the default pipe redirect, so the set_state login's provisioner probes \\.\pipe\fauna-sync.<SID>, SPAWNS fauna-sync-agent.exe if absent, and provisions it with a real capability. Only the installer full journey wants this, and its foreign-agent guard (`helpers/windows_sync_agent.blocking_diagnosis`) is what keeps the box honest for it. Until the ruled default lands (see isolated_sync_agent), a run carrying none of the three postures still drives no agent at all; what no run may ever touch is the box's INSTALLED agent, which is the contamination that guard exists to catch. The windows app is session-scoped (`_driver_cache`), so run such tests in their own invocation. Mirrors real_conversations.
    isolated_sync_agent: RULED the windows default 2026-09-21, in force since 2026-09-22 (the switch is `conftest._WINDOWS_ISOLATED_AGENT_IS_DEFAULT`) — so a run naming no posture gets this one anyway; the marker still wins over both other postures, which is what makes `real_sync_agent` + `isolated_sync_agent` mean a real-agent UI test on its own pipe. A carrying run redirects the app's agent pipe (`FAUNA_E2E_SYNC_PIPE`, `SyncServicePipeClient.PipeName`'s e2e override) to a per-session name (`fauna-sync-e2e-<pid>`, the `isolated_sync_agent_pipe_name` fixture) instead of the machine-global per-SID pipe — so a real-agent run talks ONLY to the agent this run itself spawned (`helpers/windows_sync_agent.running_agent` + the shared `sync_agent_binary` fixture), never the box's installed or a sibling checkout's agent (testing.md § conventions point 10; the trap `helpers/windows_sync_agent.py`'s module docstring documents). The pipe+binary pin is ALSO the app's gate (`App.xaml.cs::HydrationSessionEnabled`), which is what makes the isolation structural rather than conventional: shared Rust spawns nothing when a pin misses, where an unpinned spawn walks its candidates down to %ProgramFiles%. Why the flip: linux and tui already spawn the real agent binary as an isolated per-launch child under e2e, so windows alone never exercised the production sync bring-up — and the machine's named sync_devices row, which that bring-up's renewal-grant mint registers, was unassertable on windows. The windows app is session-scoped (`_driver_cache`), so run such tests in their own invocation.
    no_sync_agent: this run must spawn NO sync agent at all — suppresses the default pipe+binary pin and, with it, the app's own gate (`App.xaml.cs::HydrationSessionEnabled` is keyed on that pin), so the provisioner never starts. The opt-out for a suite asserting the agent-less posture itself, or one that cannot afford a co-located agent's background sync. `isolated_sync_agent` on any selected test overrides it. Session-wide like real_conversations: the windows app is session-scoped (`_driver_cache`), so run such tests in their own invocation.
    no_r14_trust: needs an UNSEEDED R14 (account-data-plane.md § The ratified decisions) escrow-holder trust set — the world before `_apply_r14_trust_env`. Every app launch is seeded by default (`FAUNA_E2E_TRUST_NEST_IDENTITY` = `<nest url>=<nest_id>`, nest.info's identity keyed by the nest it was read from), because a plaintext e2e nest can never graduate the TLS pin `trust::trusted_escrow_holders` reads, so without the seed no generation tip resolves and every fleet-only sealed write refuses — the whole R14 plane dormant (`e2e-automation-surface-gating.md` § The e2e trust seed). A test asserting that fail-safe posture ITSELF — refusal with no trusted holder, `device_endpoints: Unmintable`, no durable row — carries this marker. Session-wide like real_conversations: the app drivers are session-scoped (`_driver_cache`), so this cannot un-seed an already-launched app — run such tests in their own invocation. Does NOT affect the TOFU identity pin (`pin_identity_for_test`), so the nest-identity-changed / re-pin suites need nothing here.
    mail_import_source: runs a harness IMAP server the mail-import wizard imports FROM, so every app launch in the session is seeded with FAUNA_E2E_IMAP_EXTRA_CA_PEM (`_apply_mail_import_source_trust_env`) — the session CA `fakes/fake_imap_source.session_cert` mints. Needed because `mailbox-migration.md` § The two TLS modes leaves a source session no plaintext variant and no harness can mint a publicly-chained cert for localhost, so without the seed the app cannot verify the fake and the walk is impossible, not merely awkward (`e2e-automation-surface-gating.md` § The source-IMAP trust seed). The seed ADDS one anchor to the WebPKI roots; it is not an accept-any switch, and it exists only in a test-capable build. Session-wide like real_conversations: app drivers are session-scoped (`_driver_cache`) and the anchor is read at connect time from the launch environment, so a per-test opt-in could not seed an app already running.
    drafts_autosave_window_ms(ms): re-time the draft-autosave debounce for every app launched in this run, by seeding FAUNA_E2E_DRAFTS_AUTOSAVE_DEBOUNCE_MS (`_apply_drafts_autosave_window_env`). The seam is the one shared accessor `fauna_client_drafts::autosave_debounce` — `fauna-ffi`'s `autosave_debounce_ms` is the apple/android/windows door to it — so the marker reaches those apps with no app-side plumbing, under the `any(test, debug_assertions, feature = "test-helpers")` gate (`e2e-automation-surface-gating.md` § The source-IMAP trust seed is the ratified shape). It exists to LENGTHEN the window, never to shorten it: a leave-flush witness must prove the draft reached the nest through the app's leave door and not through the debounce landing on its own, and every leg but iOS's gets that from the process being gone. Shortening it to race the debounce is the wall-clock dependence convention 14 forbids. Session-wide like real_conversations (the drivers are session-scoped), so two different values in one selection is a UsageError, and so is co-selecting a `drafts_production_window` test.
    drafts_production_window: this test needs the PRODUCTION draft-autosave debounce to fire on its own — it asserts a draft the debounce itself must land (the restart-round-trip family). Co-selecting it with `drafts_autosave_window_ms` is refused at collection (`_refuse_drafts_window_collision`) rather than left to turn red, because a lengthened window fails it every time and the red would be recorded against the app in the feature ledger as if the product had regressed.
    installed_product: drives the REAL INSTALLED product rather than the dev build, on whichever app the run selected. WINDOWS (%ProgramFiles%\Fauna): `_installed_windows_app_override` points the driver at the installed FaunaApp.exe, so the app spawns the installer's OWN fauna-sync-agent.exe (App.xaml.cs SpawnSyncAgentDetached resolves baseDir\..\fauna-sync-agent.exe) and the installer->agent->provisioning chain is exercised end-to-end. Needs ADMIN (msiexec) and EXCLUSIVE use of the box: the suite uninstalls + rmtree's C:\Program Files\Fauna, so it destroys any Fauna install a sibling session is using. LINUX (build/linux-installed-product): `_installed_linux_app_override` points the driver at what `install.sh` installed, so the app resolves the install channel's OWN fauna-sync-agent beside it (sync_agent.rs agent_binary_absolute). Needs NO privilege and no exclusive box - the prefix is untracked and private to this repository copy; see helpers/linux_installed_product.py. The native apps are session-scoped (`_driver_cache`), so run these in their own invocation. See tests/platform/{windows,linux}/test_installer.py. TUI (build/tui-installed-product): `_installed_tui_app_override` points the driver at what the ARCHIVE's install.sh installed (the real assemble-archive.sh staged over the debug binaries), so the app resolves the channel's OWN fauna-sync-agent beside it; see helpers/tui_installed_product.py.
    release_feed: points every app launched in this run at the harness's stub RELEASE feed (helpers/release_feed_stub.py) through the compile-gated FAUNA_E2E_RELEASE_FEED_URL seam (`_apply_release_feed_env`), so a walk of "you can ask the app whether a newer version is out" (installers/README.md § Knowing a newer version is out) reads a fixture tag instead of GitHub. Session-wide (the native apps are session-scoped); only the feed ORIGIN moves - path, JSON shape and the semver decision are the shared production ones. Read by tui today (settings/about.rs).
    crash_recovery: adversarial kill/recovery journeys for the Client-state recoverability invariant (nest/common.md) — SIGKILL the client (driver.kill_uncleanly) or the nest (stop_nest graceful=False) mid-operation, timed by the nest's dispatch-receipt beacon, then assert a relaunched client can drive the box to a working state. tier_3, dedicated nests, out of the inner loop: `just e2e-crash-recovery-test`.
    version_skew: the REAL-BINARY half of the version-skew grid (version-compatibility.md § Dim 6) — runs an actual PREVIOUS release build (nest and/or linux client, rebuilt from source at pinned-previous-build.toml's commit and cached by helpers/prev_build.py) against a HEAD build, in both directions, plus the client at-rest upgrade-in-place cells. Distinct from the crafted-payload grid (tests/api/test_wire_version_skew.py), which fabricates an old/new peer in Python against ONE binary. tier_3; needs the previous-build cache, so it is out of the inner loop: `just e2e-version-skew-test`.
    real_session: real-ambient-session test (tests/real_session/) — deliberately runs against and MUTATES the box's real desktop session (real `systemd --user` manager, real session D-Bus, real ~/.config/systemd/user + ~/.config/fauna), the exact surface testing.md § point 10 bans the standard suite from touching. The codified form of a supervised manual pass — exactly as safe as asking a human to run the same steps, and far more repeatable. Triple-gated: (1) the directory is pruned at COLLECTION unless `--real-session` is passed (no default sweep, tier filter, or just recipe can reach it); (2) an autouse guard asserts the run really is on the ambient session (real XDG_RUNTIME_DIR/session bus, no FAUNA_E2E_* isolation) and fails loudly otherwise; (3) an autouse machine-wide flock (helpers/live_box_lock.py keyed "real-desktop-session") makes the box's desktop session single-owner, so two sessions cannot drive it at once. Tests here must borrow-and-restore: back up any real state they touch (e.g. an existing fauna-sync-agent.service) and restore it on teardown. Run: `pytest tests/real_session/ --real-session`. See testing.md § Real-ambient-session tests.
    launch_args: extra command-line arguments the `launch_harness` fixture (`test_onboarding_launch_routing_smoke.py`) invokes the binary with, e.g. `@pytest.mark.launch_args("--autostart")` for the tray-residency case. Reaches the driver through `make_launch_harness(extra_launch_config={"args": ...})`, alongside ios's `udid`, so a case whose subject is HOW the binary was invoked needs no second harness and no growth of the CredStore contract (which describes persisted identity, not command lines). Ignored by the web harness, which has no binary.
    launch_env: extra environment the `launch_harness` fixture (`test_onboarding_launch_routing_smoke.py`) launches the binary with, e.g. `@pytest.mark.launch_env(FAUNA_E2E_CLOCK_OFFSET_SECS="-21600")` for the wrong-clock case. Reaches the driver through `make_launch_harness(extra_launch_config={"environment": ...})`, merged one level down with the store's own environment (linux's private bus), so a case whose subject is the PROCESS ENVIRONMENT the binary starts in needs no second harness. Values are stringified. The web harness has no process environment: it writes the names it knows a localStorage twin for (`WebLaunchHarness.WEB_LAUNCH_ENV`) into localStorage beside the identity and refuses any other.
    headless_credential_store: this test pins its own file-backed persistent-credential store (`common.cred_store.make_file_backed_cred_store`) regardless of client, so it needs no unlocked session Secret Service — exempt from `test_onboarding_launch_routing_smoke.py`'s `_require_credential_persistence` autouse skip.
    fediverse_interop: the real-fediverse interop harness (tests/platform/fediverse/) — a pinned official third-party server (Mastodon or GoToSocial) federated against a locally-built fauna-nest across a real TLS boundary, driven black-box through its Mastodon-compatible REST API. tier_3-classified (real nest binary, real wire, zero mocks — a real third-party peer is the opposite of a stub) but OPT-IN like tier_4: the `peer` fixture skips unless FAUNA_E2E_FEDIVERSE=1, so a general `--tier 3` run never boots one. One assertion set runs against whichever peer FAUNA_E2E_FEDIVERSE_PEER selects, because a second re-pointed copy would drift. Proves a real server accepts our WebFinger/actor JSON-LD/addressing/signatures (activitypub.md gap 4). Run with `just e2e-fediverse-test` or `just e2e-gotosocial-test`. See tests/platform/fediverse/conftest.py.
    fediverse_strict: the half of that harness needing a peer that refuses UNSIGNED fetches of its own objects — phase 2 (the instance actor + signed outbound GETs). NOT a second stack: the `strict_peer` fixture is `peer` plus a guard, satisfied either by Mastodon booted with AUTHORIZED_FETCH=true (`just e2e-fediverse-strict-test`) or by GoToSocial, which has no permissive mode to fall into (`just e2e-gotosocial-test`). Deselected on a permissive Mastodon run, where it would pass vacuously.
