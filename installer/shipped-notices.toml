# The notices manifest: every artifact Fauna ships in binary form and the roots
# of the closure its THIRD-PARTY-NOTICES covers, per ecosystem.
#
# Owner: docs/goal/architecture/shipped-notices.md § How the notices file is
# produced. The generator is scripts/shipped-notices.py, run as
# `just shipped-notices <artifact> <out>`; the cheap gate
# `just shipped-notices-check` holds that every `channel` below is a row of the
# goal doc's § Per channel table and that every licence id in deny.toml's
# allow list has its fallback text under supply-chain/licence-texts/.
#
# Each artifact names:
#   name     the product name the notices file's header prints
#   channel  the goal doc's § Per channel row, verbatim
#   rust     one root group, or a list of them — one per cargo invocation the
#            artifact's build makes: packages, features, no_default_features,
#            target or targets (empty = the host). Resolved per group with
#            CARGO_RESOLVER_FEATURE_UNIFICATION=selected, normal edges only,
#            proc-macros left out (they run in the compiler, not in the binary).
#   go       binaries: the built Go binaries whose recorded module list
#            (`go version -m`) is the closure; paths relative to the
#            repository root, replaced per run by one (`--set go.binary=<path>`).
#            module: the main module's directory, from which a local `replace`
#            path (a fork in the tree) resolves — the binary's own directory
#            when unnamed. A module under Fauna's own path is Fauna's and left
#            out; a linked module the module cache lacks is fetched inside the
#            main module (go.sum-checked) before its files are copied.
#   npm      dir (package.json + deno.lock + node_modules), and `bundled`: the
#            build-time packages whose runtime code the bundler inlines into
#            the served app (Svelte's runtime and SvelteKit's client).
#   nuget    assets: the published project's project.assets.json; deps: the
#            published app's <app>.deps.json, whose `runtimepack` libraries are
#            the runtime packs a self-contained publish copies into the output
#            (the .NET runtime, the Windows SDK projection) — `{rid}` is filled
#            from the run's Windows target (`--target`) — and whose
#            `runtimeTarget` names the runtime of the app host the published
#            .exe is (Microsoft.NETCore.App.Host.<rid>: the restore's download
#            when it fetched one, else the .NET SDK's own copy at the runtime
#            pack's version, with that pack's id and files).
#   gradle   report: the `gradle :app:dependencies --configuration <c>` output
#            the Android build writes for the release runtime classpath.
#   bundled  dir (where the build staged them, replaced per run by
#            `--set bundled.dir=<dir>`) and components: the binaries the
#            artifact ships that no package resolver lists, each with its
#            name, version, origin, source, licence (an SPDX id inside
#            deny.toml's allow list, or one an exception below passes, with its
#            reading), the binary's file name under `dir` (it
#            must be there) and the licence files its build staged beside it
#            (copied byte for byte; one missing fails the run; none named,
#            and the licence's standard text stands in).
#
# No line names the toolchain's own runtime code: the generator adds it to
# every artifact that links it (its `toolchain` leg) — the Rust standard
# library where an artifact names `rust` (from `rustc -vV` and the sysroot's
# share/doc/rust/COPYRIGHT-library.html), the Go standard library and runtime
# once per Go version its `go` binaries record (LICENSE at `go env GOROOT`,
# asked in the binary's main module, which must be that version).
#
# The roots below were read off the release recipes and workflows on
# 2026-11-12 (justfile tui-release, linux-release, windows-ffi,
# windows-services-release, windows-store-package, apple-ffi-host,
# apple-ffi-store-safe, _android-ffi-flavor, nest, servers-release,
# the wasm-* recipes, the Dockerfile, installer/macos/build.sh). A recipe that
# changes what it builds changes its artifact here in the same commit.

