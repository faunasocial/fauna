# --- Windows ------------------------------------------------------------------

[artifact.windows-msi]
name = "Fauna for Windows"
channel = "Windows MSI"
rust = [
    { packages = ["fauna-ffi"], targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"] },
    { packages = ["fauna-sync-agent"], targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"] },
    { packages = ["fauna-nest-service"], targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"] },
    { packages = ["fauna-bridge-service"], targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"] },
    { packages = ["fauna-shell-ext"], targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"] },
    { packages = ["fauna-tui", "fauna-cli-device"], targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"] },
    # the mail bridge's own FFI library (gnullvm, labeler only)
    { packages = ["fauna-ffi"], no_default_features = true, features = ["labeler"], targets = ["x86_64-pc-windows-gnullvm", "aarch64-pc-windows-gnullvm"] },
]
# `just windows-mail-bridge-build` stages the bridge in target/, away from its
# module; `module` is where the module's local `replace` paths resolve from.
go = { binaries = ["target/fauna-mail-bridge.exe"], module = "bins/fauna-bridges" }
# `deps`: the self-contained publish of `just windows-app-publish` (its
# PUBLISH_DIR, with `{rid}` for its runtime identifier).
nuget = { assets = "apps/fauna-windows/FaunaApp/FaunaApp/obj/project.assets.json", deps = "apps/fauna-windows/FaunaApp/FaunaApp/bin/Release/net10.0-windows10.0.26100/{rid}/publish/FaunaApp.deps.json" }

# The Bridge feature's libunwind.dll (ServiceBridge.wxs), the gnullvm FFI
# library's one runtime dependency outside the OS: `_windows-go-cgo-build` takes
# it from the llvm-mingw toolchain (its target triple's copy) and stages it in
# target/ beside the bridge, with the toolchain's own licence file (its root
# LICENSE.TXT) as llvm-mingw/LICENSE.TXT; release.yml's mail-bridge part carries
# both, and `just windows-msi-notices` points `dir` at the bridge's directory.
# `version` is the LLVM release the toolchain is built from (`clang --version`
# of llvm-mingw 20260616); `origin` and `source` name the llvm-mingw release
# release.yml and the win setup guide pin, which a tier_1 test holds equal.
[artifact.windows-msi.bundled]
dir = "target"

[[artifact.windows-msi.bundled.components]]
name = "libunwind"
version = "22.1.8"
origin = "the llvm-mingw toolchain, release 20260616"
source = "https://github.com/mstorsjo/llvm-mingw/releases/tag/20260616"
licence = "Apache-2.0 WITH LLVM-exception"
binary = "libunwind.dll"
files = ["llvm-mingw/LICENSE.TXT"]

# The mingw-w64 runtime the gnullvm link puts into the mail bridge and its FFI
# library (its startup objects and the static part of its C runtime;
# shipped-notices.md § How the notices file is produced, the toolchain bullet,
# Owed (d)), named as a whole. llvm-mingw builds it from mingw-w64's sources
# and names no mingw-w64 version, so `version` is the toolchain release.
# `_windows-go-cgo-build` stages the licence files the toolchain carries for it
# (<root>/<triple>/share/mingw32/COPYING*) beside the bridge as
# llvm-mingw/mingw32/, and release.yml's mail-bridge part carries them. Its id is
# outside deny.toml's allow list and passes on the exception below.
[[artifact.windows-msi.bundled.components]]
name = "mingw-w64 runtime"
version = "20260616"
origin = "the llvm-mingw toolchain, release 20260616"
source = "https://github.com/mstorsjo/llvm-mingw/releases/tag/20260616"
licence = "LicenseRef-Fedora-Public-Domain AND ZPL-2.1"
binary = "fauna-mail-bridge.exe"
files = [
    "llvm-mingw/mingw32/COPYING",
    "llvm-mingw/mingw32/COPYING.MinGW-w64-runtime.txt",
    "llvm-mingw/mingw32/COPYING.MinGW-w64.txt",
    "llvm-mingw/mingw32/COPYING.winpthreads.txt",
    "llvm-mingw/mingw32/COPYING.winstorecompat.txt",
]

