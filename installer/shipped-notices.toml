# --- Exceptions -----------------------------------------------------------------
# A component whose licence id is missing or outside deny.toml's allow list
# passes only with an entry here carrying its reading. `name` may end in `*`.

[[exception]]
ecosystem = "nuget"
name = "Microsoft.WindowsAppSDK*"
licence = "LicenseRef-Microsoft-WindowsAppSDK"
reading = "The Windows App SDK runtime is under Microsoft's own terms, which permit redistributing it with an application; the package's own licence file is copied into the notices."

[[exception]]
ecosystem = "nuget"
name = "Microsoft.Web.WebView2"
licence = "LicenseRef-Microsoft-WebView2"
reading = "The WebView2 loader is under Microsoft's own terms, which permit redistributing it with an application; the package's own licence file is copied into the notices."

[[exception]]
ecosystem = "nuget"
name = "Microsoft.Windows.SDK.NET.Ref"
licence = "LicenseRef-Microsoft-WindowsSDK"
reading = "The Windows SDK projection (Microsoft.Windows.SDK.NET.dll and WinRT.Runtime.dll), a runtime pack the .NET SDK copies into the published output of an app that targets a Windows version (the published app's deps.json lists it as a runtimepack library). Its nuspec for 10.0.26100.57 declares no licence expression and the package carries no licence file; the nuspec names Microsoft's Windows SDK licence by URL (licenseUrl https://aka.ms/WinSDKLicenseURL, requireLicenseAcceptance true, authors Microsoft; read 2026-11-13). Recorded under those terms; no text is copied, and the entry names them."

[[exception]]
ecosystem = "bundled"
name = "mingw-w64 runtime"
licence = "LicenseRef-Fedora-Public-Domain AND ZPL-2.1"
reading = "The mingw-w64 runtime's startup objects and the static part of its C runtime, which the gnullvm link puts into fauna-mail-bridge.exe and the fauna_ffi.dll beside it, as llvm-mingw 20260616 builds them from mingw-w64's sources (the release names no mingw-w64 version). No package resolver lists it and the toolchain carries no structured licence record. Fedora's package of the same runtime, mingw-crt 14.0.0, declares LicenseRef-Fedora-Public-Domain AND ZPL-2.1 in its spec's License field (src.fedoraproject.org rpms/mingw-crt, rawhide, read 2026-11-13); Arch Linux's mingw-w64-crt 14.0.0 records only LicenseRef-custom (its package API, read the same day). Recorded as Fedora's record declares it, ZPL-2.1 being outside the allow list; ZPL-2.1 asks a redistribution in binary form to reproduce its notice. The five licence files the toolchain carries for mingw-w64 (share/mingw32/COPYING* under its target triple's directory) are copied byte for byte, and the runtime is named as a whole."


[[exception]]
ecosystem = "npm"
name = "@contentauth/c2pa-types"
licence = "MIT"
reading = "The package's package.json declares no licence, and neither the npm registry nor deps.dev records one for 0.7.5. Its registry metadata names its source repository, contentauth/c2pa-js, whose licence GitHub's licence API reports as MIT (spdx_id MIT, read 2026-11-12); @contentauth/c2pa-web 0.15.2, published from the same repository and the web app's direct dependency, declares MIT. Recorded as MIT; the standard MIT text stands in if the package carries no file of its own."

[[exception]]
ecosystem = "go"
name = "github.com/ipfs/bbloom"
licence = "MIT"
reading = "The repository's notices file leaves v0.0.4 unverified (deps.dev holds no licence data for it). ClearlyDefined's definition for go/golang/github.com/ipfs/bbloom v0.0.4 declares MIT, and GitHub's licence API reports MIT (spdx_id MIT) for its source repository, ipfs/bbloom (both read 2026-11-12). The module's own licence file is copied into the notices."

[[exception]]
ecosystem = "go"
name = "github.com/multiformats/go-base36"
licence = "Apache-2.0 AND MIT"
reading = "The repository's notices file leaves v0.2.0 unverified (deps.dev holds no licence data for it), and GitHub's licence API reports NOASSERTION for its source repository, multiformats/go-base36 — a licence file it does not classify. ClearlyDefined's definition for go/golang/github.com/multiformats/go-base36 v0.2.0 declares Apache-2.0 AND MIT (read 2026-11-12), both in the allow list; recorded as ClearlyDefined declares it, the stricter reading of a dual licence. The module's own licence file is copied into the notices."

[[exception]]
ecosystem = "gradle"
name = "com.google.android.gms:*"
licence = "LicenseRef-Google-Android-SDK"
reading = "Google Play services client libraries (pulled in by the Play-distributed build types' store-age arm) are under Google's Android Software Development Kit License Agreement, which permits distributing them as part of an app; their POMs name no licence, so the entry names the terms; an archive's own licence file is copied where it passes the copy limits (core-common's and integrity's are over 256 KiB, left out and reported)."

[[exception]]
ecosystem = "gradle"
name = "com.google.android.play:*"
licence = "LicenseRef-Google-Android-SDK"
reading = "Google Play client libraries (Play Integrity, Play Age Signals and their common core, on the Play-distributed build types only) are under Google's Android Software Development Kit License Agreement and each API's own terms, which permit distributing them as part of an app; their POMs name no licence, so the entry names the terms; an archive's own licence file is copied where it passes the copy limits (core-common's and integrity's are over 256 KiB, left out and reported)."
